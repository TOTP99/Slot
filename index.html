<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#070006" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>万锦🎰老虎机 - TP制作</title>
    <style>
      * {
        -webkit-box-sizing: border-box;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #070006;
        overflow: hidden;
        touch-action: none;
        -ms-touch-action: none;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      body {
        display: -webkit-flex;
        display: flex;
        -webkit-justify-content: center;
        justify-content: center;
        -webkit-align-items: center;
        align-items: center;
      }

      #game-wrapper {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: -webkit-flex;
        display: flex;
        -webkit-justify-content: center;
        justify-content: center;
        -webkit-align-items: center;
        align-items: center;
        background: #070006;
        overflow: hidden;
      }

      #game {
        width: min(100vw, calc(100vh * 16 / 9));
        width: min(100vw, calc(100dvh * 16 / 9));
        height: min(100vh, calc(100vw * 9 / 16));
        height: min(100dvh, calc(100vw * 9 / 16));
        aspect-ratio: 16 / 9;
        display: -webkit-flex;
        display: flex;
        -webkit-justify-content: center;
        justify-content: center;
        -webkit-align-items: center;
        align-items: center;
      }

      #game canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
        -webkit-user-select: none;
        user-select: none;
      }

      /* 竖屏遮罩 + 旋转过渡 */
      #rotate-tip {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 9999;
        display: -webkit-flex;
        display: flex;
        -webkit-align-items: center;
        align-items: center;
        -webkit-justify-content: center;
        justify-content: center;
        -webkit-flex-direction: column;
        flex-direction: column;
        gap: 16px;
        padding: 24px;
        background: rgba(7, 0, 6, 0.94);
        color: #ffd700;
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          "Noto Sans SC", Arial, sans-serif;
        font-size: 18px;
        font-weight: bold;
        text-align: center;
        line-height: 1.6;
        letter-spacing: 1px;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        -webkit-transition: opacity 0.45s ease, visibility 0.45s ease;
        transition: opacity 0.45s ease, visibility 0.45s ease;
        -webkit-backdrop-filter: blur(0px);
        backdrop-filter: blur(0px);
      }

      #rotate-tip.show {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        -webkit-backdrop-filter: blur(6px);
        backdrop-filter: blur(6px);
      }

      #rotate-tip .phone {
        width: 52px;
        height: 88px;
        border: 3px solid #ffd700;
        border-radius: 10px;
        position: relative;
        box-shadow: 0 0 18px rgba(255, 215, 0, 0.35);
        -webkit-animation: phone-rotate 2s ease-in-out infinite;
        animation: phone-rotate 2s ease-in-out infinite;
      }

      #rotate-tip .phone::after {
        content: "";
        position: absolute;
        top: 8px;
        left: 50%;
        -webkit-transform: translateX(-50%);
        transform: translateX(-50%);
        width: 14px;
        height: 3px;
        background: #ffd700;
        border-radius: 2px;
      }

      #rotate-tip .icon {
        font-size: 28px;
        line-height: 1;
      }

      #rotate-tip .cat-art {
        width: min(72vw, 320px);
        height: auto;
        border-radius: 24px;
        border: 4px solid #ffd700;
        box-shadow: 0 0 24px rgba(255, 215, 0, 0.45),
          inset 0 0 12px rgba(255, 215, 0, 0.25);
        -o-object-fit: cover;
        object-fit: cover;
      }

      #rotate-tip .tip-text {
        opacity: 0.95;
      }

      @-webkit-keyframes phone-rotate {
        0%,
        25% {
          -webkit-transform: rotate(0deg);
          transform: rotate(0deg);
        }
        50%,
        75% {
          -webkit-transform: rotate(90deg);
          transform: rotate(90deg);
        }
        100% {
          -webkit-transform: rotate(0deg);
          transform: rotate(0deg);
        }
      }

      @keyframes phone-rotate {
        0%,
        25% {
          -webkit-transform: rotate(0deg);
          transform: rotate(0deg);
        }
        50%,
        75% {
          -webkit-transform: rotate(90deg);
          transform: rotate(90deg);
        }
        100% {
          -webkit-transform: rotate(0deg);
          transform: rotate(0deg);
        }
      }

      #game {
        -webkit-transition: opacity 0.4s ease, -webkit-filter 0.4s ease;
        transition: opacity 0.4s ease, filter 0.4s ease;
      }

      #game.dimmed {
        opacity: 0.15;
        -webkit-filter: blur(3px);
        filter: blur(3px);
        pointer-events: none;
      }
    </style>
  </head>

      function fitTextToBox(
        textObject,
        value,
        maxWidth,
        baseFontSize = 20,
        minFontSize = 12,
      ) {
        if (!textObject) return;

        textObject.setText(value);
        textObject.setFontSize(baseFontSize);

        let size = baseFontSize;

        while (textObject.width > maxWidth && size > minFontSize) {
          size -= 1;
          textObject.setFontSize(size);
        }

      // ---------- 音效（Web Audio） ----------
      class SoundFX {
        constructor() {
          this.ctx = null;
          this.enabled = true;
        }

        init() {
          if (!this.enabled) return;

          if (!this.ctx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return;
            this.ctx = new AC();
          }

          if (this.ctx.state === "suspended") {
            // 必须等待/使用用户手势恢复，避免首个音效经常被浏览器吞掉
            const resumeResult = this.ctx.resume();
            if (resumeResult && typeof resumeResult.catch === "function") {
              resumeResult.catch(() => {});
            }
          }
        }

        warmup() {
          if (!this.enabled) return;
          this.init();
          if (!this.ctx) return;

          try {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(0.00001, this.ctx.currentTime);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.015);
          } catch (e) {}
        }

        quarterBell() {
          // 清脆的双音铃声；即使音效开关刚恢复，也先确保 AudioContext 已唤醒
          if (!this.enabled) return;
          this.init();
          this.beep(1046, 0.16, "sine", 0.075);
          setTimeout(() => this.beep(1318, 0.22, "sine", 0.07), 150);
        }

        beep(freq = 440, duration = 0.1, type = "sine", volume = 0.05) {
          if (!this.enabled) return;

          this.init();
          if (!this.ctx) return;

          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(volume, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            0.001,
            this.ctx.currentTime + duration,
          );

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        }

        click() {
          this.beep(720, 0.045, "square", 0.035);
        }

        // 按键按下：更有“机械键”感的短促音
        buttonPress() {
          this.beep(380, 0.04, "square", 0.06);
          setTimeout(() => this.beep(620, 0.05, "triangle", 0.045), 35);
          setTimeout(() => this.beep(240, 0.06, "sawtooth", 0.03), 70);
        }

        // 短噪声（金属摩擦/撞击底噪）
        noise(duration = 0.08, volume = 0.04) {
          if (!this.enabled) return;
          this.init();
          if (!this.ctx) return;

          const sampleRate = this.ctx.sampleRate;
          const length = Math.floor(sampleRate * duration);
          const buffer = this.ctx.createBuffer(1, length, sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < length; i++) {
            data[i] = (Math.random() * 2 - 1) * (1 - i / length);
          }

          const src = this.ctx.createBufferSource();
          const gain = this.ctx.createGain();
          const filter = this.ctx.createBiquadFilter();

          src.buffer = buffer;
          filter.type = "bandpass";
          filter.frequency.value = 1200;
          filter.Q.value = 0.8;

          gain.gain.setValueAtTime(volume, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            0.001,
            this.ctx.currentTime + duration,
          );

          src.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          src.start();
        }

        // 握住拉杆：抓握 + 金属轻碰
        leverGrip() {
          this.noise(0.05, 0.035);
          this.beep(180, 0.06, "triangle", 0.05);
          setTimeout(() => this.beep(320, 0.04, "square", 0.03), 40);
          setTimeout(() => this.beep(90, 0.08, "sine", 0.04), 70);
        }

        // 拉下拉杆：齿轮拉动 + 重重到位撞击
        leverPull() {
          // 拉动过程：低频摩擦 + 下滑音调
          this.noise(0.18, 0.045);
          this.beep(220, 0.12, "sawtooth", 0.05);

      // ---------- 背景音乐（独立于音效，走 HTML5 Audio） ----------
      // 数字编号模式：按 1.mp3、2.mp3 … 顺序播放，一首放完（或加载失败）
      // 自动接下一个编号，中间缺号自动跳过，到 BG_MUSIC_MAX 后循环回到 1。
      // 以后加歌只需把文件改名为下一个空缺编号并上传，无需改代码。
      class BGMusic {
        constructor() {
          this.currentNum = 1;
          this._skipAttempts = 0; // 连续跳过次数，防止全部文件缺失时死循环

          this.audio = new Audio();
          this.audio.loop = false; // 由 ended/error 事件控制切歌
          this.audio.preload = "auto";
          // 注意：iOS（Safari / 微信内置浏览器等 WKWebView）会直接忽略用 JS 设置的
          // <audio>.volume —— 这个属性在 iOS 上形同虚设，实际音量只能靠硬件音量键。
          // 这就是"滑杆调了但声音没明显变化"的根本原因。
          // 解决办法：把 <audio> 接入 Web Audio API，用 GainNode 来真正控制音量，
          // 这样安卓、iOS、桌面浏览器都能正常生效。
          this.audio.volume = 1; // 固定为1，真正的音量由下面的 gainNode 控制

          const savedVolume = parseFloat(localStorage.getItem("bgMusicVolume"));
          this.volume = isNaN(savedVolume) ? 0.7 : savedVolume; // 滑杆用的线性值（0-1）

          const savedEnabled = localStorage.getItem("bgMusicEnabled");
          this.enabled = savedEnabled === null ? true : savedEnabled === "true"; // 默认开启

          const savedShuffle = localStorage.getItem("bgMusicShuffle");
          this.shuffle = savedShuffle === "true"; // 默认顺序播放（1-9），开启后随机播放

          this._initAudioGraph();

          this.audio.addEventListener("ended", () => this._advance());
          this.audio.addEventListener("error", () => this._advance()); // 该编号文件缺失/加载失败，自动跳到下一个
          this.audio.addEventListener("playing", () => {
            this._skipAttempts = 0; // 成功播放后重置跳过计数
          });

          this._loadTrack(this.currentNum);
        }

        // 把 <audio> 接入 Web Audio API：audio → gainNode → 扬声器
        // 这样调节 gainNode.gain 才能在 iOS 上真正改变播放音量
        _initAudioGraph() {
          try {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return; // 极老旧浏览器兜底，退回 element.volume

            this.audioCtx = new AC();
            this.gainNode = this.audioCtx.createGain();
            this.gainNode.gain.value = this.volume * this.volume; // 加入锥度，让滑杆全程更明显好用

            const source = this.audioCtx.createMediaElementSource(this.audio);
            source.connect(this.gainNode).connect(this.audioCtx.destination);
          } catch (e) {
            this.audioCtx = null;
            this.gainNode = null;
          }
        }

        // 必须在用户手势（点击/触摸/按键）中调用才能真正生效，否则浏览器会保持 suspended
        _resumeAudioGraph() {
          if (this.audioCtx && this.audioCtx.state === "suspended") {
            const p = this.audioCtx.resume();
            if (p && typeof p.catch === "function") p.catch(() => {});
          }
        }

        _loadTrack(num) {
          this.currentNum = num;
          this.audio.src = `${num}.mp3`;
        }

        // 顺序模式：1→2→…→BG_MUSIC_MAX→1 循环；随机模式：在 1~BG_MUSIC_MAX 之间随机挑一个（尽量不重复上一首）
        _pickNext() {
          if (this.shuffle) {
            if (BG_MUSIC_MAX <= 1) return 1;
            let next;
            do {
              next = 1 + Math.floor(Math.random() * BG_MUSIC_MAX);
            } while (next === this.currentNum);
            return next;
          }
          return this.currentNum >= BG_MUSIC_MAX ? 1 : this.currentNum + 1;
        }

        _advance() {
          this._skipAttempts += 1;
          if (this._skipAttempts > BG_MUSIC_MAX) {
            // 连续跳过次数超过总编号数，说明目录里没有任何可用的 mp3，停止尝试避免死循环
            return;
          }
          this._loadTrack(this._pickNext());
          if (this.enabled) {
            const p = this.audio.play();
            if (p && typeof p.catch === "function") p.catch(() => {});
          }
        }

        setShuffle(enabled) {
          this.shuffle = enabled;
          localStorage.setItem("bgMusicShuffle", String(enabled));
        }

        // 需在用户手势（点击/触摸/按键）中调用，否则浏览器会拦截自动播放
        async tryPlay() {
          if (!this.enabled) return;
          this._resumeAudioGraph();
          const p = this.audio.play();
          if (p && typeof p.catch === "function") p.catch(() => {});
        }

        pause() {
          this.audio.pause();
        }

        setEnabled(enabled) {
          this.enabled = enabled;
          localStorage.setItem("bgMusicEnabled", String(enabled));
          if (enabled) {
            this.tryPlay();
          } else {
            this.pause();
          }
        }

        setVolume(v) {
          v = Math.max(0, Math.min(1, v));
          this.volume = v; // 滑杆位置用的线性值
          if (this.gainNode) {
            // 真正生效的音量控制（兼容 iOS）
            this.gainNode.gain.value = v * v; // 加入锥度，接近人耳感知的线性变化
          } else {
            // 极少数不支持 Web Audio 的环境兜底
            this.audio.volume = v * v;
          }
          localStorage.setItem("bgMusicVolume", String(v));
        }
      }

          this.createSettingsModal(); // 赔率 + 速度 / 自动五次 / 音效 设置弹窗
          this.createKeyboardControls();
          this.createAmbientAnimations();
          this.updateDisplay();
        }

        // ---------- 游戏进度：本机浏览器 localStorage 存档 ----------
        // 只保存在当前设备当前浏览器里；换设备/换浏览器/清缓存不会带过去。
        loadGameState() {
          try {
            if (typeof window === "undefined" || !window.localStorage) return;
            const raw = window.localStorage.getItem("wanjin_slot_save");
            if (!raw) return;

            const saved = JSON.parse(raw);
            if (typeof saved.balance === "number") this.balance = saved.balance;
            if (typeof saved.bet === "number") this.bet = saved.bet;
            if (typeof saved.jackpotValue === "number")
              this.jackpotValue = saved.jackpotValue;
          } catch (err) {
            // 没有存档、存档损坏，或浏览器禁用了 localStorage：忽略，使用默认初始值
          }
        }

        saveGameState() {
          try {
            if (typeof window === "undefined" || !window.localStorage) return;
            const payload = JSON.stringify({
              balance: this.balance,
              bet: this.bet,
              jackpotValue: this.jackpotValue,
            });
            window.localStorage.setItem("wanjin_slot_save", payload);
          } catch (err) {
            // 存储空间已满或浏览器禁用了 localStorage：静默忽略，不影响游戏运行
          }
        }

        formatMoney(value) {
          return Number(value).toFixed(2);
        }

        setMessage(value, baseFontSize = 20) {
          fitTextToBox(
            this.messageText,
            value,
            LAYOUT.messageW - 28,
            baseFontSize,
            12,
          );
        }

        createPanel(x, y, width, height, fill = UI.panel, alpha = 0.96) {
          // 外层暗金描边 + 内层面板，形成双线金边高级感
          this.add
            .rectangle(x, y, width + 4, height + 4, UI.goldDim, 0.55)
            .setStrokeStyle(1, UI.gold);
          return this.add
            .rectangle(x, y, width, height, fill, alpha)
            .setStrokeStyle(2, UI.gold);
        }

        // 选项按钮的高亮/常规两态切换样式（设置弹窗中的速度/自动/音效选项复用）
        setControlActive(bg, txt, active) {
          if (active) {
            bg.setFillStyle(UI.activeFill);
            txt.setColor(UI.textDark);
          } else {
            bg.setFillStyle(UI.panelDeep);
            txt.setColor(UI.cream);
          }

        createHeader() {
          const titleObj = this.add
            .text(480, LAYOUT.titleY, "万锦🎤卡拉OK🎰老虎一体机", {
              fontSize: "30px",
              fontStyle: "bold",

            })

          // 金色渐变填充（横向：亮金 -> 标准金 -> 暗金）
          const gradCtx = titleObj.context;
          const gradient = gradCtx.createLinearGradient(
            0,
            0,
            titleObj.width,
            0,
          );
          gradient.addColorStop(0, "#fff3b0");
          gradient.addColorStop(0.5, "#ffd700");

          this.jackpotText = this.add
            .text(

              {

                color: "#ffd700",
                stroke: "#000000",
                strokeThickness: 4,
              },

            .setOrigin(0.5);

        updateLiveClock() {
          if (!this.clockText) return;
          const now = new Date();
          const hh = String(now.getHours()).padStart(2, "0");
          const mm = String(now.getMinutes()).padStart(2, "0");
          const ss = String(now.getSeconds()).padStart(2, "0");
          this.clockText.setText(`${hh}:${mm}:${ss}`);

          // 每个整 15 分钟响一次：00 / 15 / 30 / 45
          const quarterKey = `${now.getFullYear()}-${now.getMonth()}-${now.getDate()}-${now.getHours()}-${Math.floor(now.getMinutes() / 15)}`;
          if (
            now.getSeconds() === 0 &&
            now.getMilliseconds() < 1000 &&
            this.lastQuarterKey !== quarterKey
          ) {
            this.lastQuarterKey = quarterKey;
            this.sfx.quarterBell();
          }
        }

          // 赔率方框外边上方：实时 HH:MM:SS 滚动时钟
          this.clockText = this.add
            .text(x, y - 166, "--:--:--", {
              fontSize: "22px",
              fontStyle: "bold",
              color: "#ffd700",
              stroke: "#000000",
              strokeThickness: 4,
              shadow: {

          fitTextToBox(line1, "赔率 💰", w - 20, 27, 16);
          fitTextToBox(line2, "设置 ⚙", w - 20, 27, 16);

          this.tweens.add({
            targets: [line1, line2],
            y: "-=6",
            duration: 1100,
            yoyo: true,
            repeat: -1,
            ease: "Sine.easeInOut",
          });

          // 分隔细线：标题与下方音乐可视化区之间
          this.add
            .rectangle(x, y - 18, w - 40, 2, UI.gold, 0.35)
            .setOrigin(0.5);

          // ---------- 音乐律动效果（霓虹均衡条） ----------
          // 播放背景音乐时跳动、暂停时变暗静止，纯视觉效果，为方框增添一点情趣
          const barBaseY = y + 44;
          const barMaxH = 46;
          const barColors = [0xffd700, 0xff4da6, 0x40e0ff, 0xff4da6, 0xffd700];
          const barDxs = [-46, -23, 0, 23, 46];

          this.eqGlow = this.add
            .rectangle(x, barBaseY - barMaxH / 2, w - 30, barMaxH + 20, 0xffd700, 0.07)
            .setOrigin(0.5);

          this.eqBars = barDxs.map((dx, i) => {
            const bar = this.add
              .rectangle(x + dx, barBaseY, 11, barMaxH, barColors[i])
              .setOrigin(0.5, 1)
              .setAlpha(0.85);
            return bar;
          });

          this.eqBarTweens = this.eqBars.map((bar, i) =>
            this.tweens.add({
              targets: bar,
              scaleY: { from: 0.16, to: Phaser.Math.FloatBetween(0.55, 1) },
              duration: Phaser.Math.Between(260, 440),
              delay: i * 70,
              yoyo: true,
              repeat: -1,
              ease: "Sine.easeInOut",
              // 每次循环都重新随机一个跳动高度，避免均衡条看起来像固定节拍的机械循环
              onRepeat: (tween) => {
                if (tween.data && tween.data[0]) {
                  tween.data[0].end = Phaser.Math.FloatBetween(0.5, 1);
                }
              },
            }),
          );

          // 霓虹光晕：金 <-> 蓝紫 缓慢呼吸变色
          this.tweens.addCounter({
            from: 0,
            to: 100,
            duration: 1700,
            yoyo: true,
            repeat: -1,
            onUpdate: (tween) => {
              if (!this.eqGlow) return;
              const c = Phaser.Display.Color.Interpolate.ColorWithColor(
                Phaser.Display.Color.ValueToColor(0xffd700),
                Phaser.Display.Color.ValueToColor(0x40e0ff),
                100,
                tween.getValue(),
              );
              this.eqGlow.setFillStyle(
                Phaser.Display.Color.GetColor(c.r, c.g, c.b),
                this.eqGlowAlpha ?? 0.07,
              );
            },
          });

          this.setEqVisualizerActive(bgMusic.enabled);

          this.add
            .text(x, y + h / 2 - 16, "点击进入", {
              fontSize: "12px",
              fontStyle: "bold",
              color: "#ffe9a6",
              stroke: "#000000",
              strokeThickness: 2,
            })
            .setOrigin(0.5)
            .setAlpha(0.75);

          panel.on("pointerover", () => panel.setStrokeStyle(3, 0xfff6b0));
          panel.on("pointerout", () => panel.setStrokeStyle(2, UI.gold));
          panel.on("pointerdown", () => {
            this.sfx.click();
            this.toggleSettingsModal(true);
          });
        }

        createReels() {
          LAYOUT.reelXs.forEach((x, reelIndex) => {

              .rectangle(
                x,
                LAYOUT.reelY,
                LAYOUT.reelFrameW,
                LAYOUT.reelFrameH,
                0xffffff,

            maskShape.fillRect(
              x - LAYOUT.reelFrameW / 2 + 5,
              LAYOUT.reelY - LAYOUT.reelFrameH / 2 + 4,
              LAYOUT.reelFrameW - 10,
              LAYOUT.reelFrameH - 8,
            );

            maskShape.setVisible(false);

            const container = this.add.container(x, LAYOUT.reelY);
            container.setMask(mask);

            const items = [];

            for (let i = -2; i <= 2; i++) {
              const symbol = Phaser.Utils.Array.GetRandom(SYMBOLS);

              const bg = this.add.circle(0, i * 64, 30, 0x000000, 0.18);

              const txt = this.add
                .text(0, i * 64, symbol.label, {
                  fontSize: symbol.label.length > 1 ? "42px" : "52px",
                  fontStyle: "bold",
                  color: symbol.color,
                  stroke: "#000000",
                  strokeThickness: 5,
                })
                .setOrigin(0.5);

              container.add([bg, txt]);
              items.push({ bg, txt, symbol });
            }

            this.reels.push({
              frame,
              container,
              items,
              value: SYMBOLS[reelIndex],
              intervalEvent: null,
              stopped: true,
              forceStopScheduled: false,
            });

        // direction: "out" = 买入（金币从 💵 飞出）；"in" = 提出（金币飞入 💵）
        playCashFlyAnim(direction) {
          if (this.cashIconX === undefined) return;
          const cx = this.cashIconX;
          const cy = this.cashIconY;
          const coinCount = 9;

          this.sfx.coinChime(direction);

          for (let i = 0; i < coinCount; i++) {
            this.time.delayedCall(i * 90, () => {
              const angleDeg = Phaser.Math.Between(-160, -20);
              const angleRad = Phaser.Math.DegToRad(angleDeg);
              const dist = Phaser.Math.Between(45, 75);
              const dx = Math.cos(angleRad) * dist;
              const dy = Math.sin(angleRad) * dist;

              if (direction === "out") {
                const coin = this.add
                  .text(cx, cy, "🪙", { fontSize: "18px" })
                  .setOrigin(0.5)

          // 全屏遮罩，点击空白处关闭
          const overlay = this.add
            .rectangle(0, 0, GAME_WIDTH, GAME_HEIGHT, 0x000000, 0.6)
            .setOrigin(0)
            .setInteractive();
          overlay.on("pointerdown", () => this.toggleCoinModal(false));

          // 弹窗面板
          const panel = this.add
            .rectangle(cx, cy, 300, 190, 0x1a0d02, 0.97)
            .setStrokeStyle(3, 0xffd700);

          const title = this.add
            .text(cx, cy - 70, "💰 筹码操作", {
              fontSize: "20px",
              fontStyle: "bold",
              color: "#ffd700",
              stroke: "#000000",
              strokeThickness: 3,
            })
            .setOrigin(0.5);

          // 买入按钮
          const buyBtn = this.add
            .rectangle(cx, cy - 15, 240, 46, 0x2f7d32)
            .setStrokeStyle(2, 0x9be89b)
            .setInteractive({ useHandCursor: true });
          const buyText = this.add
            .text(cx, cy - 15, "买入 +1000", {
              fontSize: "17px",
              fontStyle: "bold",
              color: "#ffffff",
            })
            .setOrigin(0.5);

          // 提出按钮
          const cashBtn = this.add
            .rectangle(cx, cy + 45, 240, 46, 0x8b0000)
            .setStrokeStyle(2, 0xffb3b3)
            .setInteractive({ useHandCursor: true });
          const cashText = this.add
            .text(cx, cy + 45, "提出 -1000", {
              fontSize: "17px",
              fontStyle: "bold",
              color: "#ffffff",
            })
            .setOrigin(0.5);

          buyBtn.on("pointerover", () => buyBtn.setFillStyle(0x3d9c40));
          buyBtn.on("pointerout", () => buyBtn.setFillStyle(0x2f7d32));
          buyBtn.on("pointerdown", () => {
            this.sfx.buttonPress();
            this.balance += 1000;
            this.updateDisplay();
            this.setMessage("买入成功 +1000");
            this.playCashFlyAnim("out");
            this.toggleCoinModal(false);

              this.setMessage("余额不足，无法提出");

            panel,

            buyBtn,
            buyText,
            cashBtn,
            cashText,
            closeBtn,

        toggleCoinModal(show) {
          this.coinModalGroup.setVisible(show);
        }

        gripLever() {
          if (this.leverState !== "up") return;

          this.leverState = "gripped";
          this.spinHint.setText("再点一次拉动！");
          this.sfx.leverGrip();

          // 清掉旧动画，避免叠化
          this.tweens.killTweensOf(this.leverHand);

          const midX = (this.handRestX + this.handGripX) / 2 + 8;
          const midY = (this.handRestY + this.handGripY) / 2 - 18;

          this.leverHand.setText("✋");
          this.leverHand.setAlpha(0);
          this.leverHand.setPosition(this.handRestX, this.handRestY);
          this.leverHand.setScale(0.85);
          this.leverHand.setAngle(-40);

          // 1) 淡入出现
          this.tweens.add({
            targets: this.leverHand,
            alpha: 1,
            scale: 1.08,
            duration: 120,
            ease: "Sine.easeOut",
          });

          // 2) 弧线接近手柄（先抬后落）
          this.tweens.add({
            targets: this.leverHand,
            x: midX,
            y: midY,
            angle: -22,
            duration: 160,
            delay: 40,
            ease: "Sine.easeOut",
            onComplete: () => {
              // 3) 落到手柄上
              this.tweens.add({
                targets: this.leverHand,
                x: this.handGripX,
                y: this.handGripY,
                angle: -6,
                scale: 1.02,
                duration: 180,
                ease: "Cubic.easeInOut",
                onComplete: () => {
                  // 4) 握紧：换拳头 + 微收
                  this.leverHand.setText("✊");
                  this.tweens.add({
                    targets: this.leverHand,
                    scale: 0.9,
                    angle: -2,
                    duration: 90,
                    ease: "Back.easeIn",
                    onComplete: () => {
                      // 5) 稳住并轻微回弹，更有“抓住”感
                      this.tweens.add({
                        targets: this.leverHand,
                        scale: 0.96,
                        duration: 140,
                        ease: "Sine.easeOut",
                      });
                    },
                  });

                  this.tweens.add({
                    targets: this.leverHandle,
                    scale: 1.1,
                    duration: 90,
                    yoyo: true,
                    ease: "Sine.easeOut",
                  });
                },
              });
            },
          });

          this.setMessage("握住拉杆，再点击一次重重拉下");
        }

        pullLever(thenStart = true) {
          if (this.leverState === "down") return;

          this.leverState = "down";
          this.spinHint.setText("SPACE 急停");
          this.sfx.leverPull();

          this.tweens.killTweensOf(this.leverHand);
          this.tweens.killTweensOf(this.leverContainer);

          this.leverHand.setText("✊");

          // 预备：微微上抬蓄力
          this.tweens.add({
            targets: this.leverHand,
            y: this.handGripY - 6,
            scale: 0.94,
            duration: 70,
            ease: "Sine.easeOut",
            onComplete: () => {
              // 与拉杆同步甩下（略有跟随延迟感）
              this.tweens.add({
                targets: this.leverHand,
                x: this.handGripX + 14,
                y: this.handGripY + 72,
                angle: 32,
                scale: 0.88,
                duration: 300,
                ease: "Cubic.easeIn",
                onComplete: () => {
                  // 撞击后手微震回弹
                  this.tweens.add({
                    targets: this.leverHand,
                    y: this.handGripY + 68,
                    scale: 0.92,
                    duration: 100,
                    ease: "Sine.easeOut",
                  });
                },
              });
            },
          });

          // 拉杆：先轻抬再重压
          this.tweens.add({
            targets: this.leverContainer,
            angle: -22,
            duration: 70,
            ease: "Sine.easeOut",
            onComplete: () => {
              this.tweens.add({
                targets: this.leverContainer,
                angle: 55,
                duration: 300,
                ease: "Cubic.easeIn",
                onComplete: () => {
                  this.cameras.main.shake(120, 0.008);

                  this.tweens.add({
                    targets: this.leverContainer,
                    angle: 48,
                    duration: 100,
                    yoyo: true,
                    ease: "Sine.easeOut",
                  });

                  if (thenStart) {
                    this.startSpin();
                  }
                },
              });
            },
          });
        }

        resetLever() {
          this.leverState = "up";
          this.spinHint.setText("点击握住拉杆");
          this.sfx.leverReset();

          this.tweens.killTweensOf(this.leverHand);
          this.tweens.killTweensOf(this.leverContainer);

          // 松手：张开 → 滑开淡出
          this.leverHand.setText("✋");

          this.tweens.add({
            targets: this.leverHand,
            scale: 1.05,
            angle: 8,
            duration: 100,
            ease: "Sine.easeOut",
            onComplete: () => {
              this.tweens.add({
                targets: this.leverHand,
                alpha: 0,
                x: this.handRestX,
                y: this.handRestY - 10,
                angle: -30,
                scale: 0.9,
                duration: 320,
                ease: "Cubic.easeInOut",
                onComplete: () => {
                  if (this.leverHand) {
                    this.leverHand.setText("✋");
                    this.leverHand.setScale(1);
                  }
                },
              });
            },
          });

          this.tweens.add({
            targets: this.leverContainer,
            angle: -18,
            duration: 420,
            ease: "Back.easeOut",
          });

          this.leverHandle.setFillStyle(0xb8860b);
          this.leverHandle.setStrokeStyle(3, 0xffe566);
        }

        // 赔率弹窗 + 速度 / 自动五次 / 音效 设置（点击"赔率"键弹出）
        // 左右两栏布局：左边赔率表，右边游戏设置，紧凑横向排列
        createSettingsModal() {
          const cx = GAME_WIDTH / 2;
          const cy = GAME_HEIGHT / 2;
          const panelW = 680;
          const panelH = 380;
          const top = cy - panelH / 2;

          this.settingsModalGroup = this.add
            .container(0, 0)
            .setDepth(100)
            .setVisible(false);

          const children = [];

          // 全屏遮罩，点击空白处关闭
          const overlay = this.add
            .rectangle(0, 0, GAME_WIDTH, GAME_HEIGHT, 0x000000, 0.65)
            .setOrigin(0)
            .setInteractive();
          overlay.on("pointerdown", () => this.toggleSettingsModal(false));
          children.push(overlay);

          // 面板本体（拦截点击，避免穿透到遮罩）
          const panel = this.add
            .rectangle(cx, cy, panelW, panelH, 0x1a0d02, 0.97)
            .setStrokeStyle(3, 0xffd700)
            .setInteractive();
          panel.on("pointerdown", (pointer, lx, ly, event) => {
            event.stopPropagation();
          });
          children.push(panel);

          const title = this.add
            .text(cx, top + 24, "赔率与设置", {
              fontSize: "22px",
              fontStyle: "bold",
              color: "#ffd700",
              stroke: "#000000",
              strokeThickness: 3,
            })
            .setOrigin(0.5);
          children.push(title);

          // ---------- 左右两栏坐标 ----------
          const pad = 24;
          const contentLeft = cx - panelW / 2 + pad;
          const contentRight = cx + panelW / 2 - pad;
          const dividerX = cx - 20; // 竖分隔线（略偏左，右侧设置栏多留一些空间）

          const headerY = top + 52;
          const leftHeaderX = (contentLeft + dividerX) / 2;
          const rightHeaderX = (dividerX + contentRight) / 2;

          const leftHeader = this.add
            .text(leftHeaderX, headerY, "赔率", {
              fontSize: "17px",
              fontStyle: "bold",
              color: "#ffe9a6",
            })
            .setOrigin(0.5);
          const rightHeader = this.add
            .text(rightHeaderX, headerY, "设置", {
              fontSize: "17px",
              fontStyle: "bold",
              color: "#ffe9a6",
            })
            .setOrigin(0.5);
          children.push(leftHeader, rightHeader);

          // 表头下方的横向分隔线，贯穿全宽
          const hDividerY = headerY + 18;
          const hDivider = this.add
            .rectangle(cx, hDividerY, panelW - pad * 2, 2, 0xffd700, 0.4)
            .setOrigin(0.5);
          children.push(hDivider);

          const contentTop = hDividerY + 22;

          // ---------- 左栏：三连赔率列表（整体放大约15%，看得更清楚） ----------
          const oddsRowH = 31;
          const listStartY = contentTop;
          SYMBOLS.forEach((symbol, index) => {
            const rowY = listStartY + index * oddsRowH;

            const symText = this.add
              .text(
                contentLeft,
                rowY,
                `${symbol.label}${symbol.label}${symbol.label}`,
                {
                  fontSize: "20px",
                  fontStyle: "bold",
                  color: symbol.color,
                  stroke: "#000000",
                  strokeThickness: 3,
                },
              )
              .setOrigin(0, 0.5);

            const multText = this.add
              .text(dividerX - 12, rowY, `${symbol.multiplier}x`, {
                fontSize: "18px",
                fontStyle: "bold",
                color: "#ffe9a6",
              })
              .setOrigin(1, 0.5);

            children.push(symText, multText);
          });

          // 最下一行：任意一对 2x
          const pairRowY = listStartY + SYMBOLS.length * oddsRowH;
          const pairSymText = this.add
            .text(contentLeft, pairRowY, "任意一对", {
              fontSize: "18px",
              fontStyle: "bold",
              color: UI.cream,
            })
            .setOrigin(0, 0.5);
          const pairMultText = this.add
            .text(dividerX - 12, pairRowY, "2x", {
              fontSize: "18px",
              fontStyle: "bold",
              color: "#ffe9a6",
            })
            .setOrigin(1, 0.5);
          children.push(pairSymText, pairMultText);

          // ---------- 右栏：设置选项 ----------
          const optBtnW = 70;
          const optBtnH = 28;
          const rowLabelX = dividerX + 22;
          const optAX = rowLabelX + 128;
          const optBX = optAX + 78;

          const makeOptionButton = (x, y, label) => {
            const bg = this.add
              .rectangle(x, y, optBtnW, optBtnH, UI.panelDeep, 0.96)
              .setStrokeStyle(2, UI.gold)
              .setInteractive({ useHandCursor: true });
            const txt = this.add
              .text(x, y, label, {
                fontSize: "12px",
                fontStyle: "bold",
                color: UI.cream,
              })
              .setOrigin(0.5);
            children.push(bg, txt);
            return { bg, txt };
          };

          // ---------- 速度：正常 / 加速 ----------
          const speedRowY = contentTop;
          const speedLabel = this.add
            .text(rowLabelX, speedRowY, "速度", {
              fontSize: "15px",
              fontStyle: "bold",
              color: "#ffd700",
            })
            .setOrigin(0, 0.5);
          children.push(speedLabel);

          const normalOpt = makeOptionButton(optAX, speedRowY, "正常");
          const fastOpt = makeOptionButton(optBX, speedRowY, "加速");

          this.speedButtons = [
            { label: "NORMAL", btn: normalOpt.bg, txt: normalOpt.txt },
            { label: "FAST", btn: fastOpt.bg, txt: fastOpt.txt },
          ];

          const selectSpeed = (label) => {
            if (this.isSpinning) return;
            this.sfx.click();
            this.mode = label;
            this.updateSpeedButtons();
            this.setMessage(`速度：${label === "NORMAL" ? "正常" : "加速"}`);
          };

          normalOpt.bg.on("pointerdown", (pointer, lx, ly, event) => {
            event.stopPropagation();
            selectSpeed("NORMAL");
          });
          fastOpt.bg.on("pointerdown", (pointer, lx, ly, event) => {
            event.stopPropagation();
            selectSpeed("FAST");
          });

          this.updateSpeedButtons();

          // ---------- 自动五次：是 / 否 ----------
          const autoRowY = speedRowY + 42;
          const autoLabel = this.add
            .text(rowLabelX, autoRowY, "自动五次", {
              fontSize: "15px",
              fontStyle: "bold",
              color: "#ffd700",
            })
            .setOrigin(0, 0.5);
          children.push(autoLabel);

          const autoYesOpt = makeOptionButton(optAX, autoRowY, "是");
          const autoNoOpt = makeOptionButton(optBX, autoRowY, "否");
          this.autoYesButton = autoYesOpt;
          this.autoNoButton = autoNoOpt;

          autoYesOpt.bg.on("pointerdown", (pointer, lx, ly, event) => {
            event.stopPropagation();
            if (!this.autoPlay) {
              this.sfx.click();
              this.toggleAutoPlay();
            }
          });
          autoNoOpt.bg.on("pointerdown", (pointer, lx, ly, event) => {
            event.stopPropagation();
            if (this.autoPlay) {
              this.sfx.click();
              this.toggleAutoPlay();
            }
          });

          this.updateAutoOptionButtons();

          // ---------- 音效：开启 / 关闭 ----------
          const soundRowY = autoRowY + 42;
          const soundLabel = this.add
            .text(rowLabelX, soundRowY, "音效", {
              fontSize: "15px",
              fontStyle: "bold",
              color: "#ffd700",
            })
            .setOrigin(0, 0.5);
          children.push(soundLabel);

          const soundOnOpt = makeOptionButton(optAX, soundRowY, "开启");
          const soundOffOpt = makeOptionButton(optBX, soundRowY, "关闭");
          this.soundOnButton = soundOnOpt;
          this.soundOffButton = soundOffOpt;

          soundOnOpt.bg.on("pointerdown", (pointer, lx, ly, event) => {
            event.stopPropagation();
            if (!this.sfx.enabled) {
              this.sfx.enabled = true;
              this.sfx.click();
              this.updateSoundOptionButtons();
            }
          });
          soundOffOpt.bg.on("pointerdown", (pointer, lx, ly, event) => {
            event.stopPropagation();
            if (this.sfx.enabled) {
              this.sfx.enabled = false;
              this.updateSoundOptionButtons();
            }
          });

          this.updateSoundOptionButtons();

          // ---------- 音乐：开启 / 关闭 ----------
          const musicRowY = soundRowY + 42;
          const musicLabel = this.add
            .text(rowLabelX, musicRowY, "音乐", {
              fontSize: "15px",
              fontStyle: "bold",
              color: "#ffd700",
            })
            .setOrigin(0, 0.5);
          children.push(musicLabel);

          const musicOnOpt = makeOptionButton(optAX, musicRowY, "开启");
          const musicOffOpt = makeOptionButton(optBX, musicRowY, "关闭");
          this.musicOnButton = musicOnOpt;
          this.musicOffButton = musicOffOpt;

          musicOnOpt.bg.on("pointerdown", (pointer, lx, ly, event) => {
            event.stopPropagation();
            if (!bgMusic.enabled) {
              bgMusic.setEnabled(true);
              this.sfx.click();
              this.updateMusicOptionButtons();
              this.setEqVisualizerActive(true);
            }
          });
          musicOffOpt.bg.on("pointerdown", (pointer, lx, ly, event) => {
            event.stopPropagation();
            if (bgMusic.enabled) {
              bgMusic.setEnabled(false);
              this.sfx.click();
              this.updateMusicOptionButtons();
              this.setEqVisualizerActive(false);
            }
          });

          this.updateMusicOptionButtons();

          // ---------- 播放模式：顺序播放 / 随机播放 ----------
          const shuffleRowY = musicRowY + 40;
          const shuffleLabel = this.add
            .text(rowLabelX, shuffleRowY, "播放模式", {
              fontSize: "15px",
              fontStyle: "bold",
              color: "#ffd700",
            })
            .setOrigin(0, 0.5);
          children.push(shuffleLabel);

          const orderOpt = makeOptionButton(optAX, shuffleRowY, "顺序");
          const shuffleOpt = makeOptionButton(optBX, shuffleRowY, "随机");
          this.orderPlayButton = orderOpt;
          this.shufflePlayButton = shuffleOpt;

          orderOpt.bg.on("pointerdown", (pointer, lx, ly, event) => {
            event.stopPropagation();
            if (bgMusic.shuffle) {
              bgMusic.setShuffle(false);
              this.sfx.click();
              this.updatePlayModeButtons();
            }
          });
          shuffleOpt.bg.on("pointerdown", (pointer, lx, ly, event) => {
            event.stopPropagation();
            if (!bgMusic.shuffle) {
              bgMusic.setShuffle(true);
              this.sfx.click();
              this.updatePlayModeButtons();
            }
          });

          this.updatePlayModeButtons();

          // ---------- 音量：可拖动滑动条 ----------
          // 加粗轨道 + 深色底衬 + 更亮的滑块和光晕，确保在深色背景下清晰可辨
          const volumeRowY = shuffleRowY + 44;
          const volumeLabel = this.add
            .text(rowLabelX, volumeRowY, "音量", {
              fontSize: "15px",
              fontStyle: "bold",
              color: "#ffd700",
            })
            .setOrigin(0, 0.5);
          children.push(volumeLabel);

          const trackX0 = rowLabelX + 50;
          const trackX1 = contentRight - 46;
          const trackW = trackX1 - trackX0;
          const initialRatio = Phaser.Math.Clamp(bgMusic.volume, 0, 1);

          // 深色底衬：清楚划出滑杆整体区域范围
          const volumeTrackBg = this.add
            .rectangle(trackX0 + trackW / 2, volumeRowY, trackW + 14, 18, 0x0a0602, 0.85)
            .setStrokeStyle(1, UI.goldDim, 0.8)
            .setOrigin(0.5);
          children.push(volumeTrackBg);

          // 轨道未填充部分：深棕色，与已填充的亮金部分形成清晰对比
          const volumeTrack = this.add
            .rectangle(trackX0 + trackW / 2, volumeRowY, trackW, 8, 0x3a2408, 1)
            .setStrokeStyle(1, UI.goldDim, 0.6)
            .setOrigin(0.5);
          children.push(volumeTrack);

          const volumeFill = this.add
            .rectangle(
              trackX0,
              volumeRowY,
              Math.max(2, trackW * initialRatio),
              8,
              UI.goldBright,
              1,
            )
            .setOrigin(0, 0.5);
          children.push(volumeFill);

          // 滑块外发光，让手柄位置更醒目
          const volumeHandleGlow = this.add
            .circle(trackX0 + trackW * initialRatio, volumeRowY, 13, 0xffd700, 0.35)
            .setOrigin(0.5);
          children.push(volumeHandleGlow);

          const volumeHandle = this.add
            .circle(trackX0 + trackW * initialRatio, volumeRowY, 10, 0xfff6b0)
            .setStrokeStyle(3, UI.gold);
          children.push(volumeHandle);

          const volumePercentText = this.add
            .text(
              trackX1 + 12,
              volumeRowY,
              `${Math.round(initialRatio * 100)}%`,
              {
                fontSize: "13px",
                fontStyle: "bold",
                color: "#ffffff",
              },
            )
            .setOrigin(0, 0.5);
          children.push(volumePercentText);

          // 更大的透明可点击区域（比可见滑轨高很多），方便手指精准拖动 / 直接点按跳转音量
          const volumeHitZone = this.add
            .rectangle(trackX0 + trackW / 2, volumeRowY, trackW + 30, 36, 0x000000, 0.001)
            .setOrigin(0.5)
            .setInteractive({ useHandCursor: true });
          children.push(volumeHitZone);

          const setVolumeFromPointerX = (pointerX) => {
            const clampedX = Phaser.Math.Clamp(pointerX, trackX0, trackX1);
            const ratio = (clampedX - trackX0) / trackW;
            volumeHandle.x = clampedX;
            volumeHandleGlow.x = clampedX;
            volumeFill.width = Math.max(2, trackW * ratio);
            volumePercentText.setText(`${Math.round(ratio * 100)}%`);
            bgMusic.setVolume(ratio);
          };

          let draggingVolume = false;

          volumeHitZone.on("pointerdown", (pointer, lx, ly, event) => {
            event.stopPropagation();
            draggingVolume = true;
            setVolumeFromPointerX(pointer.x);
            this.tweens.add({
              targets: volumeHandle,
              scale: 1.2,
              duration: 90,
              yoyo: true,
            });
          });

          this.input.on("pointermove", (pointer) => {
            if (draggingVolume) {
              setVolumeFromPointerX(pointer.x);
            }
          });

          this.input.on("pointerup", () => {
            draggingVolume = false;
          });

          // ---------- 左右两栏之间的竖分隔线（按实际内容高度绘制）----------
          const vDividerTop = contentTop - 14;
          const vDividerBottom = volumeRowY + 24;
          const vDivider = this.add
            .rectangle(
              dividerX,
              (vDividerTop + vDividerBottom) / 2,
              2,
              vDividerBottom - vDividerTop,
              0xffd700,
              0.25,
            )
            .setOrigin(0.5);
          children.push(vDivider);

          // ---------- 关闭按钮 ----------
          const closeBtn = this.add
            .text(cx + panelW / 2 - 22, top + 20, "✕", {
              fontSize: "20px",
              fontStyle: "bold",
              color: "#ffe9a6",
            })
            .setOrigin(0.5)
            .setInteractive({ useHandCursor: true });
          closeBtn.on("pointerover", () => closeBtn.setColor("#ffd700"));
          closeBtn.on("pointerout", () => closeBtn.setColor("#ffe9a6"));
          closeBtn.on("pointerdown", (pointer, lx, ly, event) => {
            event.stopPropagation();
            this.toggleSettingsModal(false);
          });
          children.push(closeBtn);

          this.settingsModalGroup.add(children);
        }

        toggleSettingsModal(show) {
          this.settingsModalGroup.setVisible(show);
        }

        updateAutoOptionButtons() {
          if (!this.autoYesButton || !this.autoNoButton) return;
          this.setControlActive(
            this.autoYesButton.bg,
            this.autoYesButton.txt,
            this.autoPlay,
          );
          this.setControlActive(
            this.autoNoButton.bg,
            this.autoNoButton.txt,
            !this.autoPlay,
          );
        }

        updateSoundOptionButtons() {
          if (!this.soundOnButton || !this.soundOffButton) return;
          this.setControlActive(
            this.soundOnButton.bg,
            this.soundOnButton.txt,
            this.sfx.enabled,
          );
          this.setControlActive(
            this.soundOffButton.bg,
            this.soundOffButton.txt,
            !this.sfx.enabled,
          );
        }

        updateMusicOptionButtons() {
          if (!this.musicOnButton || !this.musicOffButton) return;
          this.setControlActive(
            this.musicOnButton.bg,
            this.musicOnButton.txt,
            bgMusic.enabled,
          );
          this.setControlActive(
            this.musicOffButton.bg,
            this.musicOffButton.txt,
            !bgMusic.enabled,
          );
        }

        // 音乐开启：均衡条明亮跳动；音乐关闭：均衡条变暗并回落静止
        setEqVisualizerActive(active) {
          if (!this.eqBars) return;

          this.eqGlowAlpha = active ? 0.07 : 0.025;

          this.eqBars.forEach((bar, i) => {
            const tween = this.eqBarTweens && this.eqBarTweens[i];
            if (active) {
              bar.setAlpha(0.85);
              if (tween) tween.resume();
            } else {
              if (tween) tween.pause();
              this.tweens.add({
                targets: bar,
                scaleY: 0.16,
                alpha: 0.28,
                duration: 220,
                ease: "Sine.easeOut",
              });
            }
          });
        }

        updatePlayModeButtons() {
          if (!this.orderPlayButton || !this.shufflePlayButton) return;
          this.setControlActive(
            this.orderPlayButton.bg,
            this.orderPlayButton.txt,
            !bgMusic.shuffle,
          );
          this.setControlActive(
            this.shufflePlayButton.bg,
            this.shufflePlayButton.txt,
            bgMusic.shuffle,
          );
        }

        updateSpeedButtons() {
          this.speedButtons.forEach(({ label, btn, txt }) => {
            this.setControlActive(btn, txt, label === this.mode);
          });
        }

        createKeyboardControls() {
          this.input.keyboard.on("keydown-SPACE", () => {
            this.sfx.click();
            this.handleSpinInput();
          });
        }

        createAmbientAnimations() {
          this.tweens.add({
            targets: this.machineGlow,
            alpha: 0.22,
            duration: 1300,
            yoyo: true,
            repeat: -1,
          });

          [this.paylineTop, this.paylineMiddle, this.paylineBottom].forEach(
            (line, index) => {
              this.tweens.add({
                targets: line,
                alpha: index === 1 ? 1 : 0.55,
                duration: 900,
                yoyo: true,
                repeat: -1,
              });
            },
          );

          this.tweens.add({
            targets: this.jackpotText,
            scale: 1.04,
            duration: 1000,
            yoyo: true,
            repeat: -1,
          });
        }

        updateDisplay() {
          fitTextToBox(
            this.balanceValue,
            this.formatMoney(this.balance),
            LAYOUT.balanceW - 35,
            21,
            13,
          );

          fitTextToBox(
            this.betValue,
            this.formatMoney(this.bet),
            LAYOUT.betW - 95,
            20,
            12,
          );

          fitTextToBox(
            this.lastWinValue,
            this.formatMoney(this.lastWin),
            LAYOUT.lastWinW - 35,
            21,
            13,
          );

          fitTextToBox(
            this.jackpotText,
            `💎 JACKPOT ${this.formatMoney(this.jackpotValue)}`,
            320,
            21,
            14,
          );

          this.saveGameState();
        }

        changeBet(amount) {
          if (this.isSpinning) return;

          this.sfx.click();

          this.bet = Phaser.Math.Clamp(
            this.bet + amount,
            this.minBet,
            this.maxBet,
          );

          fitTextToBox(
            this.betValue,
            this.formatMoney(this.bet),
            LAYOUT.betW - 95,
            20,
            12,
          );

          // 连续快速点击 +/- 时，先停掉上一次未播完的缩放动画，避免叠加抖动
          this.tweens.killTweensOf(this.betValue);
          this.betValue.setScale(1);
          this.tweens.add({
            targets: this.betValue,
            scale: 1.18,
            duration: 120,
            yoyo: true,
          });
        }

        setBetButtonsEnabled(enabled) {
          if (!this.betMinus || !this.betPlus) return;

          const alpha = enabled ? 1 : 0.45;

          this.betMinus.disableInteractive();
          this.betPlus.disableInteractive();

          if (enabled) {
            this.betMinus.setInteractive({ useHandCursor: true });
            this.betPlus.setInteractive({ useHandCursor: true });
          }

          [
            this.betMinus,
            this.betPlus,
            this.betMinusText,
            this.betPlusText,
          ].forEach((item) => item.setAlpha(alpha));
        }

        toggleAutoPlay() {
          this.autoPlay = !this.autoPlay;

          if (this.autoPlay) {
            this.autoPlayRounds = 0;
            this.updateAutoOptionButtons();
            this.setMessage(`自动模式已开启（${this.maxAutoPlayRounds}次）`);

            if (!this.isSpinning) {
              this.time.delayedCall(350, () => {
                if (this.autoPlay && !this.isSpinning) {
                  this.startSpin();
                }
              });
            }
          } else {
            this.updateAutoButtonOff();
            this.setMessage("自动模式已关闭");
          }
        }

        updateAutoButtonOff() {
          this.updateAutoOptionButtons();
        }

        handleLeverPress(pointer) {
          if (this.inputLocked) return;

          // 正在转：按住拉杆直接急停
          if (this.isSpinning) {
            this.handleSpinInput();
            return;
          }

          if (this.leverState === "up" || this.leverState === "gripped") {
            this.pullLever(true);
          }
        }

        handleSpinInput() {
          if (this.inputLocked) return;

          this.inputLocked = true;

          this.time.delayedCall(220, () => {
            this.inputLocked = false;
          });

          // 正在转：急停
          if (this.isSpinning) {
            if (!this.stopRequested) {
              this.stopRequested = true;
              this.setMessage("正在急停...");

              this.reels.forEach((reel, index) => {
                if (!reel.stopped && !reel.forceStopScheduled) {
                  reel.forceStopScheduled = true;
                  this.time.delayedCall(index * 140, () =>
                    this.stopReel(reel, index),
                  );
                }
              });
            }
            return;
          }

          // 未转：两段式拉杆
          if (this.leverState === "up") {
            this.gripLever();
            return;
          }

          if (this.leverState === "gripped") {
            this.pullLever(true);
            return;
          }
        }

        startSpin() {
          if (this.isSpinning) return;

          if (this.balance < this.bet) {
            this.setMessage("余额不足，无法开始！");
            this.sfx.lose();
            this.autoPlay = false;
            this.updateAutoButtonOff();
            this.resetLever();
            return;
          }

          // 自动模式等：若拉杆未下，直接甩下
          if (this.leverState !== "down") {
            this.leverState = "down";
            this.spinHint.setText("SPACE 急停");
            this.sfx.leverPull();
            this.leverHand.setText("✊");
            this.leverHand.setAlpha(1);
            this.leverHand.setPosition(this.handGripX, this.handGripY);
            this.tweens.add({
              targets: this.leverContainer,
              angle: 48,
              duration: 200,
              ease: "Cubic.easeIn",
            });
            this.tweens.add({
              targets: this.leverHand,
              y: this.handGripY + 70,
              x: this.handGripX + 12,
              angle: 28,
              scale: 0.9,
              duration: 200,
            });
          }

          this.reels.forEach((reel) => {
            if (reel.intervalEvent) {
              reel.intervalEvent.remove(false);
              reel.intervalEvent = null;
            }

            reel.stopped = true;
            reel.forceStopScheduled = false;
            reel.container.y = LAYOUT.reelY;
          });

          this.isSpinning = true;
          this.stopRequested = false;
          this.stoppedReelsCount = 0;
          this.setBetButtonsEnabled(false);

          this.animateBalanceDecrease(this.bet);

          this.jackpotValue += Math.max(1, Math.round(this.bet * 0.05));
          this.updateDisplay();

          if (this.autoPlay) {
            this.autoPlayRounds++;
            this.setMessage(
              `AUTO SPIN ${this.autoPlayRounds}/${this.maxAutoPlayRounds}`,
              18,
            );
          } else {
            const modeLabel = this.mode === "FAST" ? "加速" : "正常";
            this.setMessage(`${modeLabel} 转动中 • 空格急停`, 17);
          }

          this.reels.forEach((reel, index) => {
            this.startReelSpin(reel, index);
          });

          this.cameras.main.shake(90, 0.002);
        }

        animateBalanceDecrease(amount) {
          const startBalance = this.balance;
          const endBalance = this.balance - amount;

          this.balance = endBalance;

          this.tweens.addCounter({
            from: startBalance,
            to: endBalance,
            duration: 320,
            ease: "Cubic.easeOut",
            onUpdate: (tween) => {
              fitTextToBox(
                this.balanceValue,
                this.formatMoney(tween.getValue()),
                LAYOUT.balanceW - 35,
                21,
                13,
              );
            },
            onComplete: () => this.updateDisplay(),
          });

          this.tweens.add({
            targets: this.balanceValue,
            scale: 1.1,
            duration: 140,
            yoyo: true,
          });
        }

        startReelSpin(reel, index) {
          const settings = this.speedSettings[this.mode];

          if (reel.intervalEvent) {
            reel.intervalEvent.remove(false);
            reel.intervalEvent = null;
          }

          reel.stopped = false;
          reel.forceStopScheduled = false;

          reel.frame.setStrokeStyle(4, 0xff0066);

          const stopDelay = settings.duration + index * 320;
          const decelWindow = 260; // 停止前的减速窗口（毫秒），让转轮"滑行进站"而不是硬停
          const spinStartTime = this.time.now;

          reel.intervalEvent = this.time.addEvent({
            delay: settings.interval,
            loop: true,
            callback: () => {
              this.sfx.spinTick();

              // 越接近停止时刻，滚动步长越小，形成自然减速的滑行手感
              const remaining = stopDelay - (this.time.now - spinStartTime);
              const decelRatio =
                remaining < decelWindow
                  ? Math.max(0.25, remaining / decelWindow)
                  : 1;
              const step = settings.step * decelRatio;

              reel.items.forEach((item) => {
                item.txt.y += step;
                item.bg.y += step;

                if (item.txt.y > 128) {
                  const symbol = Phaser.Utils.Array.GetRandom(SYMBOLS);

                  item.symbol = symbol;
                  item.txt.y = -128;
                  item.bg.y = -128;
                  item.txt.setText(symbol.label);
                  item.txt.setColor(symbol.color);
                  item.txt.setFontSize(symbol.label.length > 1 ? 42 : 52);
                }
              });
            },
          });

          this.time.delayedCall(stopDelay, () => {
            // stopReel 内部已对 reel.stopped 做了守卫，急停场景下重复调用是安全的
            this.stopReel(reel, index);
          });
        }

        stopReel(reel, index) {
          if (reel.stopped) return;

          reel.stopped = true;

          if (reel.intervalEvent) {
            reel.intervalEvent.remove(false);
            reel.intervalEvent = null;
          }

          const finalSymbol = this.getControlledResult(index);
          reel.value = finalSymbol;

          reel.items.forEach((item, i) => {
            const randomSymbol = Phaser.Utils.Array.GetRandom(SYMBOLS);

            item.symbol = randomSymbol;
            item.txt.y = (i - 2) * 64;
            item.bg.y = (i - 2) * 64;
            item.txt.setText(randomSymbol.label);
            item.txt.setColor(randomSymbol.color);
            item.txt.setFontSize(randomSymbol.label.length > 1 ? 42 : 52);

            // 非中奖行的符号淡入落位，避免"瞬间贴图切换"的生硬感
            if (i !== 2) {
              item.txt.setAlpha(0.35);
              this.tweens.add({
                targets: item.txt,
                alpha: 1,
                duration: 150,
                ease: "Sine.easeOut",
              });
            }
          });

          const center = reel.items[2];

          center.symbol = finalSymbol;
          center.txt.setText(finalSymbol.label);
          center.txt.setColor(finalSymbol.color);
          center.txt.setFontSize(finalSymbol.label.length > 1 ? 42 : 52);
          center.txt.y = 0;
          center.bg.y = 0;

          this.sfx.reelStop();

          this.tweens.add({
            targets: reel.container,
            y: LAYOUT.reelY + 7,
            duration: 120,
            ease: "Sine.easeOut",
            yoyo: true,
          });

          this.tweens.add({
            targets: center.txt,
            scale: 1.15,
            duration: 140,
            yoyo: true,
          });

          reel.frame.setStrokeStyle(4, 0xffd700);

          this.stoppedReelsCount++;

          if (this.stoppedReelsCount >= this.reels.length) {
            this.time.delayedCall(300, () => {
              this.isSpinning = false;
              this.setBetButtonsEnabled(true);
              this.resetLever();
              this.checkWin();
            });
          }
        }

        // 每个转轮停止时的最终结果：完全随机（当前未做加权/控制概率，预留 index 供未来分轮控制）
        getControlledResult(index) {
          return Phaser.Utils.Array.GetRandom(SYMBOLS);
        }

        checkWin() {
          const [a, b, c] = this.reels.map((reel) => {
            const center = reel.items[2];
            return center.symbol || reel.value;
          });

          const isThreeOfAKind = a.key === b.key && b.key === c.key;
          const isPair = a.key === b.key || a.key === c.key || b.key === c.key;
          const isJackpot = isThreeOfAKind && a.key === "seven";

          if (isJackpot) {
            const win = this.jackpotValue;

            this.balance += win;
            this.lastWin = win;
            this.updateDisplay();

            this.setMessage(`JACKPOT! +${this.formatMoney(win)}`, 18);
            this.playJackpot();
            this.scheduleAutoPlay();
            return;
          }

          if (isThreeOfAKind) {
            const win = this.bet * a.multiplier;

            this.balance += win;
            this.lastWin = win;
            this.updateDisplay();

            this.setMessage(
              `${a.label}${a.label}${a.label} WIN +${this.formatMoney(win)}`,
              18,
            );
            this.playBigWin();
            this.scheduleAutoPlay();
            return;
          }

          if (isPair) {
            const pairSymbol = this.getPairSymbol(a, b, c);
            const win = this.bet * 2;

            this.balance += win;
            this.lastWin = win;
            this.updateDisplay();

            this.setMessage(
              `PAIR ${pairSymbol.label}${pairSymbol.label} +${this.formatMoney(win)}`,
              18,
            );
            this.playSmallWin();
            this.scheduleAutoPlay();
            return;
          }

          this.updateDisplay();
          this.setMessage("未中奖，再试一次！");
          this.sfx.lose();
          this.scheduleAutoPlay();
        }

        getPairSymbol(a, b, c) {
          if (a.key === b.key) return a;
          if (a.key === c.key) return a;
          if (b.key === c.key) return b;

          return a;
        }

        scheduleAutoPlay() {
          if (!this.autoPlay) return;

          if (
            this.autoPlayRounds >= this.maxAutoPlayRounds ||
            this.balance < this.bet
          ) {
            this.autoPlay = false;
            this.updateAutoButtonOff();
            this.setMessage("自动模式已结束");
            return;
          }

          this.time.delayedCall(850, () => {
            if (this.autoPlay && !this.isSpinning) {
              this.startSpin();
            }
          });
        }

        flashLines() {
          [this.paylineTop, this.paylineMiddle, this.paylineBottom].forEach(
            (line) => {
              this.tweens.add({
                targets: line,
                alpha: 1,
                scaleX: 1.07,
                duration: 120,
                yoyo: true,
                repeat: 6,
              });
            },
          );
        }

        playSmallWin() {
          this.sfx.smallWin();
          this.flashLines();

          this.reels.forEach((reel) => {
            this.tweens.add({
              targets: reel.container,
              scale: 1.06,
              duration: 140,
              yoyo: true,
              repeat: 2,
            });
          });
        }

        playBigWin() {
          this.sfx.bigWin();
          this.cameras.main.flash(350, 255, 215, 0);
          this.cameras.main.shake(450, 0.009);
          this.flashLines();

          this.reels.forEach((reel) => {
            reel.frame.setStrokeStyle(6, 0x00ff99);

            this.tweens.add({
              targets: reel.container,
              scale: 1.12,
              duration: 150,
              yoyo: true,
              repeat: 4,
            });
          });

          this.showWinText("BIG WIN!", "#00ff99");
          this.coinExplosion(45);

          this.time.delayedCall(1000, () => {
            this.reels.forEach((reel) =>
              reel.frame.setStrokeStyle(4, 0xffd700),
            );
          });
        }

        playJackpot() {
          this.sfx.jackpot();
          this.cameras.main.flash(600, 255, 215, 0);
          this.cameras.main.shake(800, 0.014);
          this.flashLines();

          this.tweens.add({
            targets: this.jackpotPanel,
            scale: 1.12,
            duration: 180,
            yoyo: true,
            repeat: 7,
          });

          this.showWinText("JACKPOT!", "#ffd700");
          this.coinExplosion(90);

          this.jackpotValue =
            this.baseJackpotValue + Phaser.Math.Between(250, 1250);
          this.updateDisplay();
        }

        showWinText(text, color) {
          const winText = this.add
            .text(470, 145, text, {
              fontSize: "60px",
              fontStyle: "bold",
              color,
              stroke: "#000000",
              strokeThickness: 9,
              shadow: {
                offsetX: 0,
                offsetY: 0,
                color,
                blur: 16,
                fill: true,
              },
            })
            .setOrigin(0.5);

          this.tweens.add({
            targets: winText,
            scale: 1.24,
            alpha: 0,
            duration: 1800,
            ease: "Cubic.easeOut",
            onComplete: () => winText.destroy(),
          });
        }

        // 金币爆散特效：分批生成，避免单帧瞬间创建大量对象造成卡顿（动画更流畅）
        coinExplosion(amount) {
          const batchSize = 15;
          const batches = Math.ceil(amount / batchSize);

          for (let batch = 0; batch < batches; batch++) {
            this.time.delayedCall(batch * 40, () => {
              const count = Math.min(batchSize, amount - batch * batchSize);

              for (let i = 0; i < count; i++) {
                const coin = this.add
                  .text(
                    Phaser.Math.Between(350, 590),
                    Phaser.Math.Between(200, 310),
                    "●",
                    {
                      fontSize: `${Phaser.Math.Between(18, 30)}px`,
                      color: "#ffd700",
                      stroke: "#7a3b00",
                      strokeThickness: 3,
                    },
                  )
                  .setOrigin(0.5);

                this.tweens.add({
                  targets: coin,
                  x: coin.x + Phaser.Math.Between(-300, 300),
                  y: coin.y - Phaser.Math.Between(90, 240),
                  alpha: 0,
                  scale: 1.8,
                  angle: Phaser.Math.Between(-360, 360),
                  duration: Phaser.Math.Between(800, 1400),
                  ease: "Cubic.easeOut",
                  onComplete: () => coin.destroy(),
                });
              }
            });
          }
        }
      }

      // ---------- 启动 ----------
      const config = {
        type: Phaser.AUTO,
        width: GAME_WIDTH,
        height: GAME_HEIGHT,
        parent: "game",
        backgroundColor: "#070006",
        banner: false,
        scale: {
          mode: Phaser.Scale.FIT,
          autoCenter: Phaser.Scale.CENTER_BOTH,
          width: GAME_WIDTH,
          height: GAME_HEIGHT,
        },
        render: {
          antialias: true,
          pixelArt: false,
          roundPixels: false,
        },
        scene: SlotGame,
      };

      const slotGame = new Phaser.Game(config);
      window.__slotGame = slotGame;

      // 首点解锁音频（iOS / 部分 Android 需用户手势）
      function unlockAudioOnce() {
        try {
          // 优先唤醒游戏实际使用的 SoundFX，而不是另开一个马上关闭的 AudioContext
          const gameScene =
            window.__slotGameScene ||
            (window.__slotGame && window.__slotGame.scene && window.__slotGame.scene.getScenes()[0]);
          if (gameScene && gameScene.sfx) {
            gameScene.sfx.enabled = true;
            gameScene.sfx.init();
            gameScene.sfx.warmup();
          } else {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (AC) {
              const ctx = new AC();
              if (ctx.state === "suspended") {
                const r = ctx.resume();
                if (r && typeof r.catch === "function") r.catch(() => {});
              }
            }
          }
        } catch (e) {}
        try {
          bgMusic.tryPlay(); // 首次用户手势时启动背景音乐（若已开启）
        } catch (e) {}
        document.removeEventListener("touchstart", unlockAudioOnce, true);
        document.removeEventListener("mousedown", unlockAudioOnce, true);
        document.removeEventListener("keydown", unlockAudioOnce, true);
      }
      document.addEventListener("touchstart", unlockAudioOnce, true);
      document.addEventListener("mousedown", unlockAudioOnce, true);
      document.addEventListener("keydown", unlockAudioOnce, true);

      function fitGameCanvas() {
        var canvas = document.querySelector("#game canvas");
        if (!canvas) return;
        canvas.style.width = "100%";
        canvas.style.height = "100%";
      }

      window.addEventListener("beforeunload", function () {
        try {
          if (window.__slotGameScene && window.__slotGameScene.clockTimer) {
            clearInterval(window.__slotGameScene.clockTimer);
          }
        } catch (e) {}
      });

      window.addEventListener("resize", function () {
        setTimeout(fitGameCanvas, 50);
      });
      window.addEventListener("orientationchange", function () {
        setTimeout(fitGameCanvas, 120);
      });

      // 横竖屏切换：平滑过渡（兼容无 matchMedia / 旧 iOS）
      (function setupOrientationTransition() {
        var tip = document.getElementById("rotate-tip");
        var game = document.getElementById("game");
        if (!tip || !game) return;

        var lastPortrait = null;

        function apply(portrait, animate) {
          if (portrait === lastPortrait) return;
          lastPortrait = portrait;

          if (portrait) {
            game.classList.add("dimmed");
            if (animate && window.requestAnimationFrame) {
              requestAnimationFrame(function () {
                tip.classList.add("show");
              });
            } else {
              tip.classList.add("show");
            }
          } else {
            tip.classList.remove("show");
            if (animate) {
              setTimeout(function () {
                game.classList.remove("dimmed");
              }, 420);
            } else {
              game.classList.remove("dimmed");
            }
          }
        }

        function isPortrait() {
          try {
            if (window.matchMedia) {
              return window.matchMedia("(orientation: portrait)").matches;
            }
          } catch (e) {}
          return window.innerHeight > window.innerWidth;
        }

        function check(animate) {
          apply(isPortrait(), animate);
        }

        check(false);

        var onChange = function () {
          check(true);
        };
        window.addEventListener("orientationchange", onChange);
        window.addEventListener("resize", onChange);

        try {
          if (window.matchMedia) {
            var mql = window.matchMedia("(orientation: portrait)");
            if (mql.addEventListener) {
              mql.addEventListener("change", onChange);
            } else if (mql.addListener) {
              mql.addListener(onChange);
            }
          }
        } catch (e) {}
      })();
    </script>
  </body>
</html>
