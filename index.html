<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#070006" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>万锦🎰老虎机 - TP制作</title>
    <style>
      * {
        -webkit-box-sizing: border-box;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #070006;
        overflow: hidden;
        touch-action: none;
        -ms-touch-action: none;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      body {
        display: -webkit-flex;
        display: flex;
        -webkit-justify-content: center;
        justify-content: center;
        -webkit-align-items: center;
        align-items: center;
      }

      #game-wrapper {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: -webkit-flex;
        display: flex;
        -webkit-justify-content: center;
        justify-content: center;
        -webkit-align-items: center;
        align-items: center;
        background: #070006;
        overflow: hidden;
      }

      #game {
        width: min(100vw, calc(100vh * 16 / 9));
        width: min(100vw, calc(100dvh * 16 / 9));
        height: min(100vh, calc(100vw * 9 / 16));
        height: min(100dvh, calc(100vw * 9 / 16));
        aspect-ratio: 16 / 9;
        display: -webkit-flex;
        display: flex;
        -webkit-justify-content: center;
        justify-content: center;
        -webkit-align-items: center;
        align-items: center;
      }

      #game canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
        -webkit-user-select: none;
        user-select: none;
      }

      /* 竖屏：留声机主界面（横屏仍为老虎机） */
      #rotate-tip {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: -webkit-flex;
        display: flex;
        -webkit-align-items: center;
        align-items: center;
        -webkit-justify-content: center;
        justify-content: center;
        overflow: hidden;
        padding: max(8px, env(safe-area-inset-top)) 10px max(8px, env(safe-area-inset-bottom));
        background: #070006;
        color: #ffd700;
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          "Noto Sans SC", Arial, sans-serif;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        -webkit-transition: opacity 0.4s ease, visibility 0.4s ease;
        transition: opacity 0.4s ease, visibility 0.4s ease;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      #rotate-tip.show {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }

      /* 竖屏外壳：紧凑科技风 + 85% 缩放 + 金细边 */
      .ph-shell {
        width: 100%;
        max-width: 380px;
        max-height: 100%;
        box-sizing: border-box;
        display: -webkit-flex;
        display: flex;
        -webkit-flex-direction: column;
        flex-direction: column;
        -webkit-align-items: stretch;
        align-items: stretch;
        overflow: hidden;
        padding: 8px 10px 6px;
        background:
          radial-gradient(ellipse at 50% 20%, rgba(80, 50, 10, 0.35) 0%, transparent 55%),
          #070006;
        border: 1px solid #c9a227;
        border-radius: 12px;
        box-shadow:
          0 0 0 1px rgba(255, 215, 0, 0.12),
          inset 0 0 24px rgba(255, 215, 0, 0.04),
          0 0 18px rgba(255, 215, 0, 0.1);
        -webkit-transform: scale(0.85);
        transform: scale(0.85);
        -webkit-transform-origin: center center;
        transform-origin: center center;
      }

      .ph-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 2px 4px;
        flex-shrink: 0;
      }
      .ph-title {
        font-size: 13px;
        font-weight: bold;
        letter-spacing: 2px;
        color: #ffd700;
        text-shadow: 0 0 10px rgba(255, 215, 0, 0.35);
      }
      .ph-clock {
        font-size: 11px;
        color: #c9a227;
        font-variant-numeric: tabular-nums;
        letter-spacing: 1px;
        opacity: 0.9;
      }

      .ph-stage {
        position: relative;
        flex: 0 0 auto;
        height: min(42vw, 200px);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 0 6px;
      }

      .ph-spectrum {
        position: absolute;
        left: 50%;
        top: 50%;
        width: min(70vw, 240px);
        height: min(70vw, 240px);
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 0;
      }

      .ph-vinyl-wrap {
        position: relative;
        width: min(48vw, 168px);
        height: min(48vw, 168px);
        z-index: 1;
      }
      .ph-vinyl {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background:
          repeating-radial-gradient(
            circle at 50% 50%,
            #0c0a08 0,
            #0c0a08 2px,
            #16120e 3px,
            #16120e 5px
          );
        border: 2px solid #c9a227;
        box-shadow:
          0 0 0 1px #5c4010,
          0 0 18px rgba(255, 215, 0, 0.16),
          inset 0 0 40px rgba(0, 0, 0, 0.9);
        position: relative;
        will-change: transform;
      }
      .ph-vinyl::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: radial-gradient(
          circle at 35% 30%,
          rgba(255, 255, 255, 0.07) 0%,
          transparent 42%
        );
        pointer-events: none;
        z-index: 1;
      }
      .ph-vinyl::after {
        content: "";
        position: absolute;
        inset: 18%;
        border-radius: 50%;
        border: 1px solid rgba(255, 215, 0, 0.1);
        box-shadow:
          0 0 0 10px rgba(255, 215, 0, 0.03),
          0 0 0 20px rgba(255, 215, 0, 0.025);
        pointer-events: none;
      }
      .ph-vinyl.playing {
        box-shadow:
          0 0 0 1px #5c4010,
          0 0 28px rgba(255, 215, 0, 0.4),
          0 0 48px rgba(255, 140, 66, 0.12),
          inset 0 0 40px rgba(0, 0, 0, 0.9);
      }
      .ph-label {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 36%;
        height: 36%;
        border-radius: 50%;
        background: radial-gradient(circle, #3a2808 0%, #120a04 70%);
        border: 1.5px solid #ffd700;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 2;
        box-shadow: 0 0 12px rgba(255, 215, 0, 0.25);
        transition: box-shadow 0.4s ease;
      }
      .ph-label.playing {
        box-shadow:
          0 0 18px rgba(255, 215, 0, 0.5),
          0 0 32px rgba(255, 77, 166, 0.12);
        -webkit-animation: label-pulse 2.4s ease-in-out infinite;
        animation: label-pulse 2.4s ease-in-out infinite;
      }
      @-webkit-keyframes label-pulse {
        0%, 100% { transform: translate(-50%, -50%) scale(1); }
        50% { transform: translate(-50%, -50%) scale(1.04); }
      }
      @keyframes label-pulse {
        0%, 100% { transform: translate(-50%, -50%) scale(1); }
        50% { transform: translate(-50%, -50%) scale(1.04); }
      }
      .ph-track-num {
        font-size: 12px;
        font-weight: bold;
        color: #ffd700;
        line-height: 1.1;
        letter-spacing: 0.5px;
      }
      .ph-track-sub {
        display: none;
      }

      .ph-horn {
        position: absolute;
        left: 0;
        top: -4%;
        font-size: clamp(28px, 11vw, 44px);
        line-height: 1;
        z-index: 3;
        filter: drop-shadow(0 3px 10px rgba(0, 0, 0, 0.65));
        pointer-events: none;
        transform-origin: 70% 90%;
        transform: rotate(-18deg);
        transition: filter 0.4s ease;
        opacity: 0.92;
      }
      .ph-horn.playing {
        -webkit-animation: horn-sway 3.2s ease-in-out infinite;
        animation: horn-sway 3.2s ease-in-out infinite;
        filter: drop-shadow(0 3px 14px rgba(255, 215, 0, 0.22));
      }
      @-webkit-keyframes horn-sway {
        0%, 100% { transform: rotate(-18deg) translateY(0); }
        50% { transform: rotate(-14deg) translateY(-2px); }
      }
      @keyframes horn-sway {
        0%, 100% { transform: rotate(-18deg) translateY(0); }
        50% { transform: rotate(-14deg) translateY(-2px); }
      }

      .ph-arm {
        position: absolute;
        right: 4%;
        top: 8%;
        width: 42%;
        height: 42%;
        z-index: 4;
        transform-origin: 92% 12%;
        transition: transform 0.55s cubic-bezier(0.34, 1.3, 0.64, 1);
        pointer-events: none;
      }
      .ph-arm-pivot {
        position: absolute;
        right: 0;
        top: 0;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #ffe566, #8a7040);
        border: 1.5px solid #ffd700;
        box-shadow: 0 0 6px rgba(255, 215, 0, 0.4);
        z-index: 2;
      }
      .ph-arm-rod {
        position: absolute;
        right: 5px;
        top: 6px;
        width: 72%;
        height: 3.5px;
        border-radius: 2px;
        background: linear-gradient(90deg, #c9a227, #ffe566 40%, #8a7040);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        transform-origin: right center;
        transform: rotate(48deg);
      }
      .ph-arm-head {
        position: absolute;
        left: 8%;
        top: 52%;
        width: 11px;
        height: 14px;
        border-radius: 2px;
        background: linear-gradient(180deg, #ddd, #888 60%, #444);
        border: 1px solid #ffd700;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.45);
      }
      .ph-arm.up { transform: rotate(-38deg); }
      .ph-arm.down { transform: rotate(12deg); }
      .ph-arm.down .ph-arm-head {
        box-shadow:
          0 0 8px rgba(255, 215, 0, 0.45),
          0 2px 5px rgba(0, 0, 0, 0.45);
      }

      .ph-controls {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
        margin-bottom: 8px;
      }
      .ph-transport {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      .ph-btn {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        border: 1px solid rgba(201, 162, 39, 0.7);
        background: linear-gradient(160deg, #1a1008 0%, #0a0406 100%);
        color: #ffd700;
        font-size: 13px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow:
          inset 0 1px 0 rgba(255, 215, 0, 0.12),
          0 0 8px rgba(255, 215, 0, 0.08);
        padding: 0;
      }
      .ph-btn:active {
        transform: scale(0.94);
        border-color: #ffd700;
        background: #2a1808;
      }
      .ph-btn-main {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        font-size: 16px;
        border: 1.5px solid #ffd700;
        background:
          radial-gradient(circle at 40% 30%, rgba(255, 215, 0, 0.2), transparent 55%),
          linear-gradient(160deg, #2a1c08, #0c0604);
        box-shadow:
          0 0 14px rgba(255, 215, 0, 0.28),
          inset 0 0 10px rgba(255, 215, 0, 0.08);
      }
      .ph-modes {
        display: flex;
        gap: 8px;
      }
      .ph-chip {
        padding: 4px 12px;
        border-radius: 6px;
        border: 1px solid rgba(184, 134, 11, 0.65);
        background: #0a0406;
        color: #c9a227;
        font-size: 11px;
        font-weight: bold;
        letter-spacing: 1px;
        cursor: pointer;
        min-width: 52px;
        text-align: center;
      }
      .ph-chip.on {
        background: linear-gradient(180deg, rgba(201, 168, 76, 0.35), rgba(80, 50, 10, 0.5));
        color: #ffe566;
        border-color: #ffd700;
        box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
      }

      .ph-mini {
        flex-shrink: 0;
        padding: 8px 8px 6px;
        border: 1px solid rgba(201, 162, 39, 0.55);
        border-radius: 10px;
        background:
          linear-gradient(180deg, rgba(26, 13, 2, 0.95) 0%, rgba(8, 0, 4, 0.98) 100%);
        box-shadow: inset 0 0 16px rgba(255, 215, 0, 0.05);
      }
      .ph-mini-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 11px;
        color: #c9a227;
        margin-bottom: 6px;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.5px;
      }
      .ph-mini-title {
        display: none;
      }
      .ph-reels {
        display: flex;
        justify-content: center;
        gap: 6px;
        margin-bottom: 6px;
      }
      .ph-reel {
        width: 48px;
        height: 48px;
        border-radius: 8px;
        border: 1px solid rgba(255, 215, 0, 0.55);
        background: #0c0008;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        line-height: 1;
        box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.6);
      }
      .ph-reel-sub {
        display: none;
      }
      .ph-spin {
        display: block;
        width: 100%;
        max-width: 140px;
        margin: 0 auto;
        padding: 7px 0;
        border: 1px solid #ffd700;
        border-radius: 8px;
        background:
          linear-gradient(180deg, rgba(224, 192, 96, 0.95), rgba(138, 112, 64, 0.95));
        color: #1a1000;
        font-size: 13px;
        font-weight: bold;
        letter-spacing: 3px;
        cursor: pointer;
        box-shadow:
          0 0 12px rgba(255, 215, 0, 0.25),
          inset 0 1px 0 rgba(255, 255, 255, 0.25);
      }
      .ph-spin:active {
        transform: translateY(1px);
        filter: brightness(0.92);
      }
      .ph-spin:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .ph-msg {
        text-align: center;
        font-size: 10px;
        color: #c9a227;
        margin-top: 5px;
        min-height: 1em;
        letter-spacing: 0.5px;
        opacity: 0.85;
      }
      .ph-foot {
        display: none;
      }

      #game {
        -webkit-transition: opacity 0.4s ease, -webkit-filter 0.4s ease;
        transition: opacity 0.4s ease, filter 0.4s ease;
      }

      #game.dimmed {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>

  <body>
    <div id="rotate-tip">
      <div class="ph-shell">
      <div class="ph-top">
        <div class="ph-title">万锦</div>
        <div class="ph-clock" id="ph-clock">--:--</div>
      </div>

      <div class="ph-stage">
        <canvas class="ph-spectrum" id="ph-spectrum" width="360" height="360"></canvas>
        <div class="ph-horn" id="ph-horn" aria-hidden="true">📯</div>
        <div class="ph-vinyl-wrap">
          <div class="ph-vinyl" id="ph-vinyl"></div>
          <div class="ph-label" id="ph-label">
            <div class="ph-track-num" id="ph-track-num">01/18</div>
          </div>
          <div class="ph-arm up" id="ph-arm" aria-hidden="true">
            <div class="ph-arm-pivot"></div>
            <div class="ph-arm-rod"></div>
            <div class="ph-arm-head"></div>
          </div>
        </div>
      </div>

      <div class="ph-controls">
        <div class="ph-transport">
          <button type="button" class="ph-btn" id="ph-prev" aria-label="上一首">⏮</button>
          <button type="button" class="ph-btn ph-btn-main" id="ph-play" aria-label="播放暂停">▶</button>
          <button type="button" class="ph-btn" id="ph-next" aria-label="下一首">⏭</button>
        </div>
        <div class="ph-modes">
          <button type="button" class="ph-chip on" id="ph-order">顺序</button>
          <button type="button" class="ph-chip" id="ph-shuffle">随机</button>
        </div>
      </div>

      <div class="ph-mini">
        <div class="ph-mini-head">
          <span id="ph-balance">¥0</span>
          <span id="ph-bet">¥50</span>
        </div>
        <div class="ph-reels">
          <div class="ph-reel" id="ph-r0"><span>7️⃣</span></div>
          <div class="ph-reel" id="ph-r1"><span>🌸</span></div>
          <div class="ph-reel" id="ph-r2"><span>🍒</span></div>
        </div>
        <button type="button" class="ph-spin" id="ph-spin">SPIN</button>
        <div class="ph-msg" id="ph-msg"></div>
      </div>
      </div>
    </div>
    <div id="game-wrapper">
      <div id="game"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <script>
      /**
       * 万锦老虎机 - 单文件版
       * 操作：拉杆 / SPIN / 空格 一点即转；转动中再次操作急停
       */

      // ---------- 常量 ----------
      const GAME_WIDTH = 960;
      const GAME_HEIGHT = 540;

      const SYMBOLS = [
        { key: "seven", label: "7️⃣", color: "#ff2d2d", multiplier: 50 },
        { key: "blossom", label: "🌸", color: "#ff8fab", multiplier: 20 },
        { key: "hibiscus", label: "🌺", color: "#ff4d6d", multiplier: 15 },
        { key: "grape", label: "🍇", color: "#9b5de5", multiplier: 10 },
        { key: "strawberry", label: "🍓", color: "#ff2d55", multiplier: 8 },
        { key: "cherry", label: "🍒", color: "#e63946", multiplier: 6 },
        { key: "mushroom", label: "🍄", color: "#c77dff", multiplier: 4 },
      ];

      // ---------- 布局坐标 ----------
      const LAYOUT = {
        titleY: 28,
        subtitleY: 61,
        jackpotY: 94,

        paytableX: 112,
        paytableY: 280,
        paytableW: 170,
        paytableH: 248,

        machineX: 470,
        machineY: 270,
        machineOuterW: 560,
        machineOuterH: 255,
        machineInnerW: 520,
        machineInnerH: 208,
        reelFrameW: 150,
        reelFrameH: 170,
        reelXs: [350, 470, 590],
        reelY: 270,

        messageX: 470,
        messageY: 402,
        messageW: 405,
        messageH: 40,

        balanceX: 130,
        balanceY: 456,
        balanceW: 200,
        balanceH: 50,

        betX: 355,
        betY: 456,
        betW: 190,
        betH: 50,

        lastWinX: 580,
        lastWinY: 456,
        lastWinW: 200,
        lastWinH: 50,

        rightPanelX: 855,
      };

      // ---------- UI 配色（高级金边主题） ----------
      const UI = {
        bg: 0x070006,
        panel: 0x140008,
        panelDeep: 0x0c0006,
        gold: 0xffd700,
        goldDim: 0xb8860b,
        goldBright: 0xffe566,
        cream: "#ffe9a6",
        creamHex: 0xffe9a6,
        textDark: "#1a0a00",
        danger: 0x8b0015,
        activeFill: 0xc9a84c,
      };

      // ---------- 文本适配 ----------
      function fitTextToBox(
        textObject,
        value,
        maxWidth,
        baseFontSize = 20,
        minFontSize = 12,
      ) {
        if (!textObject) return;

        textObject.setText(value);
        textObject.setFontSize(baseFontSize);

        let size = baseFontSize;

        while (textObject.width > maxWidth && size > minFontSize) {
          size -= 1;
          textObject.setFontSize(size);
        }
      }

      // ---------- 背景音乐歌单清单 ----------
      // 加歌方式：把 mp3 文件改名为 1.mp3、2.mp3 …按你想要的播放顺序编号，
      // 放进和 index.html 同一个目录即可，以后无需再改这里的代码。
      // 播放时按数字从小到大依次尝试；如果某个编号的文件缺失，会自动跳过找下一个，
      // 直到编号 BG_MUSIC_MAX 结束后循环回到 1。
      const BG_MUSIC_MAX = 18; // 支持的最大编号（对应 1.mp3 ~ 18.mp3），全部 18 首参与循环播放

      // ---------- 音效（Web Audio） ----------
      class SoundFX {
        constructor() {
          this.ctx = null;
          this.enabled = true;
        }

        init() {
          if (!this.enabled) return;

          if (!this.ctx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return;
            this.ctx = new AC();
          }

          if (this.ctx.state === "suspended") {
            // 必须等待/使用用户手势恢复，避免首个音效经常被浏览器吞掉
            const resumeResult = this.ctx.resume();
            if (resumeResult && typeof resumeResult.catch === "function") {
              resumeResult.catch(() => {});
            }
          }
        }

        warmup() {
          if (!this.enabled) return;
          this.init();
          if (!this.ctx) return;

          try {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(0.00001, this.ctx.currentTime);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.015);
          } catch (e) {}
        }

        quarterBell() {
          // 清脆的双音铃声；即使音效开关刚恢复，也先确保 AudioContext 已唤醒
          if (!this.enabled) return;
          this.init();
          this.beep(1046, 0.16, "sine", 0.075);
          setTimeout(() => this.beep(1318, 0.22, "sine", 0.07), 150);
        }

        beep(freq = 440, duration = 0.1, type = "sine", volume = 0.05) {
          if (!this.enabled) return;

          this.init();
          if (!this.ctx) return;

          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(volume, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            0.001,
            this.ctx.currentTime + duration,
          );

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        }

        click() {
          this.beep(720, 0.045, "square", 0.035);
        }

        // 按键按下：更有“机械键”感的短促音
        buttonPress() {
          this.beep(380, 0.04, "square", 0.06);
          setTimeout(() => this.beep(620, 0.05, "triangle", 0.045), 35);
          setTimeout(() => this.beep(240, 0.06, "sawtooth", 0.03), 70);
        }

        // 短噪声（金属摩擦/撞击底噪）
        noise(duration = 0.08, volume = 0.04) {
          if (!this.enabled) return;
          this.init();
          if (!this.ctx) return;

          const sampleRate = this.ctx.sampleRate;
          const length = Math.floor(sampleRate * duration);
          const buffer = this.ctx.createBuffer(1, length, sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < length; i++) {
            data[i] = (Math.random() * 2 - 1) * (1 - i / length);
          }

          const src = this.ctx.createBufferSource();
          const gain = this.ctx.createGain();
          const filter = this.ctx.createBiquadFilter();

          src.buffer = buffer;
          filter.type = "bandpass";
          filter.frequency.value = 1200;
          filter.Q.value = 0.8;

          gain.gain.setValueAtTime(volume, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            0.001,
            this.ctx.currentTime + duration,
          );

          src.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          src.start();
        }

        // 握住拉杆：抓握 + 金属轻碰
        leverGrip() {

      // ---------- 背景音乐（独立于音效，走 HTML5 Audio） ----------
      // 数字编号模式：按 1.mp3、2.mp3 … 顺序播放，一首放完（或加载失败）
      // 自动接下一个编号，中间缺号自动跳过，到 BG_MUSIC_MAX 后循环回到 1。
      // 以后加歌只需把文件改名为下一个空缺编号并上传，无需改代码。
      class BGMusic {
        constructor() {
          this.currentNum = 1;
          this._skipAttempts = 0; // 连续跳过次数，防止全部文件缺失时死循环

          this.audio = new Audio();
          this.audio.loop = false; // 由 ended/error 事件控制切歌
          this.audio.preload = "auto";
          // 注意：不要设 crossOrigin=anonymous，本地/无 CORS 的 mp3 会被静音或加载失败
          this.audio.volume = 0.5; // 固定音量（无滑杆；iOS 上 <audio>.volume 仍受系统限制）

          const savedEnabled = localStorage.getItem("bgMusicEnabled");
          this.enabled = savedEnabled === null ? true : savedEnabled === "true"; // 默认开启

          const savedShuffle = localStorage.getItem("bgMusicShuffle");
          this.shuffle = savedShuffle === "true"; // 默认顺序播放，开启后随机播放

          // Web Audio 分析：频谱 → 均衡条（声高 / 情绪 / 男女声区 / 乐器频段）
          this.ctx = null;
          this.analyser = null;
          this._source = null;
          this._freqData = null;
          this._connected = false;

          // 五频段平滑值：低音乐器 / 男声区 / 主旋律 / 女声区 / 高频空气
          this.bands = [0, 0, 0, 0, 0];
          this.energy = 0; // 整体响度 0~1
          this.brightness = 0; // 频谱重心偏高→亮/兴奋；偏低→暖/沉稳
          this.vocalBias = 0; // <0 偏男声区能量，>0 偏女声区
          this._playing = false;
          this._bandBins = null;
          this._analyserFailed = false;

          this.audio.addEventListener("ended", () => this._advance());
          this.audio.addEventListener("error", () => this._advance()); // 该编号文件缺失/加载失败，自动跳到下一个
          this.audio.addEventListener("playing", () => {
            this._skipAttempts = 0; // 成功播放后重置跳过计数
          });

          this._loadTrack(this.currentNum);
        }

        // 须在用户手势中调用。成功则走 Web Audio 分析；失败则保持原生 <audio> 出声
        ensureAnalyser() {
          if (this._connected) {
            this._resumeCtx();
            return true;
          }
          if (this._analyserFailed) return false;
          try {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) {
              this._analyserFailed = true;
              return false;
            }
            if (!this.ctx) this.ctx = new AC();
            this._resumeCtx();
            if (!this.analyser) {
              this.analyser = this.ctx.createAnalyser();
              this.analyser.fftSize = 256;
              this.analyser.smoothingTimeConstant = 0.6;
              this._freqData = new Uint8Array(this.analyser.frequencyBinCount);
              this._rebuildBandBins();
            }
            if (!this._source) {
              // 每个 <audio> 只能 createMediaElementSource 一次；之后必须经 destination 才能出声
              this._source = this.ctx.createMediaElementSource(this.audio);
              this._source.connect(this.analyser);
              this.analyser.connect(this.ctx.destination);
            }
            this._connected = true;
            return true;
          } catch (e) {
            // 接管失败：不破坏原生播放，频谱走伪数据
            this._analyserFailed = true;
            this._connected = false;
            return false;
          }
        }

        _resumeCtx() {
          if (this.ctx && this.ctx.state === "suspended") {
            const r = this.ctx.resume();
            if (r && typeof r.catch === "function") r.catch(() => {});
          }
        }

        _playAudio() {
          this._resumeCtx();
          try {
            const p = this.audio.play();
            if (p && typeof p.catch === "function") {
              p.catch(() => {
                // 自动播放被拦或文件缺失：静默，等下次用户手势
              });
            }
          } catch (e) {}
        }

        // 预计算 Hz→bin 区间，避免每帧 floor/ceil
        _rebuildBandBins() {
          if (!this.analyser || !this.ctx) return;
          const n = this.analyser.frequencyBinCount;
          const binHz = this.ctx.sampleRate / this.analyser.fftSize;
          // 低音/鼓 · 男声区 · 主旋律 · 女声区 · 高频空气
          const ranges = [
            [40, 120],
            [120, 320],
            [320, 1200],
            [1200, 4000],
            [4000, 12000],
          ];
          this._bandBins = ranges.map(([lo, hi]) => [
            Math.max(0, Math.floor(lo / binHz)),
            Math.min(n - 1, Math.ceil(hi / binHz)),
          ]);
        }

        // 由场景按 ~30fps 调用：频谱 → 5 条 + 情绪指标
        sampleSpectrum() {
          const playing =
            this.enabled &&
            this.audio &&
            !this.audio.paused &&
            !this.audio.ended &&
            this.audio.currentTime > 0;
          this._playing = playing;

          if (!playing) {
            for (let i = 0; i < 5; i++) this.bands[i] *= 0.88;
            this.energy *= 0.9;
            this.brightness *= 0.92;
            this.vocalBias *= 0.92;
            return this.bands;
          }

          if (this._connected && this.analyser && this._freqData) {
            this.analyser.getByteFrequencyData(this._freqData);
            const data = this._freqData;
            if (!this._bandBins) this._rebuildBandBins();
            const bins = this._bandBins;

            for (let b = 0; b < 5; b++) {
              const a = bins[b][0];
              const c = bins[b][1];
              let sum = 0;
              const count = c - a + 1;
              for (let i = a; i <= c; i++) sum += data[i];
              const avg = sum / count / 255;
              // 软曲线近似 pow(x,0.85)，避免 Math.pow
              let v = avg * 1.35;
              if (v > 1) v = 1;
              v = v * (0.85 + 0.15 * v);
              this.bands[b] = this.bands[b] * 0.55 + v * 0.45;
            }

            const e =
              (this.bands[0] +
                this.bands[1] +
                this.bands[2] +
                this.bands[3] +
                this.bands[4]) *
              0.2;
            this.energy = this.energy * 0.6 + e * 0.4;

            const bright =
              (this.bands[3] * 0.45 + this.bands[4] * 0.55) /
              (this.bands[0] * 0.5 + this.bands[1] * 0.3 + 0.15);
            this.brightness =
              this.brightness * 0.7 + (bright > 1.4 ? 1.4 : bright) * 0.3;

            this.vocalBias =
              this.vocalBias * 0.75 + (this.bands[3] - this.bands[1]) * 0.25;
          } else {
            // 无分析器：轻量伪频谱
            const t = performance.now() * 0.001;
            const pulse = 0.35 + 0.25 * Math.sin(t * 4.2);
            const raw0 = pulse * (0.7 + 0.3 * Math.sin(t * 2.1));
            const raw1 = pulse * (0.45 + 0.25 * Math.sin(t * 3.3 + 1));
            const raw2 = pulse * (0.55 + 0.3 * Math.sin(t * 5.1 + 2));
            const raw3 = pulse * (0.4 + 0.35 * Math.sin(t * 6.7 + 0.5));
            const raw4 = pulse * (0.3 + 0.4 * Math.sin(t * 8.9 + 1.2));
            this.bands[0] = this.bands[0] * 0.7 + raw0 * 0.3;
            this.bands[1] = this.bands[1] * 0.7 + raw1 * 0.3;
            this.bands[2] = this.bands[2] * 0.7 + raw2 * 0.3;
            this.bands[3] = this.bands[3] * 0.7 + raw3 * 0.3;
            this.bands[4] = this.bands[4] * 0.7 + raw4 * 0.3;
            this.energy = this.energy * 0.7 + pulse * 0.3;
            this.brightness = 0.5;
            this.vocalBias = 0;
          }

          return this.bands;
        }

        isPlaying() {
          // 以真实 audio 状态为准，避免仅依赖采样缓存导致 UI/逻辑误判
          try {
            return (
              !!this.enabled &&
              !!this.audio &&
              !this.audio.paused &&
              !this.audio.ended
            );
          } catch (e) {
            return !!this._playing;
          }
        }

        _loadTrack(num) {
          this.currentNum = num;
          this.audio.src = `${num}.mp3`;
        }

        // 顺序模式：1→2→…→BG_MUSIC_MAX→1 循环；随机模式：在 1~BG_MUSIC_MAX 之间随机挑一个（尽量不重复上一首）
        _pickNext() {
          if (this.shuffle) {
            if (BG_MUSIC_MAX <= 1) return 1;
            let next;
            do {
              next = 1 + Math.floor(Math.random() * BG_MUSIC_MAX);
            } while (next === this.currentNum);
            return next;
          }
          return this.currentNum >= BG_MUSIC_MAX ? 1 : this.currentNum + 1;
        }

        _advance() {
          this._skipAttempts += 1;
          if (this._skipAttempts > BG_MUSIC_MAX) {
            // 连续跳过次数超过总编号数，说明目录里没有任何可用的 mp3，停止尝试避免死循环
            return;
          }
          this._loadTrack(this._pickNext());
          if (this.enabled) this._playAudio();
        }

        setShuffle(enabled) {
          this.shuffle = enabled;
          localStorage.setItem("bgMusicShuffle", String(enabled));
        }

        skipNext() {
          this._skipAttempts = 0;
          this._loadTrack(this._pickNext());
          if (this.enabled) this._playAudio();
        }

        skipPrev() {
          this._skipAttempts = 0;
          let prev;
          if (this.shuffle) {
            prev = this._pickNext();
          } else {
            prev = this.currentNum <= 1 ? BG_MUSIC_MAX : this.currentNum - 1;
          }
          this._loadTrack(prev);
          if (this.enabled) this._playAudio();
        }

        async togglePlay() {
          if (!this.audio) return;
          this.ensureAnalyser();
          if (!this.audio.paused && !this.audio.ended) {
            this.audio.pause();
            return;
          }
          if (!this.enabled) {
            this.enabled = true;
            localStorage.setItem("bgMusicEnabled", "true");
          }
          this._playAudio();
        }

        // 需在用户手势（点击/触摸/按键）中调用，否则浏览器会拦截自动播放
        async tryPlay() {
          if (!this.enabled) return;
          this.ensureAnalyser();
          this._playAudio();
        }

        pause() {
          try {
            this.audio.pause();
          } catch (e) {}
        }

        setEnabled(enabled) {
          this.enabled = enabled;
          localStorage.setItem("bgMusicEnabled", String(enabled));
          if (enabled) {
            this.tryPlay();
          } else {
            this.pause();
          }
        }
      }

        loadGameState() {
          try {
            if (typeof window === "undefined" || !window.localStorage) return;
            const raw = window.localStorage.getItem("wanjin_slot_save");
            if (!raw) return;

            const saved = JSON.parse(raw);
            if (typeof saved.balance === "number") this.balance = saved.balance;
            if (typeof saved.bet === "number") this.bet = saved.bet;
            if (typeof saved.jackpotValue === "number")
              this.jackpotValue = saved.jackpotValue;
          } catch (err) {
            // 没有存档、存档损坏，或浏览器禁用了 localStorage：忽略，使用默认初始值
          }

          try {

            const payload = JSON.stringify({
              balance: this.balance,
              bet: this.bet,
              jackpotValue: this.jackpotValue,
            });
            window.localStorage.setItem("wanjin_slot_save", payload);

        createReels() {
          LAYOUT.reelXs.forEach((x, reelIndex) => {
            const frame = this.add
              .rectangle(
                x,
                LAYOUT.reelY,
                LAYOUT.reelFrameW,
                LAYOUT.reelFrameH,
                0xffffff,
                0.05,
              )
              .setStrokeStyle(4, 0xffd700);

            const maskShape = this.add.graphics();
            maskShape.fillStyle(0xffffff);
            maskShape.fillRect(
              x - LAYOUT.reelFrameW / 2 + 5,
              LAYOUT.reelY - LAYOUT.reelFrameH / 2 + 4,
              LAYOUT.reelFrameW - 10,
              LAYOUT.reelFrameH - 8,
            );

            const mask = maskShape.createGeometryMask();
            maskShape.setVisible(false);

            const container = this.add.container(x, LAYOUT.reelY);
            container.setMask(mask);

            const items = [];

            for (let i = -2; i <= 2; i++) {
              const symbol = Phaser.Utils.Array.GetRandom(SYMBOLS);

              const bg = this.add.circle(0, i * 64, 30, 0x000000, 0.18);

              const txt = this.add
                .text(0, i * 64, symbol.label, {
                  fontSize: symbol.label.length > 1 ? "42px" : "52px",
                  fontStyle: "bold",
                  color: symbol.color,
                  stroke: "#000000",
                  strokeThickness: 5,
                })
                .setOrigin(0.5);

              container.add([bg, txt]);
              items.push({ bg, txt, symbol });
            }

            this.reels.push({
              frame,
              container,
              items,
              value: SYMBOLS[reelIndex],
              intervalEvent: null,
              stopped: true,
              forceStopScheduled: false,
            });
          });
        }

        // direction: "out" = 买入（金币从 🏦 飞出）；"in" = 提出（金币飞入 🏦）
        playCashFlyAnim(direction) {
          if (this.cashIconX === undefined) return;
          const cx = this.cashIconX;
          const cy = this.cashIconY;
          const coinCount = 9;

          this.sfx.coinChime(direction);

          for (let i = 0; i < coinCount; i++) {
            this.time.delayedCall(i * 90, () => {
              const angleDeg = Phaser.Math.Between(-160, -20);
              const angleRad = Phaser.Math.DegToRad(angleDeg);
              const dist = Phaser.Math.Between(45, 75);
              const dx = Math.cos(angleRad) * dist;
              const dy = Math.sin(angleRad) * dist;

              if (direction === "out") {
                const coin = this.add
                  .text(cx, cy, "🪙", { fontSize: "18px" })
                  .setOrigin(0.5)
                  .setDepth(12)
                  .setScale(0.7);

                this.tweens.add({
                  targets: coin,
                  x: cx + dx,
                  y: cy + dy,
                  scale: 1.1,
                  alpha: 0,
                  duration: 620,
                  ease: "Cubic.easeOut",
                  onComplete: () => coin.destroy(),
                });
              } else {
                const coin = this.add
                  .text(cx + dx, cy + dy, "🪙", { fontSize: "18px" })
                  .setOrigin(0.5)
                  .setDepth(12)
                  .setAlpha(0.9);

                this.tweens.add({
                  targets: coin,
                  x: cx,
                  y: cy,
                  scale: 0.3,
                  alpha: 0,
                  duration: 520,
                  ease: "Cubic.easeIn",
                  onComplete: () => coin.destroy(),
                });
              }
            });
          }

          // 🏦 图标反馈脉冲
          this.tweens.add({
            targets: this.cashIcon,
            scale: 1.25,
            duration: 140,
            yoyo: true,
            ease: "Sine.easeOut",
          });
        }

        createCoinButton(spinBtnX, spinBtnY) {

          this.coinBtnGlow = this.add

          this.coinBtnHit.on("pointerout", () => {

          });
          this.coinBtnHit.on("pointerdown", () => {
            this.sfx.click();
            this.tweens.add({
              targets: [this.coinBtnRing, this.coinBtnIcon],
              scale: 0.88,
              duration: 70,
              yoyo: true,

            this.toggleCoinModal(true);
          });

        createCoinModal() {

          const cy = GAME_HEIGHT / 2;

          this.coinModalGroup = this.add
            .container(0, 0)
            .setDepth(100)
            .setVisible(false);

          // 全屏遮罩，点击空白处关闭
          const overlay = this.add
            .rectangle(0, 0, GAME_WIDTH, GAME_HEIGHT, 0x000000, 0.6)
            .setOrigin(0)
            .setInteractive();
          overlay.on("pointerdown", () => this.toggleCoinModal(false));

          // 弹窗面板
          const panel = this.add
            .rectangle(cx, cy, 300, 190, 0x1a0d02, 0.97)
            .setStrokeStyle(3, 0xffd700);

          const title = this.add
            .text(cx, cy - 70, "💰 筹码操作", {
              fontSize: "20px",
              fontStyle: "bold",
              color: "#ffd700",
              stroke: "#000000",
              strokeThickness: 3,
            })
            .setOrigin(0.5);

          // 买入按钮
          const buyBtn = this.add
            .rectangle(cx, cy - 15, 240, 46, 0x2f7d32)
            .setStrokeStyle(2, 0x9be89b)
            .setInteractive({ useHandCursor: true });
          const buyText = this.add
            .text(cx, cy - 15, "买入 +1000", {
              fontSize: "17px",
              fontStyle: "bold",
              color: "#ffffff",
            })
            .setOrigin(0.5);

          // 提出按钮
          const cashBtn = this.add
            .rectangle(cx, cy + 45, 240, 46, 0x8b0000)
            .setStrokeStyle(2, 0xffb3b3)
            .setInteractive({ useHandCursor: true });
          const cashText = this.add
            .text(cx, cy + 45, "提出 -1000", {
              fontSize: "17px",
              fontStyle: "bold",
              color: "#ffffff",
            })
            .setOrigin(0.5);

          buyBtn.on("pointerover", () => buyBtn.setFillStyle(0x3d9c40));
          buyBtn.on("pointerout", () => buyBtn.setFillStyle(0x2f7d32));
          buyBtn.on("pointerdown", () => {
            this.sfx.buttonPress();
            this.balance += 1000;
            this.updateDisplay();
            this.setMessage("买入成功 +1000");
            this.playCashFlyAnim("out");
            this.toggleCoinModal(false);
          });

          cashBtn.on("pointerout", () => cashBtn.setFillStyle(0x8b0000));
          cashBtn.on("pointerdown", () => {
            if (this.balance < 1000) {
              this.sfx.click();
              this.setMessage("余额不足，无法提出");

            }
            this.sfx.buttonPress();
            this.balance -= 1000;

            buyText,
            cashBtn,
