  <body>
    <div id="rotate-tip">

          <div class="ph-horn" id="ph-horn" aria-hidden="true">
          <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">

              <radialGradient id="hornShine" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
                <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
              </radialGradient>
            </defs>
            <path
              d="M 8,52 C 10,44 14,36 22,30 C 30,24 38,20 44,16 A 8,4 0 0 1 50,26 C 42,26 32,32 24,36 C 16,40 11,46 8,52 Z"
              fill="url(#hornGold)" stroke="#3a2705" stroke-width="1.2" stroke-linejoin="round"

            <path
              d="M 8,52 C 10,44 14,36 22,30 C 30,24 38,20 44,16 A 8,4 0 0 1 50,26 C 42,26 32,32 24,36 C 16,40 11,46 8,52 Z"
              fill="url(#hornShine)"
            />
            <path d="M 13,44 C 20,38 28,32 36,24" fill="none" stroke="#5c4009" stroke-width="0.8" opacity="0.55"/>
            <path d="M 11,48 C 18,42 26,35 34,27" fill="none" stroke="#fff2b8" stroke-width="0.6" opacity="0.4"/>
            <ellipse cx="47" cy="21" rx="6.5" ry="3.4" transform="rotate(-32 47 21)" fill="#180d02" opacity="0.85"/>
            <ellipse cx="47" cy="21" rx="6.5" ry="3.4" transform="rotate(-32 47 21)" fill="none" stroke="#ffe066" stroke-width="0.8" opacity="0.6"/>
            <circle cx="8" cy="52" r="3.4" fill="url(#hornGold)" stroke="#3a2705" stroke-width="1"/>
            <circle cx="7.2" cy="51.2" r="1" fill="#fff2b8" opacity="0.6"/>
          </svg>
        </div>
          <a class="ph-mp4-link" href="https://totp99.github.io/mp4-player/" target="_blank" rel="noopener noreferrer" title="打开 MP4 播放器" aria-label="打开 MP4 播放器">📽️</a>
          <button type="button" class="ph-pdf-link" id="ph-book-btn" title="打开书架" aria-label="打开书架">📖</button>
        </div>
        </div>
        <div class="ph-track-info">
          <div class="ph-track-kicker">♫ 现在播放</div>
          <div class="ph-track-title" id="ph-track-title">第 01 首 · TP音乐</div>
        </div>
        <div class="ph-clock" id="ph-clock">--:--</div>
      </div>

      <div class="ph-shell">
        <div class="ph-stage">
          <canvas class="ph-spectrum" id="ph-spectrum" width="720" height="164"></canvas>
          <div class="ph-vinyl-wrap">
            <div class="ph-vinyl" id="ph-vinyl"></div>
            <div class="ph-label" id="ph-label">
              <div class="ph-track-num" id="ph-track-num">01/36</div>
            </div>
            <div class="ph-arm up" id="ph-arm" aria-hidden="true">
              <div class="ph-arm-pivot"></div>
              <div class="ph-arm-rod"></div>
              <div class="ph-arm-head"></div>
            </div>
          </div>
        </div>

        <div class="ph-mini">
          <div class="ph-mini-row">
            <div class="ph-mini-money">
              <span class="ph-mini-bal">💰<span id="ph-balance">800</span></span>
              <span class="ph-mini-bet" id="ph-bet">—$50</span>
            </div>
            <div class="ph-reels">
              <div class="ph-reel" id="ph-r0"><span>7️⃣</span></div>
              <div class="ph-reel" id="ph-r1"><span>🌸</span></div>
              <div class="ph-reel" id="ph-r2"><span>🍒</span></div>
            </div>
            <button type="button" class="ph-spin" id="ph-spin">SPIN</button>
          </div>
          <div class="ph-msg" id="ph-msg"></div>
        </div>
      </div>

      <div class="ph-controls">
        <div class="ph-transport">
          <div class="ph-btn-group" role="group" aria-label="播放控制">
            <button type="button" class="ph-btn" id="ph-prev" aria-label="上一首">⏮️</button>
            <button type="button" class="ph-btn" id="ph-play" aria-label="播放">▶️</button>
            <button type="button" class="ph-btn" id="ph-pause" aria-label="暂停">⏸️</button>
            <button type="button" class="ph-btn" id="ph-next" aria-label="下一首">⏭️</button>
          </div>
          <div class="ph-btn-group" role="group" aria-label="播放模式">
            <button type="button" class="ph-btn" id="ph-order" aria-label="顺序播放">🔢</button>
            <button type="button" class="ph-btn" id="ph-shuffle" aria-label="随机播放">🔀</button>
          </div>
        </div>
      </div>
      </div>
    </div>

    <!-- 竖屏书架 + 加载进度 -->
    <div id="ph-book-overlay" class="ph-book-overlay" hidden aria-hidden="true">
      <div class="ph-book-panel" role="dialog" aria-labelledby="ph-book-title">
        <div class="ph-book-head">
          <span id="ph-book-title">📚 书架</span>
          <button type="button" class="ph-book-close" id="ph-book-close" aria-label="关闭">✕</button>
        </div>
        <ul class="ph-book-list" id="ph-book-list">
          <!-- 由脚本填充；缺文件自动跳过 -->
        </ul>
        <div class="ph-book-loading" id="ph-book-loading" hidden>
          <div class="ph-book-loading-label" id="ph-book-loading-label">正在加载…</div>
          <div class="ph-book-progress-track">
            <div class="ph-book-progress-bar" id="ph-book-progress-bar"></div>
          </div>
          <div class="ph-book-progress-pct" id="ph-book-progress-pct">0%</div>
        </div>
        <div class="ph-book-empty" id="ph-book-empty" hidden>暂无可用书籍</div>
      </div>
    </div>
    <div id="game-wrapper">
      <div id="game"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <script src="game.js"></script>
  
    <script>
(function setupBookShelf() {
  var BOOKS = [
    { file: "anne-of-green-gables.pdf", title: "Anne of Green Gables", sub: "绿山墙的安妮" },
    { file: "outlaws_of_the_marsh.pdf", title: "Outlaws of the Marsh", sub: "水浒传" },
    { file: "jourwest.pdf", title: "Journey to the West", sub: "西游记" },
    { file: "4.pdf", title: "Book 4", sub: "4.pdf" },
    { file: "5.pdf", title: "Book 5", sub: "5.pdf" },
    { file: "6.pdf", title: "Book 6", sub: "6.pdf" },
    { file: "7.pdf", title: "Book 7", sub: "7.pdf" }
  ];

  var overlay = document.getElementById("ph-book-overlay");
  var listEl = document.getElementById("ph-book-list");
  var emptyEl = document.getElementById("ph-book-empty");
  var loadingEl = document.getElementById("ph-book-loading");
  var labelEl = document.getElementById("ph-book-loading-label");
  var barEl = document.getElementById("ph-book-progress-bar");
  var pctEl = document.getElementById("ph-book-progress-pct");
  var btn = document.getElementById("ph-book-btn");
  var closeBtn = document.getElementById("ph-book-close");
  if (!overlay || !btn) return;

  var available = null; // null = not probed yet
  var probing = false;
  var loading = false;

  function setProgress(p) {
    p = Math.max(0, Math.min(100, p | 0));
    if (barEl) barEl.style.width = p + "%";
    if (pctEl) pctEl.textContent = p + "%";
  }

  function showOverlay() {
    overlay.hidden = false;
    overlay.setAttribute("aria-hidden", "false");
    overlay.classList.add("show");
  }

  function hideOverlay() {
    if (loading) return;
    overlay.classList.remove("show");
    overlay.hidden = true;
    overlay.setAttribute("aria-hidden", "true");
    if (loadingEl) loadingEl.hidden = true;
    if (listEl) listEl.hidden = false;
  }

  function probeBook(book) {
    return new Promise(function (resolve) {
      var xhr = new XMLHttpRequest();
      xhr.open("HEAD", book.file, true);
      xhr.timeout = 8000;
      xhr.onload = function () {
        // 2xx / 3xx 视为存在；部分静态服对 HEAD 回 405，再试轻量 GET
        if (xhr.status >= 200 && xhr.status < 400) {
          resolve(true);
        } else if (xhr.status === 405 || xhr.status === 501) {
          var g = new XMLHttpRequest();
          g.open("GET", book.file, true);
          g.timeout = 8000;
          g.onprogress = function (e) {
            if (e.loaded > 0) {
              g.abort();
              resolve(true);
            }
          };
          g.onload = function () {
            resolve(g.status >= 200 && g.status < 400);
          };
          g.onerror = g.ontimeout = function () {
            resolve(false);
          };
          g.send();
        } else {
          resolve(false);
        }
      };
      xhr.onerror = xhr.ontimeout = function () {
        resolve(false);
      };
      xhr.send();
    });
  }

  function renderList(items) {
    listEl.innerHTML = "";
    if (!items.length) {
      emptyEl.hidden = false;
      listEl.hidden = true;
      return;
    }
    emptyEl.hidden = true;
    listEl.hidden = false;
    items.forEach(function (book) {
      var li = document.createElement("li");
      var b = document.createElement("button");
      b.type = "button";
      b.className = "ph-book-item";
      b.innerHTML =
        '<span class="ph-book-item-icon">📖</span>' +
        '<span class="ph-book-item-text">' +
        '<span class="ph-book-item-title"></span>' +
        '<span class="ph-book-item-sub"></span>' +
        "</span>";
      b.querySelector(".ph-book-item-title").textContent = book.title;
      b.querySelector(".ph-book-item-sub").textContent = book.sub;
      b.addEventListener("click", function () {
        openBook(book);
      });
      li.appendChild(b);
      listEl.appendChild(li);
    });
  }

  function probeAll() {
    if (probing) return Promise.resolve(available || []);
    if (available) return Promise.resolve(available);
    probing = true;
    listEl.innerHTML = '<li class="ph-book-scanning">正在扫描可用书籍…</li>';
    emptyEl.hidden = true;
    listEl.hidden = false;
    return Promise.all(
      BOOKS.map(function (book) {
        return probeBook(book).then(function (ok) {
          return ok ? book : null;
        });
      })
    ).then(function (results) {
      available = results.filter(Boolean);
      probing = false;
      renderList(available);
      return available;
    });
  }

  function openBook(book) {
    if (loading) return;
    loading = true;
    listEl.hidden = true;
    emptyEl.hidden = true;
    loadingEl.hidden = false;
    labelEl.textContent = "正在加载「" + book.title + "」…";
    setProgress(0);

    var xhr = new XMLHttpRequest();
    xhr.open("GET", book.file, true);
    xhr.responseType = "blob";
    xhr.onprogress = function (e) {
      if (e.lengthComputable && e.total > 0) {
        setProgress(Math.floor((e.loaded / e.total) * 100));
      } else if (e.loaded > 0) {
        // 未知总长：缓慢爬升到 90%
        var fake = Math.min(90, 10 + Math.floor(e.loaded / 50000));
        setProgress(fake);
      }
    };
    xhr.onload = function () {
      if (xhr.status < 200 || xhr.status >= 400) {
        labelEl.textContent = "加载失败（" + xhr.status + "）";
        setProgress(0);
        loading = false;
        setTimeout(function () {
          loadingEl.hidden = true;
          renderList(available || []);
        }, 1200);
        return;
      }
      setProgress(100);
      labelEl.textContent = "打开中…";
      var blob = xhr.response;
      var url = URL.createObjectURL(blob);
      // 新标签打开 PDF，浏览器内置阅读器
      var w = window.open(url, "_blank");
      if (!w) {
        // 弹窗被拦：同页跳转
        location.href = url;
      }
      setTimeout(function () {
        loading = false;
        hideOverlay();
        // 稍后释放 blob（给新标签时间加载）
        setTimeout(function () {
          try {
            URL.revokeObjectURL(url);
          } catch (e) {}
        }, 60000);
      }, 400);
    };
    xhr.onerror = function () {
      labelEl.textContent = "网络错误，请稍后重试";
      setProgress(0);
      loading = false;
      setTimeout(function () {
        loadingEl.hidden = true;
        renderList(available || []);
      }, 1200);
    };
    xhr.send();
  }

  btn.addEventListener("click", function (e) {
    e.preventDefault();
    showOverlay();
    probeAll();
  });
  closeBtn.addEventListener("click", hideOverlay);
  overlay.addEventListener("click", function (e) {
    if (e.target === overlay) hideOverlay();
  });
})();
    </script>

  </body>
</html>
