        toggleCoinModal(show) {
          this.coinModalGroup.setVisible(show);
        }

        // 一点即转：手飞入握住 → 连贯拉下 → 开转（拉杆 / SPIN / 空格共用）
        pullLever(thenStart = true) {
          if (this.leverState === "down") return;

          this.leverState = "down";
          this.sfx.leverGrip();

          this.tweens.killTweensOf(this.leverHand);
          this.tweens.killTweensOf(this.leverContainer);

          // 从侧上方飞入并握住
          const midX = (this.handRestX + this.handGripX) / 2 + 8;
          const midY = (this.handRestY + this.handGripY) / 2 - 18;

          this.leverHand.setText("✋");
          this.leverHand.setAlpha(0);
          this.leverHand.setPosition(this.handRestX, this.handRestY);
          this.leverHand.setScale(0.85);
          this.leverHand.setAngle(-40);

          // 1) 淡入 + 弧线接近
          this.tweens.add({
            targets: this.leverHand,
            alpha: 1,
            scale: 1.05,
            duration: 90,
            ease: "Sine.easeOut",
          });

          this.tweens.add({
            targets: this.leverHand,
            x: midX,
            y: midY,
            angle: -18,
            duration: 120,
            ease: "Sine.easeOut",
            onComplete: () => {
              // 2) 落到手柄并握紧
              this.tweens.add({
                targets: this.leverHand,
                x: this.handGripX,
                y: this.handGripY,
                angle: -4,
                scale: 0.96,
                duration: 110,
                ease: "Cubic.easeInOut",
                onComplete: () => {
                  this.leverHand.setText("✊");
                  this.sfx.leverPull();

                  // 3) 微抬蓄力后重压拉下
                  this.tweens.add({
                    targets: this.leverHand,
                    y: this.handGripY - 5,
                    scale: 0.94,
                    duration: 50,
                    ease: "Sine.easeOut",
                    onComplete: () => {
                      this.tweens.add({
                        targets: this.leverHand,
                        x: this.handGripX + 14,
                        y: this.handGripY + 72,
                        angle: 32,
                        scale: 0.88,
                        duration: 260,
                        ease: "Cubic.easeIn",
                        onComplete: () => {
                          this.tweens.add({
                            targets: this.leverHand,
                            y: this.handGripY + 68,
                            scale: 0.92,
                            duration: 90,
                            ease: "Sine.easeOut",
                          });
                        },
                      });
                    },
                  });

                  this.tweens.add({
                    targets: this.leverContainer,
                    angle: -22,
                    duration: 50,
                    ease: "Sine.easeOut",
                    onComplete: () => {
                      this.tweens.add({
                        targets: this.leverContainer,
                        angle: 55,
                        duration: 260,
                        ease: "Cubic.easeIn",
                        onComplete: () => {
                          this.cameras.main.shake(110, 0.008);

                          this.tweens.add({
                            targets: this.leverContainer,
                            angle: 48,
                            duration: 90,
                            yoyo: true,
                            ease: "Sine.easeOut",
                          });

                          if (thenStart) {
                            this.startSpin();
                          }
                        },
                      });
                    },
                  });
                },
              });
            },
          });
        }

        resetLever() {
          this.leverState = "up";
          this.sfx.leverReset();

          this.tweens.killTweensOf(this.leverHand);
          this.tweens.killTweensOf(this.leverContainer);

          // 松手：张开 → 滑开淡出
          this.leverHand.setText("✋");

          this.tweens.add({
            targets: this.leverHand,
            scale: 1.05,
            angle: 8,
            duration: 100,
            ease: "Sine.easeOut",
            onComplete: () => {
              this.tweens.add({
                targets: this.leverHand,
                alpha: 0,
                x: this.handRestX,
                y: this.handRestY - 10,
                angle: -30,
                scale: 0.9,
                duration: 320,
                ease: "Cubic.easeInOut",
                onComplete: () => {
                  if (this.leverHand) {
                    this.leverHand.setText("✋");
                    this.leverHand.setScale(1);
                  }
                },
              });
            },
          });

          this.tweens.add({
            targets: this.leverContainer,
            angle: -18,
            duration: 420,
            ease: "Back.easeOut",
          });

          this.leverHandle.setFillStyle(0xb8860b);
          this.leverHandle.setStrokeStyle(3, 0xffd700);
        }

        // 赔率弹窗 + 速度 / 自动五次 / 音效 设置（点击"赔率"键弹出）
        // 左右两栏布局：左边赔率表，右边游戏设置，紧凑横向排列
        // 赔率弹窗 + 速度 / 自动五次 / 音效 设置（点击"赔率*设置"键弹出）
        // 已去掉"控制中心/赔率/设置"文字标签与顶部分隔线；所有图标/字体/方框在原基础上放大 115%，
        // 面板本身也相应放大，尽量利用面板内的空间，避免大片空白。
        createSettingsModal() {
          const cx = GAME_WIDTH / 2;
          const cy = GAME_HEIGHT / 2;
          const panelW = 560;
          const panelH = 370;
          const top = cy - panelH / 2;

          this.settingsModalGroup = this.add
            .container(0, 0)
            .setDepth(100)
            .setVisible(false);

          const children = [];

          const overlay = this.add
            .rectangle(0, 0, GAME_WIDTH, GAME_HEIGHT, 0x000000, 0.72)
            .setOrigin(0)
            .setInteractive();
          overlay.on("pointerdown", () => this.toggleSettingsModal(false));
          children.push(overlay);

          // 外层微光
          children.push(
            this.add
              .rectangle(cx, cy, panelW + 9, panelH + 9, UI.gold, 0.08)
              .setStrokeStyle(1, UI.goldDim),
          );

          const panel = this.add
            .rectangle(cx, cy, panelW, panelH, 0x0e0a06, 0.98)
            .setStrokeStyle(2, UI.gold)
            .setInteractive();
          panel.on("pointerdown", (pointer, lx, ly, event) => {
            event.stopPropagation();
          });
          children.push(panel);

          const pad = 21;
          const leftX = cx - panelW / 2 + pad;
          const rightX = cx + panelW / 2 - pad;
          const dividerX = cx - 28;

          // 左：赔率表（无列标题，直接从顶部留白后开始）；图标放大 125%，行距相应放宽
          const payRows = [
            ["7️⃣7️⃣7️⃣", "×50"],
            ["🌸🌸🌸", "×20"],
            ["🌺🌺🌺", "×15"],
            ["🍇🍇🍇", "×10"],
            ["🍓🍓🍓", "×8"],
            ["🍒🍒🍒", "×6"],
            ["🍄🍄🍄", "×4"],
            ["任意一对", "×2"],
          ];
          const payStart = top + 28;
          const paySpacing = 46;
          payRows.forEach((row, i) => {
            const ry = payStart + i * paySpacing;
            children.push(
              this.add
                .text(leftX + 7, ry, row[0], {
                  fontSize: "18px",
                  color: "#e8dcc0",
                })
                .setOrigin(0, 0.5),
            );
            children.push(
              this.add
                .text(dividerX - 12, ry, row[1], {
                  fontSize: "14px",
                  fontStyle: "bold",
                  color: "#ffd700",
                })
                .setOrigin(1, 0.5),
            );
          });

          children.push(
            this.add
              .rectangle(dividerX, cy, 1, panelH - 40, UI.gold, 0.22)
              .setOrigin(0.5),
          );

          // 右：设置（无列标题）
          const makeOptionButton = (bx, by, label) => {
            const bg = this.add
              .rectangle(bx, by, 58, 28, 0x1a140c, 0.95)
              .setStrokeStyle(1, UI.goldDim)
              .setInteractive({ useHandCursor: true });
            const txt = this.add
              .text(bx, by, label, {
                fontSize: "13px",
                color: "#e8dcc0",
              })
              .setOrigin(0.5);
            children.push(bg, txt);
            return { bg, txt };
          };

          // 通用：给一个文字/图标叠加一个更大的隐形热区，扩大点击范围，
          // 并统一处理悬停放大反馈 + 按下音效，避免每处再各自重复实现。
          const addHitZone = (visual, bx, by, w, h, sound, onDown) => {
            const hit = this.add
              .rectangle(bx, by, w, h, 0x000000, 0.001)
              .setInteractive({ useHandCursor: true });
            hit.on("pointerover", () => visual.setScale(1.15));
            hit.on("pointerout", () => visual.setScale(1));
            hit.on("pointerdown", (p, lx, ly, e) => {
              if (e) e.stopPropagation();
              if (sound) sound();
              onDown();
            });
            children.push(hit);
            return hit;
          };

          const rowLabelX = dividerX + 16;
          const optAX = cx + 66;
          const optBX = cx + 146;
          const boxCenterX = cx + 106;

          let rowY = payStart;
          children.push(
            this.add
              .text(rowLabelX, rowY, "速度", {
                fontSize: "14px",
                fontStyle: "bold",
                color: "#ffd700",
              })
              .setOrigin(0, 0.5),
          );
          const normalOpt = makeOptionButton(optAX, rowY, "正常");
          const fastOpt = makeOptionButton(optBX, rowY, "加速");
          this.speedButtons = [
            { label: "NORMAL", btn: normalOpt.bg, txt: normalOpt.txt },
            { label: "FAST", btn: fastOpt.bg, txt: fastOpt.txt },
          ];
          normalOpt.bg.on("pointerdown", (p, lx, ly, e) => {
            e.stopPropagation();
            this.mode = "NORMAL";
            this.sfx.click();
            this.updateSpeedButtons();
            this.saveGameState();
          });
          fastOpt.bg.on("pointerdown", (p, lx, ly, e) => {
            e.stopPropagation();
            this.mode = "FAST";
            this.sfx.click();
            this.updateSpeedButtons();
            this.saveGameState();
          });
          this.updateSpeedButtons();

          rowY += 60;
          children.push(
            this.add
              .text(rowLabelX, rowY, "自动", {
                fontSize: "14px",
                fontStyle: "bold",
                color: "#ffd700",
              })
              .setOrigin(0, 0.5),
          );
          const autoYesOpt = makeOptionButton(optAX, rowY, "是");
          const autoNoOpt = makeOptionButton(optBX, rowY, "否");
          this.autoYesButton = autoYesOpt;
          this.autoNoButton = autoNoOpt;
          autoYesOpt.bg.on("pointerdown", (p, lx, ly, e) => {
            e.stopPropagation();
            if (!this.autoPlay) {
              this.sfx.click();
              this.toggleAutoPlay();
            }
          });
          autoNoOpt.bg.on("pointerdown", (p, lx, ly, e) => {
            e.stopPropagation();
            if (this.autoPlay) {
              this.sfx.click();
              this.toggleAutoPlay();
            }
          });
          this.updateAutoOptionButtons();

          rowY += 60;
          children.push(
            this.add
              .text(rowLabelX, rowY, "音效", {
                fontSize: "14px",
                fontStyle: "bold",
                color: "#ffd700",
              })
              .setOrigin(0, 0.5),
          );
          const soundOnOpt = makeOptionButton(optAX, rowY, "开启");
          const soundOffOpt = makeOptionButton(optBX, rowY, "关闭");
          this.soundOnButton = soundOnOpt;
          this.soundOffButton = soundOffOpt;
          soundOnOpt.bg.on("pointerdown", (p, lx, ly, e) => {
            e.stopPropagation();
            if (!this.sfx.enabled) {
              this.sfx.enabled = true;
              this.sfx.click();
              this.updateSoundOptionButtons();
              this.saveGameState();
            }
          });
          soundOffOpt.bg.on("pointerdown", (p, lx, ly, e) => {
            e.stopPropagation();
            if (this.sfx.enabled) {
              this.sfx.click();
              this.sfx.enabled = false;
              this.updateSoundOptionButtons();
              this.saveGameState();
            }
          });
          this.updateSoundOptionButtons();

          rowY += 60;
          children.push(
            this.add
              .rectangle(boxCenterX, rowY, rightX - dividerX - 10, 1, UI.gold, 0.22)
              .setOrigin(0.5),
          );

          // 投注：文字标签 / 数值框 / +− 按钮均放大 125%，并整体右移一点、加宽行距，避免与左侧标签、面板边缘拥挤
          rowY += 64;
          // BET 这一行（标签 + 长方形数值框 + −/+ 按钮）整体上移 6px，
          // 与下方 CHIPS 行留出更充裕的间距；后续行的 rowY 仍按原基准累加，不受影响。
          const betRowY = rowY - 6;
          children.push(
            this.add
              .text(rowLabelX, betRowY, "BET", {
                fontSize: "18px",
                fontStyle: "bold",
                color: "#ffd700",
              })
              .setOrigin(0, 0.5),
          );
          const bigBoxCenterX = boxCenterX + 34;
          const betBoxX = bigBoxCenterX;
          children.push(
            this.add
              .rectangle(betBoxX, betRowY, 155, 38, 0x0a0806, 0.95)
              .setStrokeStyle(1, UI.goldDim),
          );
          const betMinus = this.add
            .text(betBoxX - 55, betRowY, "−", {
              fontSize: "22px",
              color: "#ffd700",
              fontStyle: "bold",
            })
            .setOrigin(0.5);
          const betPlus = this.add
            .text(betBoxX + 55, betRowY, "+", {
              fontSize: "22px",
              color: "#ffd700",
              fontStyle: "bold",
            })
            .setOrigin(0.5);
          this.modalBetValue = this.add
            .text(betBoxX, betRowY, this.formatInt(this.bet), {
              fontSize: "19px",
              color: "#ffd700",
              fontStyle: "bold",
            })
            .setOrigin(0.5);
          children.push(betMinus, betPlus, this.modalBetValue);
          // 命中范围放大到 44×44，明显比原本紧贴文字的热区更容易点中；按下有声效
          addHitZone(betMinus, betBoxX - 55, betRowY, 44, 44, () => this.sfx.click(), () => {
            this.changeBet(-this.betStep);
            if (this.modalBetValue)
              this.modalBetValue.setText(this.formatInt(this.bet));
          });
          addHitZone(betPlus, betBoxX + 55, betRowY, 44, 44, () => this.sfx.click(), () => {
            this.changeBet(this.betStep);
            if (this.modalBetValue)
              this.modalBetValue.setText(this.formatInt(this.bet));
          });

          // 筹码：与投注同比例放大 125%，行距加宽避免与投注框拥挤
          rowY += 58;
          children.push(
            this.add
              .text(rowLabelX, rowY, "CHIPS", {
                fontSize: "18px",
                fontStyle: "bold",
                color: "#ffd700",
              })
              .setOrigin(0, 0.5),
          );
          children.push(
            this.add
              .rectangle(betBoxX, rowY, 170, 38, 0x0a0806, 0.95)
              .setStrokeStyle(1, UI.goldDim),
          );
          const chipMinus = this.add
            .text(betBoxX - 64, rowY, "−", {
              fontSize: "22px",
              color: "#ffd700",
              fontStyle: "bold",
            })
            .setOrigin(0.5);
          const chipPlus = this.add
            .text(betBoxX + 64, rowY, "+", {
              fontSize: "22px",
              color: "#ffd700",
              fontStyle: "bold",
            })
            .setOrigin(0.5);
          children.push(
            this.add
              .text(betBoxX, rowY, "1000", {
                fontSize: "19px",
                color: "#ffd700",
                fontStyle: "bold",
              })
              .setOrigin(0.5),
          );
          children.push(chipMinus, chipPlus);
          // 同样放大到 44×44 的命中范围；金币音效已有，予以保留
          addHitZone(chipPlus, betBoxX + 64, rowY, 44, 44, null, () => {
            this.sfx.coinChime("out");
            this.balance = Math.round(this.balance + 1000);
            this.updateDisplay();
            this.setMessage("CHIPS +1000");
          });
          addHitZone(chipMinus, betBoxX - 64, rowY, 44, 44, null, () => {
            if (this.balance < 1000) {
              this.setMessage("INSUFFICIENT CHIPS");
              this.sfx.lose();
              return;
            }
            this.sfx.coinChime("in");
            this.balance = Math.round(this.balance - 1000);
            this.updateDisplay();
            this.setMessage("CHIPS -1000");
          });

          this.musicOnButton = null;
          this.musicOffButton = null;
          this.orderPlayButton = null;
          this.shufflePlayButton = null;

          // 关闭按钮：放大至 200%，并相应调整位置与外层微光留出的边距保持协调
          const closeX = cx + panelW / 2 - 28;
          const closeY = top + 24;
          const closeBtn = this.add
            .text(closeX, closeY, "✕", {
              fontSize: "32px",
              fontStyle: "bold",
              color: "#ffd700",
            })
            .setOrigin(0.5);
          children.push(closeBtn);
          // x 的命中范围同样放大到 44×44，比原来紧贴字形的热区更容易点中
          addHitZone(closeBtn, closeX, closeY, 44, 44, () => this.sfx.click(), () => {
            this.toggleSettingsModal(false);
          });

          this.settingsModalGroup.add(children);

        toggleSettingsModal(show) {
          if (show && this.modalBetValue) {

        updateAutoOptionButtons() {
          if (!this.autoYesButton || !this.autoNoButton) return;

            this.autoYesButton.bg,
            this.autoYesButton.txt,
            this.autoPlay,
          );
          this.setControlActive(
            this.autoNoButton.bg,
            this.autoNoButton.txt,
            !this.autoPlay,
          );
        }

        updateSoundOptionButtons() {
          if (!this.soundOnButton || !this.soundOffButton) return;
          this.setControlActive(
            this.soundOnButton.bg,
            this.soundOnButton.txt,
            this.sfx.enabled,
          );
          this.setControlActive(

        updateMusicOptionButtons() {
          if (!this.musicOnButton || !this.musicOffButton) return;
          this.setControlActive(
            this.musicOnButton.bg,
            this.musicOnButton.txt,
            bgMusic.enabled,
          );

          );

        // 音乐开关：点亮/熄灭频谱条（真实跳动由 updateEqVisualizer 驱动）
        setEqVisualizerActive(active) {
          if (!this.eqBars) return;
          this.eqActive = !!active;
          this.eqGlowAlpha = active ? 0.08 : 0.02;

          this.eqBars.forEach((bar) => {
            if (active) {
              bar.setAlpha(0.9);
            } else {
              this.tweens.add({
                targets: bar,
                scaleY: 0.1,
                alpha: 0.25,
                duration: 220,
                ease: "Sine.easeOut",
              });
            }
          });
        }

        // ~30fps 驱动：频谱条高度每拍更新；光晕颜色变化慢，减少插值开销
        updateEqVisualizer() {
          if (!this.eqBars || !this.eqGlow) return;
          if (this.eqPageHidden) return;

          const bands = bgMusic.sampleSpectrum();
          const playing = this.eqActive && bgMusic.isPlaying();

          for (let i = 0; i < 5; i++) {
            // 喷泉效果：基础增益更猛，并叠加随机跳花，让静音频段也有细碎跃动
            const spark = playing ? Math.random() * 0.22 : 0;
            const raw = bands[i] * 1.9 + spark;
            const level = playing
              ? raw > 1.35
                ? 1.35
                : raw < 0.1
                  ? 0.1
                  : raw
              : 0.1;
            const cur = this.eqBars[i].scaleY;
            // 喷涌：冲高时几乎瞬发（像水柱猛地冲出），回落时缓慢飘落（像水滴落下）
            const rising = level > cur;
            const next = rising
              ? cur * 0.12 + level * 0.88
              : cur * 0.86 + level * 0.14;
            this.eqBars[i].scaleY = next;
            this.eqBars[i].setAlpha(playing ? 0.6 + Math.min(0.4, next * 0.35) : 0.25);
          }

          // 光晕：能量变化够大或播放状态切换才重算颜色
          const e = bgMusic.energy;
          if (
            playing === this._eqLastPlaying &&
            Math.abs(e - (this._eqLastEnergy || 0)) < 0.05
          ) {
            // 仅微调透明度
            if (playing) {
              this.eqGlow.setAlpha(
                Math.min(0.35, (this.eqGlowAlpha || 0.08) * (0.6 + e * 1.2)),
              );
            }
            return;
          }
          this._eqLastPlaying = playing;
          this._eqLastEnergy = e;

          const b = bgMusic.brightness > 1.3 ? 1.3 : bgMusic.brightness < 0 ? 0 : bgMusic.brightness;
          const v =
            bgMusic.vocalBias > 0.6
              ? 0.6
              : bgMusic.vocalBias < -0.6
                ? -0.6
                : bgMusic.vocalBias;

          let c1, c2;
          if (!playing) {
            c1 = 0x3a2a10;
            c2 = 0x1a1208;
          } else if (v > 0.12) {
            c1 = 0xff4da6;
            c2 = 0x40e0ff;
          } else if (v < -0.12) {
            c1 = 0xff8c42;
            c2 = 0xffd700;
          } else if (b > 0.85) {
            c1 = 0x40e0ff;
            c2 = 0xffe566;
          } else {
            c1 = 0xc9a227;
            c2 = 0xffd700;
          }

          const mix = 0.35 + e * 0.5 + b * 0.15;
          const t = mix < 0 ? 0 : mix > 1 ? 1 : mix;
          const col = Phaser.Display.Color.Interpolate.ColorWithColor(
            Phaser.Display.Color.ValueToColor(c1),
            Phaser.Display.Color.ValueToColor(c2),
            100,
            (t * 100) | 0,
          );
          const alpha = playing
            ? (this.eqGlowAlpha || 0.08) * (0.6 + e * 1.2)
            : 0.02;
          this.eqGlow.setFillStyle(
            Phaser.Display.Color.GetColor(col.r, col.g, col.b),
            alpha > 0.35 ? 0.35 : alpha,
          );
        }

        update(_time, delta) {
          // 频谱可视化约 30fps，避免每帧 FFT + 改色
          this._eqAcc = (this._eqAcc || 0) + delta;
          if (this._eqAcc < 33) return;
          this._eqAcc = 0;
          this.updateEqVisualizer();
        }

        updatePlayModeButtons() {
          if (!this.orderPlayButton || !this.shufflePlayButton) return;
          this.setControlActive(
            this.orderPlayButton.bg,
            this.orderPlayButton.txt,
            !bgMusic.shuffle,
          );
          this.setControlActive(
            this.shufflePlayButton.bg,
            this.shufflePlayButton.txt,
            bgMusic.shuffle,
          );
        }

        updateSpeedButtons() {
          this.speedButtons.forEach(({ label, btn, txt }) => {
            this.setControlActive(btn, txt, label === this.mode);
          });
        }

        createKeyboardControls() {
          this.input.keyboard.on("keydown-SPACE", () => {
            this.sfx.click();
            this.handleSpinInput();
          });
        }

        createAmbientAnimations() {
          // 签名扫光动效已按需求移除。
          this.machineGlow.setAlpha(0.07);
          if (this.paylineTop) this.paylineTop.setAlpha(0.7);
          if (this.paylineMiddle) this.paylineMiddle.setAlpha(0.88);
          if (this.paylineBottom) this.paylineBottom.setAlpha(0.7);
        }

        updateDisplay() {
          fitTextToBox(
            this.balanceValue,
            this.formatInt(this.balance),
            LAYOUT.balanceW - 35,
            21,
            13,
          );

          if (this.betValue) {
            fitTextToBox(
              this.betValue,
              this.formatInt(this.bet),
              78,
              15,
              10,
            );
          }
          if (this.sideBetValue) {
            this.sideBetValue.setText(this.formatInt(this.bet));
          }
          if (this.modalBetValue) {
            this.modalBetValue.setText(this.formatInt(this.bet));
          }

          fitTextToBox(
            this.lastWinValue,
            this.formatInt(this.lastWin),
            LAYOUT.lastWinW - 35,
            21,
            13,
          );

          fitTextToBox(
            this.jackpotText,
            `💎 JACKPOT ${this.formatMoney(this.jackpotValue)}`,
            320,
            21,
            14,
          );

          this.saveGameState();
        }

        changeBet(amount) {
          if (this.isSpinning) return;

          this.sfx.click();

          this.bet = Math.round(
            Phaser.Math.Clamp(
              this.bet + amount,
              this.minBet,
              this.maxBet,
            ),
          );

          if (this.betValue) {
            fitTextToBox(
              this.betValue,
              this.formatInt(this.bet),
              78,
              15,
              10,
            );
            this.tweens.killTweensOf(this.betValue);
            this.betValue.setScale(1);
            this.tweens.add({
              targets: this.betValue,
              scale: 1.18,
              duration: 120,
              yoyo: true,
            });
          }
          if (this.sideBetValue) {
            this.sideBetValue.setText(this.formatInt(this.bet));
          }
          if (this.modalBetValue) {
            this.modalBetValue.setText(this.formatInt(this.bet));
          }
          this.saveGameState();
        }

        setBetButtonsEnabled(enabled) {
          if (!this.betMinus || !this.betPlus) return;

          const alpha = enabled ? 1 : 0.45;

          this.betMinus.disableInteractive();
          this.betPlus.disableInteractive();

          if (enabled) {
            this.betMinus.setInteractive({
              useHandCursor: true,
              hitArea: new Phaser.Geom.Rectangle(-20, -19, 40, 38),
              hitAreaCallback: Phaser.Geom.Rectangle.Contains,
            });
            this.betPlus.setInteractive({
              useHandCursor: true,
              hitArea: new Phaser.Geom.Rectangle(-20, -19, 40, 38),
              hitAreaCallback: Phaser.Geom.Rectangle.Contains,
            });
          }

          [this.betMinus, this.betPlus].forEach((item) => item.setAlpha(alpha));
        }

        toggleAutoPlay() {
          this.autoPlay = !this.autoPlay;

          if (this.autoPlay) {
            this.autoPlayRounds = 0;
            this.updateAutoOptionButtons();
            this.setMessage(`自动模式已开启（${this.maxAutoPlayRounds}次）`);

            if (!this.isSpinning) {
              this.time.delayedCall(350, () => {
                if (this.autoPlay && !this.isSpinning) {
                  this.startSpin();
                }
              });
            }
          } else {
            this.updateAutoButtonOff();
            this.setMessage("自动模式已关闭");
          }
        }

        updateAutoButtonOff() {
          this.updateAutoOptionButtons();
        }

        // 统一入口：拉杆 / SPIN / 空格
        // 空闲 → 拉杆动画并开转；转动中 → 急停
        handleSpinInput() {
          if (this.inputLocked) return;

          this.inputLocked = true;
          this.time.delayedCall(280, () => {
            this.inputLocked = false;
          });

          if (this.isSpinning) {
            this.requestStop();
            return;
          }

          // 拉杆正在下落动画中，忽略重复点击
          if (this.leverState === "down") return;

          this.pullLever(true);
        }

        requestStop() {
          if (!this.isSpinning || this.stopRequested) return;

          this.stopRequested = true;
          this.setMessage("STOPPING...");

          this.reels.forEach((reel, index) => {
            if (!reel.stopped && !reel.forceStopScheduled) {
              reel.forceStopScheduled = true;
              this.time.delayedCall(index * 140, () =>
                this.stopReel(reel, index),
              );
            }
          });
        }

        startSpin() {
          if (this.isSpinning) return;

          if (this.balance < this.bet) {
            this.setMessage("余额不足，无法开始！");
            this.sfx.lose();
            this.autoPlay = false;
            this.updateAutoButtonOff();
            this.resetLever();
            return;
          }

          // 自动模式等非手动拉杆路径：若拉杆未下，补一段简短甩下动画
          if (this.leverState !== "down") {
            this.leverState = "down";
            this.sfx.leverPull();
            this.leverHand.setText("✊");
            this.leverHand.setAlpha(1);
            this.leverHand.setPosition(this.handGripX, this.handGripY);
            this.tweens.add({
              targets: this.leverContainer,
              angle: 48,
              duration: 200,
              ease: "Cubic.easeIn",
            });
            this.tweens.add({
              targets: this.leverHand,
              y: this.handGripY + 70,
              x: this.handGripX + 12,
              angle: 28,
              scale: 0.9,
              duration: 200,
            });
          }

          this.reels.forEach((reel) => {
            if (reel.intervalEvent) {
              reel.intervalEvent.remove(false);
              reel.intervalEvent = null;
            }

            reel.stopped = true;
            reel.forceStopScheduled = false;
            reel.container.y = LAYOUT.reelY;
          });

          this.isSpinning = true;
          this.stopRequested = false;
          this.stoppedReelsCount = 0;
          this.setBetButtonsEnabled(false);

          this.animateBalanceDecrease(this.bet);

          this.jackpotValue += Math.max(1, Math.round(this.bet * 0.05));
          this.updateDisplay();

          if (this.autoPlay) {
            this.autoPlayRounds++;
            this.setMessage(
              `AUTO SPIN ${this.autoPlayRounds}/${this.maxAutoPlayRounds}`,
              18,
            );
          } else {
            const modeLabel = this.mode === "FAST" ? "FAST" : "NORMAL";
            this.setMessage(`${modeLabel} SPIN • SPACE TO STOP`, 17);
          }

          this.reels.forEach((reel, index) => {
            this.startReelSpin(reel, index);
          });

          this.cameras.main.shake(90, 0.002);
        }

        animateBalanceDecrease(amount) {
          const startBalance = this.balance;
          const endBalance = this.balance - amount;

          this.balance = endBalance;

          this.tweens.addCounter({
            from: startBalance,
            to: endBalance,
            duration: 320,
            ease: "Cubic.easeOut",
            onUpdate: (tween) => {
              fitTextToBox(
                this.balanceValue,
                this.formatInt(tween.getValue()),
                LAYOUT.balanceW - 35,
                21,
                13,
              );
            },
            onComplete: () => this.updateDisplay(),
          });

          this.tweens.add({
            targets: this.balanceValue,
            scale: 1.1,
            duration: 140,
            yoyo: true,
          });
        }

        startReelSpin(reel, index) {
          const settings = this.speedSettings[this.mode];

          if (reel.intervalEvent) {
            reel.intervalEvent.remove(false);
            reel.intervalEvent = null;
          }

          reel.stopped = false;
          reel.forceStopScheduled = false;

          reel.frame.setStrokeStyle(3, UI.goldBright);

          const stopDelay = settings.duration + index * 320;
          const decelWindow = 260; // 停止前的减速窗口（毫秒），让转轮"滑行进站"而不是硬停
          const spinStartTime = this.time.now;

          reel.intervalEvent = this.time.addEvent({
            delay: settings.interval,
            loop: true,
            callback: () => {
              this.sfx.spinTick();

              // 越接近停止时刻，滚动步长越小，形成自然减速的滑行手感
              const remaining = stopDelay - (this.time.now - spinStartTime);
              const decelRatio =
                remaining < decelWindow
                  ? Math.max(0.25, remaining / decelWindow)
                  : 1;
              const step = settings.step * decelRatio;

              reel.items.forEach((item) => {
                item.txt.y += step;
                item.bg.y += step;

                if (item.txt.y > 128) {
                  const symbol = Phaser.Utils.Array.GetRandom(SYMBOLS);

                  item.symbol = symbol;
                  item.txt.y = -128;
                  item.bg.y = -128;
                  item.txt.setText(symbol.label);
                  item.txt.setColor(symbol.color);
                  item.txt.setFontSize(symbol.label.length > 1 ? 42 : 52);
                }
              });
            },
          });

          this.time.delayedCall(stopDelay, () => {
            // stopReel 内部已对 reel.stopped 做了守卫，急停场景下重复调用是安全的
            this.stopReel(reel, index);
          });
        }

        stopReel(reel, index) {
          if (reel.stopped) return;

          reel.stopped = true;

          if (reel.intervalEvent) {
            reel.intervalEvent.remove(false);
            reel.intervalEvent = null;
          }

          const finalSymbol = this.getControlledResult(index);
          reel.value = finalSymbol;

          reel.items.forEach((item, i) => {
            const randomSymbol = Phaser.Utils.Array.GetRandom(SYMBOLS);

            item.symbol = randomSymbol;
            item.txt.y = (i - 2) * 64;
            item.bg.y = (i - 2) * 64;
            item.txt.setText(randomSymbol.label);
            item.txt.setColor(randomSymbol.color);
            item.txt.setFontSize(randomSymbol.label.length > 1 ? 42 : 52);

            // 非中奖行的符号淡入落位，避免"瞬间贴图切换"的生硬感
            if (i !== 2) {
              item.txt.setAlpha(0.35);
              this.tweens.add({
                targets: item.txt,
                alpha: 1,
                duration: 150,
                ease: "Sine.easeOut",
              });
            }
          });

          const center = reel.items[2];

          center.symbol = finalSymbol;
          center.txt.setText(finalSymbol.label);
          center.txt.setColor(finalSymbol.color);
          center.txt.setFontSize(finalSymbol.label.length > 1 ? 42 : 52);
          center.txt.y = 0;
          center.bg.y = 0;

          this.sfx.reelStop();

          this.tweens.add({
            targets: reel.container,
            y: LAYOUT.reelY + 7,
            duration: 120,
            ease: "Sine.easeOut",
            yoyo: true,
          });

          this.tweens.add({
            targets: center.txt,
            scale: 1.15,
            duration: 140,
            yoyo: true,
          });

          reel.frame.setStrokeStyle(2, UI.goldDim);

          this.stoppedReelsCount++;

          if (this.stoppedReelsCount >= this.reels.length) {
            this.time.delayedCall(300, () => {
              this.isSpinning = false;
              this.setBetButtonsEnabled(true);
              this.resetLever();
              this.checkWin();
            });
          }
        }

        // 每个转轮停止时的最终结果：完全随机（当前未做加权/控制概率，预留 index 供未来分轮控制）
        getControlledResult(index) {
          return Phaser.Utils.Array.GetRandom(SYMBOLS);
        }

        checkWin() {
          const [a, b, c] = this.reels.map((reel) => {
            const center = reel.items[2];
            return center.symbol || reel.value;
          });

          const isThreeOfAKind = a.key === b.key && b.key === c.key;
          const isPair = a.key === b.key || a.key === c.key || b.key === c.key;
          const isJackpot = isThreeOfAKind && a.key === "seven";

          if (isJackpot) {
            const win = this.jackpotValue;

            this.balance += win;
            this.lastWin = win;
            this.updateDisplay();

            this.setMessage(`JACKPOT! +${this.formatMoney(win)}`, 18);
            this.playJackpot();
            this.scheduleAutoPlay();
            return;
          }

          if (isThreeOfAKind) {
            const win = this.bet * a.multiplier;

            this.balance += win;
            this.lastWin = win;
            this.updateDisplay();

            this.setMessage(
              `${a.label}${a.label}${a.label} WIN +${this.formatMoney(win)}`,
              18,
            );
            this.playBigWin();
            this.scheduleAutoPlay();
            return;
          }

          if (isPair) {
            const pairSymbol = this.getPairSymbol(a, b, c);
            const win = this.bet * 2;

            this.balance += win;
            this.lastWin = win;
            this.updateDisplay();

            this.setMessage(
              `PAIR ${pairSymbol.label}${pairSymbol.label} +${this.formatMoney(win)}`,
              18,
            );
            this.playSmallWin();
            this.scheduleAutoPlay();
            return;
          }

          this.updateDisplay();
          this.setMessage("NO WIN — TRY AGAIN");
          this.sfx.lose();
          this.scheduleAutoPlay();
        }

        getPairSymbol(a, b, c) {
          if (a.key === b.key) return a;
          if (a.key === c.key) return a;
          if (b.key === c.key) return b;

          return a;
        }

        scheduleAutoPlay() {
          if (!this.autoPlay) return;

          if (
            this.autoPlayRounds >= this.maxAutoPlayRounds ||
            this.balance < this.bet
          ) {
            this.autoPlay = false;
            this.updateAutoButtonOff();
            this.setMessage("自动模式已结束");
            return;
          }

          this.time.delayedCall(850, () => {
            if (this.autoPlay && !this.isSpinning) {
              this.startSpin();
            }
          });
        }

        flashLines() {
          [this.paylineTop, this.paylineMiddle, this.paylineBottom].forEach(
            (line) => {
              this.tweens.add({
                targets: line,
                alpha: 1,
                scaleX: 1.07,
                duration: 120,
                yoyo: true,
                repeat: 6,
              });
            },
          );
        }

        playSmallWin() {
          this.sfx.smallWin();
          this.flashLines();

          this.reels.forEach((reel) => {
            this.tweens.add({
              targets: reel.container,
              scale: 1.06,
              duration: 140,

        ];

        var SPEC_COLOR_LUT = (function () {
          var lut = new Array(64);
          var stops = SPEC_GRADIENT_RGB;
          var n = stops.length - 1;
          for (var i = 0; i < 64; i++) {
            var t = i / 63;
            var pos = t * n;
            var seg = pos | 0;
            if (seg >= n) seg = n - 1;
            var localT = pos - seg;
            var c1 = stops[seg];
            var c2 = stops[seg + 1];
            var r = (c1[0] + (c2[0] - c1[0]) * localT + 0.5) | 0;
            var g = (c1[1] + (c2[1] - c1[1]) * localT + 0.5) | 0;
            var b = (c1[2] + (c2[2] - c1[2]) * localT + 0.5) | 0;
            lut[i] = "rgb(" + r + "," + g + "," + b + ")";
          }
          return lut;
        })();
        function specColorAt(t) {
          if (t < 0) t = 0;

        function drawSpectrum() {
          if (!spectrum || !phActive) return;
          var ctx = spectrum.getContext("2d");
          if (!ctx) return;

          var w = spectrum.width;
          var h = spectrum.height;
          var mid = h / 2;
          ctx.clearRect(0, 0, w, h);

          // 分析器不必每帧都跑：约 30fps 采样足够驱动波浪
          var now = performance.now();
          if (!drawSpectrum._lastAnalAt) drawSpectrum._lastAnalAt = 0;
          if (now - drawSpectrum._lastAnalAt > 32) {
            bgMusic.sampleSpectrum();
            drawSpectrum._lastAnalAt = now;
          }

          var bands = bgMusic.bands || [0, 0, 0, 0, 0];
          var playing = bgMusic.isPlaying();

          for (var b = 0; b < 5; b++) {
            var target = playing ? bands[b] : 0;
            specSmooth[b] = specSmooth[b] * 0.82 + target * 0.18;
          }

          var energy = bgMusic.energy || 0;
          var bass = specSmooth[0] || 0;
          var body = specSmooth[1] || 0;
          var transient = Math.max(0, energy - specLastEnergy);

          if (!playing) {
            specHistory = [];
            specLastSampleAt = now;
            specLastEnergy = 0;
            specPhase = 0;
          } else {
            if (!specLastSampleAt) specLastSampleAt = now;
            var elapsed = now - specLastSampleAt;
            // 约 24fps 写入历史，降低数组与绘制压力
            var steps = Math.min(2, Math.floor(elapsed / 42));

            for (var s = 0; s < steps; s++) {
              var sampleEnergy = energy < 0 ? 0 : energy > 1 ? 1 : energy;
              var sampleBass = bass < 0 ? 0 : bass > 1 ? 1 : bass;
              var sampleBody = body < 0 ? 0 : body > 1 ? 1 : body;

              // 振幅动态范围拉大：让波峰波谷的强弱对比非常明显
              var amp = 14 + sampleEnergy * 56 + sampleBass * 62 + transient * 88;

              // 频率刻意放低：同样宽度内波浪数量更少，避免像弹簧一样拥挤
              specPhase += 0.018 + sampleBass * 0.05 + sampleBody * 0.016;

              // 相位扭曲：前陡后缓，模拟被风推着走的海浪式不对称尖峰
              var skewed = specPhase + 0.32 * Math.sin(specPhase);
              // 三角波代替正弦：折角尖锐，而不是圆润的弧线
              var tri = (2 / Math.PI) * Math.asin(Math.sin(skewed));

              // 缓慢包络：大浪、小浪交替的呼吸感，让线条更飘逸
              var swell = 0.6 + 0.4 * Math.max(0, Math.sin(specPhase * 0.22 + 0.4));
              var punch = transient * 3.5 > 1 ? 1 : transient * 3.5;

              var sample = tri * amp * (swell + punch * 0.5);

              // 只做很轻的单次平滑：既不抖动，又保留三角波的尖锐折角
              if (specHistory.length > 0) {
                sample = sample * 0.82 + specHistory[specHistory.length - 1] * 0.18;
              }

              specHistory.push(sample);
              // 控制点数：手机上 96 点已够顺滑，显著减少 path 计算
              if (specHistory.length > 96) specHistory.shift();
            }

            if (steps > 0) specLastSampleAt += steps * 42;
            specLastEnergy = energy;
          }

          var points = specHistory.length;
          if (points < 2) {
            ctx.restore && ctx.restore();
            return;
          }

          var maxAbs = 1;
          for (var m = 0; m < points; m++) {
            var a = specHistory[m];
            if (a < 0) a = -a;
            if (a > maxAbs) maxAbs = a;
          }

          // 预计算坐标，避免重复三角函数与颜色解析
          if (!drawSpectrum._xs) {
            drawSpectrum._xs = new Float32Array(128);
            drawSpectrum._ys = new Float32Array(128);
          }
          var xs = drawSpectrum._xs;
          var ys = drawSpectrum._ys;
          var invMax = 1 / maxAbs;
          var invN = 1 / (points - 1);

          for (var i = 0; i < points; i++) {
            var t = i * invN;
            // 从右往左推进
            xs[i] = (1 - t) * w;
            var normalized = specHistory[i] * invMax;

            y = mid + (dy * (h * 0.52)) / (1 + dy2 * 0.35);
            ys[i] = y;

          ctx.lineCap = "round";

          // 细虚线：- - - 非连续

          ctx.setLineDash([7, 6]);
          ctx.shadowBlur = 0;

          // 彩虹细虚线：分 5 色带，每带一次 stroke
          var bandsN = 5;
          var seg = Math.max(1, (points / bandsN) | 0);
          for (var k = 0; k < bandsN; k++) {
            var i0 = k * seg;
            var i1 = k === bandsN - 1 ? points - 1 : (k + 1) * seg;
            if (i1 <= i0) continue;
            var tMid = (i0 + i1) * 0.5 * invN;
            ctx.beginPath();
            ctx.moveTo(xs[i0], ys[i0]);
            for (var i = i0 + 1; i <= i1; i++) ctx.lineTo(xs[i], ys[i]);
            ctx.strokeStyle = specColorAt(tMid);
            ctx.stroke();
          }

          ctx.setLineDash([]);
          ctx.restore();
        }

          var ticks = 0;
          var timer = setInterval(function () {
            setReel(reelEls[0], randSym());
            setReel(reelEls[1], randSym());
            setReel(reelEls[2], randSym());
            ticks++;
            if (ticks > 12) {
              clearInterval(timer);
              var a = randSym();
              var b = randSym();
              var c = randSym();
              setReel(reelEls[0], a);
              setReel(reelEls[1], b);
              setReel(reelEls[2], c);
              var win = 0;
              if (a.label === b.label && b.label === c.label) {
                win = bet * a.mult;
                setMsg(a.label + a.label + a.label + " +" + win);
              } else if (
                a.label === b.label ||
                a.label === c.label ||
                b.label === c.label
              ) {
                win = bet * 2;
                setMsg("一对 +" + win);
              } else {
                setMsg("");
              }
              if (win > 0) {
                bal += win;
                if (sc) {
                  sc.balance = bal;
                  sc.lastWin = win;
                  if (sc.updateDisplay) sc.updateDisplay();
                  else if (sc.saveGameState) sc.saveGameState();
                } else {
                  try {
                    localStorage.setItem(
                      "wanjin_slot_save",
                      JSON.stringify({
                        balance: bal,
                        bet: bet,
                        jackpotValue: 25800,
                      }),
                    );
                  } catch (e) {}
                }
              }
              syncWallet();
              miniSpinning = false;
              spinBtn.disabled = false;
            }
          }, 70);
        });

        setInterval(updateClock, 1000);
        updateClock();
        syncWallet();
        syncPlayUi();

        window.__phonograph = {
          start: startPh,
          stop: stopPh,
          sync: function () {
            syncWallet();
            syncPlayUi();
          },
        };
      })();

      // 横竖屏切换：竖屏留声机 / 横屏老虎机
      (function setupOrientationTransition() {
        var tip = document.getElementById("rotate-tip");
        var game = document.getElementById("game");
        if (!tip || !game) return;

        var lastPortrait = null;

        function apply(portrait, animate) {
          if (portrait === lastPortrait) return;
          lastPortrait = portrait;

          if (portrait) {
            game.classList.add("dimmed");
            if (animate && window.requestAnimationFrame) {
              requestAnimationFrame(function () {
                tip.classList.add("show");
              });
            } else {
              tip.classList.add("show");
            }
            if (window.__phonograph) window.__phonograph.start();
          } else {
            tip.classList.remove("show");
            if (window.__phonograph) window.__phonograph.stop();
            if (animate) {
              setTimeout(function () {
                game.classList.remove("dimmed");
              }, 420);
            } else {
              game.classList.remove("dimmed");
            }
            if (window.__phonograph) window.__phonograph.sync();
          }
        }

        function isPortrait() {
          try {
            if (window.matchMedia) {
              return window.matchMedia("(orientation: portrait)").matches;
            }
          } catch (e) {}
          return window.innerHeight > window.innerWidth;
        }

        function check(animate) {
          apply(isPortrait(), animate);
        }

        check(false);

        var onChange = function () {
          check(true);
        };
        window.addEventListener("orientationchange", onChange);
        window.addEventListener("resize", onChange);

        try {
          if (window.matchMedia) {
            var mql = window.matchMedia("(orientation: portrait)");
            if (mql.addEventListener) {
              mql.addEventListener("change", onChange);
            } else if (mql.addListener) {
              mql.addListener(onChange);
            }
          }
        } catch (e) {}
      })();
    </script>
  </body>
