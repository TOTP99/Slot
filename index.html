        toggleCoinModal(show) {
          this.coinModalGroup.setVisible(show);
        }

        // 一点即转：手飞入握住 → 连贯拉下 → 开转（拉杆 / SPIN / 空格共用）
        pullLever(thenStart = true) {
          if (this.leverState === "down") return;

          this.leverState = "down";
          this.spinHint.setText("点击急停");
          this.sfx.leverGrip();

          this.tweens.killTweensOf(this.leverHand);
          this.tweens.killTweensOf(this.leverContainer);

          // 从侧上方飞入并握住
          const midX = (this.handRestX + this.handGripX) / 2 + 8;
          const midY = (this.handRestY + this.handGripY) / 2 - 18;

          this.leverHand.setText("✋");
          this.leverHand.setAlpha(0);
          this.leverHand.setPosition(this.handRestX, this.handRestY);
          this.leverHand.setScale(0.85);
          this.leverHand.setAngle(-40);

          // 1) 淡入 + 弧线接近
          this.tweens.add({
            targets: this.leverHand,
            alpha: 1,
            scale: 1.05,
            duration: 90,
            ease: "Sine.easeOut",
          });

          this.tweens.add({
            targets: this.leverHand,
            x: midX,
            y: midY,
            angle: -18,
            duration: 120,
            ease: "Sine.easeOut",
            onComplete: () => {
              // 2) 落到手柄并握紧
              this.tweens.add({
                targets: this.leverHand,
                x: this.handGripX,
                y: this.handGripY,
                angle: -4,
                scale: 0.96,
                duration: 110,
                ease: "Cubic.easeInOut",
                onComplete: () => {
                  this.leverHand.setText("✊");
                  this.sfx.leverPull();

                  // 3) 微抬蓄力后重压拉下
                  this.tweens.add({
                    targets: this.leverHand,
                    y: this.handGripY - 5,
                    scale: 0.94,
                    duration: 50,
                    ease: "Sine.easeOut",
                    onComplete: () => {
                      this.tweens.add({
                        targets: this.leverHand,
                        x: this.handGripX + 14,
                        y: this.handGripY + 72,
                        angle: 32,
                        scale: 0.88,
                        duration: 260,
                        ease: "Cubic.easeIn",
                        onComplete: () => {
                          this.tweens.add({
                            targets: this.leverHand,
                            y: this.handGripY + 68,
                            scale: 0.92,
                            duration: 90,
                            ease: "Sine.easeOut",
                          });
                        },
                      });
                    },
                  });

                  this.tweens.add({
                    targets: this.leverContainer,
                    angle: -22,
                    duration: 50,
                    ease: "Sine.easeOut",
                    onComplete: () => {
                      this.tweens.add({
                        targets: this.leverContainer,
                        angle: 55,
                        duration: 260,
                        ease: "Cubic.easeIn",
                        onComplete: () => {
                          this.cameras.main.shake(110, 0.008);

                          this.tweens.add({
                            targets: this.leverContainer,
                            angle: 48,
                            duration: 90,
                            yoyo: true,
                            ease: "Sine.easeOut",
                          });

                          if (thenStart) {
                            this.startSpin();
                          }
                        },
                      });
                    },
                  });
                },
              });
            },
          });
        }

        resetLever() {
          this.leverState = "up";
          this.spinHint.setText("点击拉杆开转");
          this.sfx.leverReset();

          this.tweens.killTweensOf(this.leverHand);
          this.tweens.killTweensOf(this.leverContainer);

          // 松手：张开 → 滑开淡出
          this.leverHand.setText("✋");

          this.tweens.add({
            targets: this.leverHand,
            scale: 1.05,
            angle: 8,
            duration: 100,
            ease: "Sine.easeOut",
            onComplete: () => {
              this.tweens.add({
                targets: this.leverHand,
                alpha: 0,
                x: this.handRestX,
                y: this.handRestY - 10,
                angle: -30,
                scale: 0.9,
                duration: 320,
                ease: "Cubic.easeInOut",
                onComplete: () => {
                  if (this.leverHand) {
                    this.leverHand.setText("✋");
                    this.leverHand.setScale(1);
                  }
                },
              });
            },
          });

          this.tweens.add({
            targets: this.leverContainer,
            angle: -18,
            duration: 420,
            ease: "Back.easeOut",
          });

          this.leverHandle.setFillStyle(0xb8860b);
          this.leverHandle.setStrokeStyle(3, 0xffe566);
        }

        // 赔率弹窗 + 速度 / 自动五次 / 音效 设置（点击"赔率"键弹出）
        // 左右两栏布局：左边赔率表，右边游戏设置，紧凑横向排列
        createSettingsModal() {
          const cx = GAME_WIDTH / 2;
          const cy = GAME_HEIGHT / 2;
          const panelW = 680;
          const panelH = 340; // 去掉音量滑杆后收紧高度
          const top = cy - panelH / 2;

          this.settingsModalGroup = this.add
            .container(0, 0)
            .setDepth(100)
            .setVisible(false);

          const children = [];

          // 全屏遮罩，点击空白处关闭
          const overlay = this.add
            .rectangle(0, 0, GAME_WIDTH, GAME_HEIGHT, 0x000000, 0.65)
            .setOrigin(0)
            .setInteractive();
          overlay.on("pointerdown", () => this.toggleSettingsModal(false));
          children.push(overlay);

          // 面板本体（拦截点击，避免穿透到遮罩）
          const panel = this.add
            .rectangle(cx, cy, panelW, panelH, 0x1a0d02, 0.97)
            .setStrokeStyle(3, 0xffd700)
            .setInteractive();
          panel.on("pointerdown", (pointer, lx, ly, event) => {
            event.stopPropagation();
          });
          children.push(panel);

          const title = this.add
            .text(cx, top + 24, "赔率与设置", {
              fontSize: "22px",
              fontStyle: "bold",
              color: "#ffd700",
              stroke: "#000000",
              strokeThickness: 3,
            })
            .setOrigin(0.5);
          children.push(title);

          // ---------- 左右两栏坐标 ----------
          const pad = 24;
          const contentLeft = cx - panelW / 2 + pad;
          const contentRight = cx + panelW / 2 - pad;
          const dividerX = cx - 20; // 竖分隔线（略偏左，右侧设置栏多留一些空间）

          const headerY = top + 52;
          const leftHeaderX = (contentLeft + dividerX) / 2;
          const rightHeaderX = (dividerX + contentRight) / 2;

          const leftHeader = this.add
            .text(leftHeaderX, headerY, "赔率", {
              fontSize: "17px",
              fontStyle: "bold",
              color: "#ffe9a6",
            })
            .setOrigin(0.5);
          const rightHeader = this.add
            .text(rightHeaderX, headerY, "设置", {
              fontSize: "17px",
              fontStyle: "bold",
              color: "#ffe9a6",
            })
            .setOrigin(0.5);
          children.push(leftHeader, rightHeader);

          // 表头下方的横向分隔线，贯穿全宽
          const hDividerY = headerY + 18;
          const hDivider = this.add
            .rectangle(cx, hDividerY, panelW - pad * 2, 2, 0xffd700, 0.4)
            .setOrigin(0.5);
          children.push(hDivider);

          const contentTop = hDividerY + 22;

          // ---------- 左栏：三连赔率列表（整体放大约15%，看得更清楚） ----------
          const oddsRowH = 31;
          const listStartY = contentTop;
          SYMBOLS.forEach((symbol, index) => {
            const rowY = listStartY + index * oddsRowH;

            const symText = this.add
              .text(
                contentLeft,
                rowY,
                `${symbol.label}${symbol.label}${symbol.label}`,
                {
                  fontSize: "20px",
                  fontStyle: "bold",
                  color: symbol.color,
                  stroke: "#000000",
                  strokeThickness: 3,
                },
              )
              .setOrigin(0, 0.5);

            const multText = this.add
              .text(dividerX - 12, rowY, `${symbol.multiplier}x`, {
                fontSize: "18px",
                fontStyle: "bold",
                color: "#ffe9a6",
              })
              .setOrigin(1, 0.5);

            children.push(symText, multText);
          });

          // 最下一行：任意一对 2x
          const pairRowY = listStartY + SYMBOLS.length * oddsRowH;
          const pairSymText = this.add
            .text(contentLeft, pairRowY, "任意一对", {
              fontSize: "18px",
              fontStyle: "bold",
              color: UI.cream,
            })
            .setOrigin(0, 0.5);
          const pairMultText = this.add
            .text(dividerX - 12, pairRowY, "2x", {
              fontSize: "18px",
              fontStyle: "bold",
              color: "#ffe9a6",
            })
            .setOrigin(1, 0.5);
          children.push(pairSymText, pairMultText);

          // ---------- 右栏：设置选项 ----------
          const optBtnW = 70;
          const optBtnH = 28;
          const rowLabelX = dividerX + 22;
          const optAX = rowLabelX + 128;
          const optBX = optAX + 78;

          const makeOptionButton = (x, y, label) => {
            const bg = this.add
              .rectangle(x, y, optBtnW, optBtnH, UI.panelDeep, 0.96)
              .setStrokeStyle(2, UI.gold)
              .setInteractive({ useHandCursor: true });
            const txt = this.add
              .text(x, y, label, {
                fontSize: "12px",
                fontStyle: "bold",
                color: UI.cream,
              })
              .setOrigin(0.5);
            children.push(bg, txt);
            return { bg, txt };
          };

          // ---------- 速度：正常 / 加速 ----------
          const speedRowY = contentTop;
          const speedLabel = this.add
            .text(rowLabelX, speedRowY, "速度", {
              fontSize: "15px",
              fontStyle: "bold",
              color: "#ffd700",
            })
            .setOrigin(0, 0.5);
          children.push(speedLabel);

          const normalOpt = makeOptionButton(optAX, speedRowY, "正常");
          const fastOpt = makeOptionButton(optBX, speedRowY, "加速");

          this.speedButtons = [
            { label: "NORMAL", btn: normalOpt.bg, txt: normalOpt.txt },
            { label: "FAST", btn: fastOpt.bg, txt: fastOpt.txt },
          ];

          const selectSpeed = (label) => {
            if (this.isSpinning) return;
            this.sfx.click();
            this.mode = label;
            this.updateSpeedButtons();
            this.setMessage(`速度：${label === "NORMAL" ? "正常" : "加速"}`);
          };

          normalOpt.bg.on("pointerdown", (pointer, lx, ly, event) => {
            event.stopPropagation();
            selectSpeed("NORMAL");
          });
          fastOpt.bg.on("pointerdown", (pointer, lx, ly, event) => {
            event.stopPropagation();
            selectSpeed("FAST");
          });

          this.updateSpeedButtons();

          // ---------- 自动五次：是 / 否 ----------
          const autoRowY = speedRowY + 42;
          const autoLabel = this.add
            .text(rowLabelX, autoRowY, "自动五次", {
              fontSize: "15px",
              fontStyle: "bold",
              color: "#ffd700",
            })
            .setOrigin(0, 0.5);
          children.push(autoLabel);

          const autoYesOpt = makeOptionButton(optAX, autoRowY, "是");
          const autoNoOpt = makeOptionButton(optBX, autoRowY, "否");
          this.autoYesButton = autoYesOpt;
          this.autoNoButton = autoNoOpt;

          autoYesOpt.bg.on("pointerdown", (pointer, lx, ly, event) => {
            event.stopPropagation();
            if (!this.autoPlay) {
              this.sfx.click();
              this.toggleAutoPlay();
            }
          });
          autoNoOpt.bg.on("pointerdown", (pointer, lx, ly, event) => {
            event.stopPropagation();
            if (this.autoPlay) {
              this.sfx.click();
              this.toggleAutoPlay();
            }
          });

          this.updateAutoOptionButtons();

          // ---------- 音效：开启 / 关闭 ----------
          const soundRowY = autoRowY + 42;
          const soundLabel = this.add
            .text(rowLabelX, soundRowY, "音效", {
              fontSize: "15px",
              fontStyle: "bold",
              color: "#ffd700",
            })
            .setOrigin(0, 0.5);
          children.push(soundLabel);

          const soundOnOpt = makeOptionButton(optAX, soundRowY, "开启");
          const soundOffOpt = makeOptionButton(optBX, soundRowY, "关闭");
          this.soundOnButton = soundOnOpt;
          this.soundOffButton = soundOffOpt;

          soundOnOpt.bg.on("pointerdown", (pointer, lx, ly, event) => {
            event.stopPropagation();
            if (!this.sfx.enabled) {
              this.sfx.enabled = true;
              this.sfx.click();
              this.updateSoundOptionButtons();
            }
          });
          soundOffOpt.bg.on("pointerdown", (pointer, lx, ly, event) => {
            event.stopPropagation();
            if (this.sfx.enabled) {
              this.sfx.enabled = false;
              this.updateSoundOptionButtons();
            }
          });

          this.updateSoundOptionButtons();

          // ---------- 音乐：开启 / 关闭 ----------
          const musicRowY = soundRowY + 42;
          const musicLabel = this.add
            .text(rowLabelX, musicRowY, "音乐", {
              fontSize: "15px",
              fontStyle: "bold",
              color: "#ffd700",
            })
            .setOrigin(0, 0.5);
          children.push(musicLabel);

          const musicOnOpt = makeOptionButton(optAX, musicRowY, "开启");
          const musicOffOpt = makeOptionButton(optBX, musicRowY, "关闭");
          this.musicOnButton = musicOnOpt;
          this.musicOffButton = musicOffOpt;

          musicOnOpt.bg.on("pointerdown", (pointer, lx, ly, event) => {
            event.stopPropagation();
            if (!bgMusic.enabled) {
              bgMusic.setEnabled(true);
              this.sfx.click();
              this.updateMusicOptionButtons();
              this.setEqVisualizerActive(true);
            }
          });
          musicOffOpt.bg.on("pointerdown", (pointer, lx, ly, event) => {
            event.stopPropagation();
            if (bgMusic.enabled) {
              bgMusic.setEnabled(false);
              this.sfx.click();
              this.updateMusicOptionButtons();
              this.setEqVisualizerActive(false);
            }
          });

          this.updateMusicOptionButtons();

          // ---------- 播放模式：顺序播放 / 随机播放 ----------
          const shuffleRowY = musicRowY + 40;
          const shuffleLabel = this.add
            .text(rowLabelX, shuffleRowY, "播放模式", {
              fontSize: "15px",
              fontStyle: "bold",
              color: "#ffd700",
            })
            .setOrigin(0, 0.5);
          children.push(shuffleLabel);

          const orderOpt = makeOptionButton(optAX, shuffleRowY, "顺序");
          const shuffleOpt = makeOptionButton(optBX, shuffleRowY, "随机");
          this.orderPlayButton = orderOpt;
          this.shufflePlayButton = shuffleOpt;

          orderOpt.bg.on("pointerdown", (pointer, lx, ly, event) => {
            event.stopPropagation();
            if (bgMusic.shuffle) {
              bgMusic.setShuffle(false);
              this.sfx.click();
              this.updatePlayModeButtons();
            }
          });
          shuffleOpt.bg.on("pointerdown", (pointer, lx, ly, event) => {
            event.stopPropagation();
            if (!bgMusic.shuffle) {
              bgMusic.setShuffle(true);
              this.sfx.click();
              this.updatePlayModeButtons();
            }
          });

          this.updatePlayModeButtons();

          // ---------- 左右两栏之间的竖分隔线（按实际内容高度绘制）----------
          const vDividerTop = contentTop - 14;
          const vDividerBottom = shuffleRowY + 24;
          const vDivider = this.add
            .rectangle(
              dividerX,
              (vDividerTop + vDividerBottom) / 2,
              2,
              vDividerBottom - vDividerTop,
              0xffd700,
              0.25,
            )
            .setOrigin(0.5);
          children.push(vDivider);

          // ---------- 关闭按钮 ----------
          const closeBtn = this.add
            .text(cx + panelW / 2 - 22, top + 20, "✕", {
              fontSize: "20px",
              fontStyle: "bold",
              color: "#ffe9a6",
            })
            .setOrigin(0.5)
            .setInteractive({ useHandCursor: true });
          closeBtn.on("pointerover", () => closeBtn.setColor("#ffd700"));
          closeBtn.on("pointerout", () => closeBtn.setColor("#ffe9a6"));
          closeBtn.on("pointerdown", (pointer, lx, ly, event) => {
            event.stopPropagation();
            this.toggleSettingsModal(false);
          });
          children.push(closeBtn);

          this.settingsModalGroup.add(children);
        }

        toggleSettingsModal(show) {
          this.settingsModalGroup.setVisible(show);
        }

        updateAutoOptionButtons() {
          if (!this.autoYesButton || !this.autoNoButton) return;
          this.setControlActive(
            this.autoYesButton.bg,
            this.autoYesButton.txt,
            this.autoPlay,
          );
          this.setControlActive(
            this.autoNoButton.bg,
            this.autoNoButton.txt,
            !this.autoPlay,
          );
        }

        updateSoundOptionButtons() {
          if (!this.soundOnButton || !this.soundOffButton) return;
          this.setControlActive(
            this.soundOnButton.bg,
            this.soundOnButton.txt,
            this.sfx.enabled,
          );
          this.setControlActive(
            this.soundOffButton.bg,
            this.soundOffButton.txt,
            !this.sfx.enabled,
          );
        }

        updateMusicOptionButtons() {
          if (!this.musicOnButton || !this.musicOffButton) return;
          this.setControlActive(
            this.musicOnButton.bg,
            this.musicOnButton.txt,
            bgMusic.enabled,
          );
          this.setControlActive(
            this.musicOffButton.bg,
            this.musicOffButton.txt,
            !bgMusic.enabled,
          );
        }

        // 音乐开关：点亮/熄灭频谱条（真实跳动由 updateEqVisualizer 驱动）
        setEqVisualizerActive(active) {
          if (!this.eqBars) return;
          this.eqActive = !!active;
          this.eqGlowAlpha = active ? 0.08 : 0.02;

          this.eqBars.forEach((bar) => {
            if (active) {
              bar.setAlpha(0.9);
            } else {
              this.tweens.add({
                targets: bar,
                scaleY: 0.1,
                alpha: 0.25,
                duration: 220,
                ease: "Sine.easeOut",
              });
            }
          });
        }

        // ~30fps 驱动：频谱条高度每拍更新；光晕颜色变化慢，减少插值开销
        updateEqVisualizer() {
          if (!this.eqBars || !this.eqGlow) return;
          if (this.eqPageHidden) return;

          const bands = bgMusic.sampleSpectrum();
          const playing = this.eqActive && bgMusic.isPlaying();

          for (let i = 0; i < 5; i++) {
            const level = playing
              ? bands[i] * 1.15 > 1
                ? 1
                : bands[i] * 1.15 < 0.08
                  ? 0.08
                  : bands[i] * 1.15
              : 0.1;
            const cur = this.eqBars[i].scaleY;
            const next = cur * 0.35 + level * 0.65;
            this.eqBars[i].scaleY = next;
            this.eqBars[i].setAlpha(playing ? 0.55 + next * 0.4 : 0.25);
          }

          // 光晕：能量变化够大或播放状态切换才重算颜色
          const e = bgMusic.energy;
          if (
            playing === this._eqLastPlaying &&
            Math.abs(e - (this._eqLastEnergy || 0)) < 0.05
          ) {
            // 仅微调透明度
            if (playing) {
              this.eqGlow.setAlpha(
                Math.min(0.35, (this.eqGlowAlpha || 0.08) * (0.6 + e * 1.2)),
              );
            }
            return;
          }
          this._eqLastPlaying = playing;
          this._eqLastEnergy = e;

          const b = bgMusic.brightness > 1.3 ? 1.3 : bgMusic.brightness < 0 ? 0 : bgMusic.brightness;
          const v =
            bgMusic.vocalBias > 0.6
              ? 0.6
              : bgMusic.vocalBias < -0.6
                ? -0.6
                : bgMusic.vocalBias;

          let c1, c2;
          if (!playing) {
            c1 = 0x3a2a10;
            c2 = 0x1a1208;
          } else if (v > 0.12) {
            c1 = 0xff4da6;
            c2 = 0x40e0ff;
          } else if (v < -0.12) {
            c1 = 0xff8c42;
            c2 = 0xffd700;
          } else if (b > 0.85) {
            c1 = 0x40e0ff;
            c2 = 0xffe566;
          } else {
            c1 = 0xc9a227;
            c2 = 0xffd700;
          }

          const mix = 0.35 + e * 0.5 + b * 0.15;
          const t = mix < 0 ? 0 : mix > 1 ? 1 : mix;
          const col = Phaser.Display.Color.Interpolate.ColorWithColor(
            Phaser.Display.Color.ValueToColor(c1),
            Phaser.Display.Color.ValueToColor(c2),
            100,
            (t * 100) | 0,
          );
          const alpha = playing
            ? (this.eqGlowAlpha || 0.08) * (0.6 + e * 1.2)
            : 0.02;
          this.eqGlow.setFillStyle(
            Phaser.Display.Color.GetColor(col.r, col.g, col.b),
            alpha > 0.35 ? 0.35 : alpha,
          );
        }

        update(_time, delta) {
          // 频谱可视化约 30fps，避免每帧 FFT + 改色
          this._eqAcc = (this._eqAcc || 0) + delta;
          if (this._eqAcc < 33) return;
          this._eqAcc = 0;
          this.updateEqVisualizer();
        }

        updatePlayModeButtons() {
          if (!this.orderPlayButton || !this.shufflePlayButton) return;
          this.setControlActive(
            this.orderPlayButton.bg,
            this.orderPlayButton.txt,
            !bgMusic.shuffle,
          );
          this.setControlActive(
            this.shufflePlayButton.bg,
            this.shufflePlayButton.txt,
            bgMusic.shuffle,
          );
        }

        updateSpeedButtons() {
          this.speedButtons.forEach(({ label, btn, txt }) => {
            this.setControlActive(btn, txt, label === this.mode);
          });
        }

        createKeyboardControls() {
          this.input.keyboard.on("keydown-SPACE", () => {
            this.sfx.click();
            this.handleSpinInput();
          });
        }

        createAmbientAnimations() {
          this.tweens.add({
            targets: this.machineGlow,
            alpha: 0.22,
            duration: 1300,
            yoyo: true,
            repeat: -1,
          });

          [this.paylineTop, this.paylineMiddle, this.paylineBottom].forEach(
            (line, index) => {
              this.tweens.add({
                targets: line,
                alpha: index === 1 ? 1 : 0.55,
                duration: 900,
                yoyo: true,
                repeat: -1,
              });
            },
          );

          this.tweens.add({
            targets: this.jackpotText,
            scale: 1.04,
            duration: 1000,
            yoyo: true,
            repeat: -1,
          });
        }

        updateDisplay() {
          fitTextToBox(
            this.balanceValue,
            this.formatMoney(this.balance),
            LAYOUT.balanceW - 35,
            21,
            13,
          );

          fitTextToBox(
            this.betValue,
            this.formatMoney(this.bet),
            LAYOUT.betW - 95,
            20,
            12,
          );

          fitTextToBox(
            this.lastWinValue,
            this.formatMoney(this.lastWin),
            LAYOUT.lastWinW - 35,
            21,
            13,
          );

          fitTextToBox(
            this.jackpotText,
            `💎 JACKPOT ${this.formatMoney(this.jackpotValue)}`,
            320,
            21,
            14,
          );

          this.saveGameState();
        }

        changeBet(amount) {
          if (this.isSpinning) return;

          this.sfx.click();

          this.bet = Phaser.Math.Clamp(
            this.bet + amount,
            this.minBet,
            this.maxBet,
          );

          fitTextToBox(
            this.betValue,
            this.formatMoney(this.bet),
            LAYOUT.betW - 95,
            20,
            12,
          );

          // 连续快速点击 +/- 时，先停掉上一次未播完的缩放动画，避免叠加抖动
          this.tweens.killTweensOf(this.betValue);
          this.betValue.setScale(1);
          this.tweens.add({
            targets: this.betValue,
            scale: 1.18,
            duration: 120,
            yoyo: true,
          });
        }

        setBetButtonsEnabled(enabled) {
          if (!this.betMinus || !this.betPlus) return;

          const alpha = enabled ? 1 : 0.45;

          this.betMinus.disableInteractive();
          this.betPlus.disableInteractive();

          if (enabled) {
            this.betMinus.setInteractive({ useHandCursor: true });
            this.betPlus.setInteractive({ useHandCursor: true });
          }

          [
            this.betMinus,
            this.betPlus,
            this.betMinusText,
            this.betPlusText,
          ].forEach((item) => item.setAlpha(alpha));
        }

        toggleAutoPlay() {
          this.autoPlay = !this.autoPlay;

          if (this.autoPlay) {
            this.autoPlayRounds = 0;
            this.updateAutoOptionButtons();
            this.setMessage(`自动模式已开启（${this.maxAutoPlayRounds}次）`);

            if (!this.isSpinning) {
              this.time.delayedCall(350, () => {
                if (this.autoPlay && !this.isSpinning) {
                  this.startSpin();
                }
              });
            }
          } else {
            this.updateAutoButtonOff();
            this.setMessage("自动模式已关闭");
          }
        }

        updateAutoButtonOff() {
          this.updateAutoOptionButtons();
        }

        // 统一入口：拉杆 / SPIN / 空格
        // 空闲 → 拉杆动画并开转；转动中 → 急停
        handleSpinInput() {
          if (this.inputLocked) return;

          this.inputLocked = true;
          this.time.delayedCall(280, () => {
            this.inputLocked = false;
          });

          if (this.isSpinning) {
            this.requestStop();
            return;
          }

          // 拉杆正在下落动画中，忽略重复点击
          if (this.leverState === "down") return;

          this.pullLever(true);
        }

        requestStop() {
          if (!this.isSpinning || this.stopRequested) return;

          this.stopRequested = true;
          this.setMessage("正在急停...");

          this.reels.forEach((reel, index) => {
            if (!reel.stopped && !reel.forceStopScheduled) {
              reel.forceStopScheduled = true;
              this.time.delayedCall(index * 140, () =>
                this.stopReel(reel, index),
              );
            }
          });
        }

        startSpin() {
          if (this.isSpinning) return;

          if (this.balance < this.bet) {
            this.setMessage("余额不足，无法开始！");
            this.sfx.lose();
            this.autoPlay = false;
            this.updateAutoButtonOff();
            this.resetLever();
            return;
          }

          // 自动模式等非手动拉杆路径：若拉杆未下，补一段简短甩下动画
          if (this.leverState !== "down") {
            this.leverState = "down";
            this.spinHint.setText("点击急停");
            this.sfx.leverPull();
            this.leverHand.setText("✊");
            this.leverHand.setAlpha(1);
            this.leverHand.setPosition(this.handGripX, this.handGripY);
            this.tweens.add({
              targets: this.leverContainer,
              angle: 48,
              duration: 200,
              ease: "Cubic.easeIn",
            });
            this.tweens.add({
              targets: this.leverHand,
              y: this.handGripY + 70,
              x: this.handGripX + 12,
              angle: 28,
              scale: 0.9,
              duration: 200,
            });
          }

          this.reels.forEach((reel) => {
            if (reel.intervalEvent) {
              reel.intervalEvent.remove(false);
              reel.intervalEvent = null;
            }

            reel.stopped = true;
            reel.forceStopScheduled = false;
            reel.container.y = LAYOUT.reelY;
          });

          this.isSpinning = true;
          this.stopRequested = false;
          this.stoppedReelsCount = 0;
          this.setBetButtonsEnabled(false);

          this.animateBalanceDecrease(this.bet);

          this.jackpotValue += Math.max(1, Math.round(this.bet * 0.05));
          this.updateDisplay();

          if (this.autoPlay) {
            this.autoPlayRounds++;
            this.setMessage(
              `AUTO SPIN ${this.autoPlayRounds}/${this.maxAutoPlayRounds}`,
              18,
            );
          } else {
            const modeLabel = this.mode === "FAST" ? "加速" : "正常";
            this.setMessage(`${modeLabel} 转动中 • 空格急停`, 17);
          }

          this.reels.forEach((reel, index) => {
            this.startReelSpin(reel, index);
          });

          this.cameras.main.shake(90, 0.002);
        }

        animateBalanceDecrease(amount) {
          const startBalance = this.balance;
          const endBalance = this.balance - amount;

          this.balance = endBalance;

          this.tweens.addCounter({
            from: startBalance,
            to: endBalance,
            duration: 320,
            ease: "Cubic.easeOut",
            onUpdate: (tween) => {
              fitTextToBox(
                this.balanceValue,
                this.formatMoney(tween.getValue()),
                LAYOUT.balanceW - 35,
                21,
                13,
              );
            },
            onComplete: () => this.updateDisplay(),
          });

          this.tweens.add({
            targets: this.balanceValue,
            scale: 1.1,
            duration: 140,
            yoyo: true,
          });
        }

        startReelSpin(reel, index) {
          const settings = this.speedSettings[this.mode];

          if (reel.intervalEvent) {
            reel.intervalEvent.remove(false);
            reel.intervalEvent = null;
          }

          reel.stopped = false;
          reel.forceStopScheduled = false;

          reel.frame.setStrokeStyle(4, 0xff0066);

          const stopDelay = settings.duration + index * 320;
          const decelWindow = 260; // 停止前的减速窗口（毫秒），让转轮"滑行进站"而不是硬停
          const spinStartTime = this.time.now;

          reel.intervalEvent = this.time.addEvent({
            delay: settings.interval,
            loop: true,
            callback: () => {
              this.sfx.spinTick();

              // 越接近停止时刻，滚动步长越小，形成自然减速的滑行手感
              const remaining = stopDelay - (this.time.now - spinStartTime);
              const decelRatio =
                remaining < decelWindow
                  ? Math.max(0.25, remaining / decelWindow)
                  : 1;
              const step = settings.step * decelRatio;

              reel.items.forEach((item) => {
                item.txt.y += step;
                item.bg.y += step;

                if (item.txt.y > 128) {
                  const symbol = Phaser.Utils.Array.GetRandom(SYMBOLS);

                  item.symbol = symbol;
                  item.txt.y = -128;
                  item.bg.y = -128;
                  item.txt.setText(symbol.label);
                  item.txt.setColor(symbol.color);
                  item.txt.setFontSize(symbol.label.length > 1 ? 42 : 52);
                }
              });
            },
          });

          this.time.delayedCall(stopDelay, () => {
            // stopReel 内部已对 reel.stopped 做了守卫，急停场景下重复调用是安全的
            this.stopReel(reel, index);
          });
        }

        stopReel(reel, index) {
          if (reel.stopped) return;

          reel.stopped = true;

          if (reel.intervalEvent) {
            reel.intervalEvent.remove(false);
            reel.intervalEvent = null;
          }

          const finalSymbol = this.getControlledResult(index);
          reel.value = finalSymbol;

          reel.items.forEach((item, i) => {
            const randomSymbol = Phaser.Utils.Array.GetRandom(SYMBOLS);

            item.symbol = randomSymbol;
            item.txt.y = (i - 2) * 64;
            item.bg.y = (i - 2) * 64;
            item.txt.setText(randomSymbol.label);
            item.txt.setColor(randomSymbol.color);
            item.txt.setFontSize(randomSymbol.label.length > 1 ? 42 : 52);

            // 非中奖行的符号淡入落位，避免"瞬间贴图切换"的生硬感
            if (i !== 2) {
              item.txt.setAlpha(0.35);
              this.tweens.add({
                targets: item.txt,
                alpha: 1,
                duration: 150,
                ease: "Sine.easeOut",
              });
            }
          });

          const center = reel.items[2];

          center.symbol = finalSymbol;
          center.txt.setText(finalSymbol.label);
          center.txt.setColor(finalSymbol.color);
          center.txt.setFontSize(finalSymbol.label.length > 1 ? 42 : 52);
          center.txt.y = 0;
          center.bg.y = 0;

          this.sfx.reelStop();

          this.tweens.add({
            targets: reel.container,
            y: LAYOUT.reelY + 7,
            duration: 120,
            ease: "Sine.easeOut",
            yoyo: true,
          });

          this.tweens.add({
            targets: center.txt,
            scale: 1.15,
            duration: 140,
            yoyo: true,
          });

          reel.frame.setStrokeStyle(4, 0xffd700);

          this.stoppedReelsCount++;

          if (this.stoppedReelsCount >= this.reels.length) {
            this.time.delayedCall(300, () => {
              this.isSpinning = false;
              this.setBetButtonsEnabled(true);
              this.resetLever();
              this.checkWin();
            });
          }
        }

        // 每个转轮停止时的最终结果：完全随机（当前未做加权/控制概率，预留 index 供未来分轮控制）
        getControlledResult(index) {
          return Phaser.Utils.Array.GetRandom(SYMBOLS);
        }

        checkWin() {
          const [a, b, c] = this.reels.map((reel) => {
            const center = reel.items[2];
            return center.symbol || reel.value;
          });

          const isThreeOfAKind = a.key === b.key && b.key === c.key;
          const isPair = a.key === b.key || a.key === c.key || b.key === c.key;
          const isJackpot = isThreeOfAKind && a.key === "seven";

          if (isJackpot) {
            const win = this.jackpotValue;

            this.balance += win;
            this.lastWin = win;
            this.updateDisplay();

            this.setMessage(`JACKPOT! +${this.formatMoney(win)}`, 18);
            this.playJackpot();
            this.scheduleAutoPlay();
            return;
          }

          if (isThreeOfAKind) {
            const win = this.bet * a.multiplier;

            this.balance += win;
            this.lastWin = win;
            this.updateDisplay();

            this.setMessage(
              `${a.label}${a.label}${a.label} WIN +${this.formatMoney(win)}`,
              18,
            );
            this.playBigWin();
            this.scheduleAutoPlay();
            return;
          }

          if (isPair) {
            const pairSymbol = this.getPairSymbol(a, b, c);
            const win = this.bet * 2;

            this.balance += win;
            this.lastWin = win;
            this.updateDisplay();

            this.setMessage(
              `PAIR ${pairSymbol.label}${pairSymbol.label} +${this.formatMoney(win)}`,
              18,
            );
            this.playSmallWin();
            this.scheduleAutoPlay();
            return;
          }

          this.updateDisplay();
          this.setMessage("未中奖，再试一次！");
          this.sfx.lose();
          this.scheduleAutoPlay();
        }

        getPairSymbol(a, b, c) {
          if (a.key === b.key) return a;
          if (a.key === c.key) return a;
          if (b.key === c.key) return b;

          return a;
        }

        scheduleAutoPlay() {
          if (!this.autoPlay) return;

          if (
            this.autoPlayRounds >= this.maxAutoPlayRounds ||
            this.balance < this.bet
          ) {
            this.autoPlay = false;
            this.updateAutoButtonOff();
            this.setMessage("自动模式已结束");
            return;
          }

          this.time.delayedCall(850, () => {
            if (this.autoPlay && !this.isSpinning) {
              this.startSpin();
            }
          });
        }

        flashLines() {
          [this.paylineTop, this.paylineMiddle, this.paylineBottom].forEach(
            (line) => {
              this.tweens.add({
                targets: line,
                alpha: 1,
                scaleX: 1.07,
                duration: 120,
                yoyo: true,
                repeat: 6,
              });
            },
          );
        }

        playSmallWin() {
          this.sfx.smallWin();
          this.flashLines();

          this.reels.forEach((reel) => {
            this.tweens.add({
              targets: reel.container,
              scale: 1.06,
              duration: 140,
              yoyo: true,
              repeat: 2,
            });
          });
        }

        playBigWin() {
          this.sfx.bigWin();
          this.cameras.main.flash(350, 255, 215, 0);
          this.cameras.main.shake(450, 0.009);
          this.flashLines();

          this.reels.forEach((reel) => {
            reel.frame.setStrokeStyle(6, 0x00ff99);

            this.tweens.add({
              targets: reel.container,
              scale: 1.12,
              duration: 150,
              yoyo: true,
              repeat: 4,
            });
          });

          this.showWinText("BIG WIN!", "#00ff99");
          this.coinExplosion(45);

          this.time.delayedCall(1000, () => {
            this.reels.forEach((reel) =>
              reel.frame.setStrokeStyle(4, 0xffd700),
            );
          });
        }

        playJackpot() {
          this.sfx.jackpot();
          this.cameras.main.flash(600, 255, 215, 0);
          this.cameras.main.shake(800, 0.014);
          this.flashLines();

          this.tweens.add({
            targets: this.jackpotPanel,
            scale: 1.12,
            duration: 180,
            yoyo: true,
            repeat: 7,
          });

          this.showWinText("JACKPOT!", "#ffd700");
          this.coinExplosion(90);

          this.jackpotValue =
            this.baseJackpotValue + Phaser.Math.Between(250, 1250);
          this.updateDisplay();
        }

        showWinText(text, color) {
          const winText = this.add
            .text(470, 145, text, {
              fontSize: "60px",
              fontStyle: "bold",
              color,
              stroke: "#000000",
              strokeThickness: 9,
              shadow: {
                offsetX: 0,
                offsetY: 0,
                color,
                blur: 16,
                fill: true,
              },
            })
            .setOrigin(0.5);

          this.tweens.add({
            targets: winText,
            scale: 1.24,
            alpha: 0,
            duration: 1800,
            ease: "Cubic.easeOut",
            onComplete: () => winText.destroy(),
          });
        }

        // 金币爆散特效：分批生成，避免单帧瞬间创建大量对象造成卡顿（动画更流畅）
        coinExplosion(amount) {
          const batchSize = 15;
          const batches = Math.ceil(amount / batchSize);

          for (let batch = 0; batch < batches; batch++) {
            this.time.delayedCall(batch * 40, () => {
              const count = Math.min(batchSize, amount - batch * batchSize);

              for (let i = 0; i < count; i++) {
                const coin = this.add
                  .text(
                    Phaser.Math.Between(350, 590),
                    Phaser.Math.Between(200, 310),
                    "●",
                    {
                      fontSize: `${Phaser.Math.Between(18, 30)}px`,
                      color: "#ffd700",
                      stroke: "#7a3b00",
                      strokeThickness: 3,
                    },
                  )
                  .setOrigin(0.5);

                this.tweens.add({
                  targets: coin,
                  x: coin.x + Phaser.Math.Between(-300, 300),
                  y: coin.y - Phaser.Math.Between(90, 240),
                  alpha: 0,
                  scale: 1.8,
                  angle: Phaser.Math.Between(-360, 360),
                  duration: Phaser.Math.Between(800, 1400),
                  ease: "Cubic.easeOut",
                  onComplete: () => coin.destroy(),
                });
              }
            });
          }
        }
      }

      // ---------- 启动 ----------
      const config = {
        type: Phaser.AUTO,
        width: GAME_WIDTH,
        height: GAME_HEIGHT,
        parent: "game",
        backgroundColor: "#070006",
        banner: false,
        scale: {
          mode: Phaser.Scale.FIT,
          autoCenter: Phaser.Scale.CENTER_BOTH,
          width: GAME_WIDTH,
          height: GAME_HEIGHT,
        },
        render: {
          antialias: true,
          pixelArt: false,
          roundPixels: false,
        },
        scene: SlotGame,
      };

      const slotGame = new Phaser.Game(config);
      window.__slotGame = slotGame;

      // 首点解锁音频（iOS / 部分 Android 需用户手势）
      function unlockAudioOnce() {
        try {
          // 优先唤醒游戏实际使用的 SoundFX，而不是另开一个马上关闭的 AudioContext
          const gameScene =
            window.__slotGameScene ||
            (window.__slotGame && window.__slotGame.scene && window.__slotGame.scene.getScenes()[0]);
          if (gameScene && gameScene.sfx) {
            gameScene.sfx.enabled = true;
            gameScene.sfx.init();
            gameScene.sfx.warmup();
          } else {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (AC) {
              const ctx = new AC();
              if (ctx.state === "suspended") {
                const r = ctx.resume();
                if (r && typeof r.catch === "function") r.catch(() => {});
              }
            }
          }
        } catch (e) {}
        try {
          bgMusic.tryPlay(); // 首次用户手势时启动背景音乐（若已开启）
        } catch (e) {}
        document.removeEventListener("touchstart", unlockAudioOnce, true);
        document.removeEventListener("mousedown", unlockAudioOnce, true);
        document.removeEventListener("keydown", unlockAudioOnce, true);
      }
      document.addEventListener("touchstart", unlockAudioOnce, true);
      document.addEventListener("mousedown", unlockAudioOnce, true);
      document.addEventListener("keydown", unlockAudioOnce, true);

      function fitGameCanvas() {
        var canvas = document.querySelector("#game canvas");
        if (!canvas) return;
        canvas.style.width = "100%";
        canvas.style.height = "100%";
      }

      window.addEventListener("beforeunload", function () {
        try {
          if (window.__slotGameScene && window.__slotGameScene.clockTimer) {
            clearInterval(window.__slotGameScene.clockTimer);
          }
        } catch (e) {}
      });

      window.addEventListener("resize", function () {
        setTimeout(fitGameCanvas, 50);
      });
      window.addEventListener("orientationchange", function () {
        setTimeout(fitGameCanvas, 120);
      });

      // ---------- 竖屏留声机（第一稿）----------
      (function setupPhonograph() {
        var vinyl = document.getElementById("ph-vinyl");
        var arm = document.getElementById("ph-arm");
        var horn = document.getElementById("ph-horn");
        var label = document.getElementById("ph-label");
        var playBtn = document.getElementById("ph-play");
        var prevBtn = document.getElementById("ph-prev");
        var nextBtn = document.getElementById("ph-next");
        var orderChip = document.getElementById("ph-order");
        var shuffleChip = document.getElementById("ph-shuffle");
        var trackNum = document.getElementById("ph-track-num");
        var clockEl = document.getElementById("ph-clock");
        var balanceEl = document.getElementById("ph-balance");
        var betEl = document.getElementById("ph-bet");
        var msgEl = document.getElementById("ph-msg");
        var spinBtn = document.getElementById("ph-spin");
        var spectrum = document.getElementById("ph-spectrum");
        var reelEls = [
          document.getElementById("ph-r0"),
          document.getElementById("ph-r1"),
          document.getElementById("ph-r2"),
        ];
        if (!vinyl || !playBtn) return;

        var miniSpinning = false;
        var phActive = false;
        var raf = 0;
        var vinylAngle = 0;
        var vinylVel = 0;
        var specSmooth = [0, 0, 0, 0, 0];
        var lastPlaying = null;

        function pad2(n) {
          return (n < 10 ? "0" : "") + n;
        }

        function updateClock() {
          if (!clockEl) return;
          var d = new Date();
          clockEl.textContent = pad2(d.getHours()) + ":" + pad2(d.getMinutes());
        }

        function syncTrack() {
          if (trackNum) {
            trackNum.textContent =
              pad2(bgMusic.currentNum) + "/" + pad2(BG_MUSIC_MAX);
          }
        }

        function syncPlayUi() {
          var playing = bgMusic.isPlaying();
          if (playBtn) playBtn.textContent = playing ? "⏸" : "▶";
          if (vinyl) vinyl.classList.toggle("playing", playing);
          if (label) label.classList.toggle("playing", playing);
          if (horn) horn.classList.toggle("playing", playing);
          if (arm && playing !== lastPlaying) {
            arm.classList.toggle("down", playing);
            arm.classList.toggle("up", !playing);
            lastPlaying = playing;
          }
          syncTrack();
          if (orderChip && shuffleChip) {
            orderChip.classList.toggle("on", !bgMusic.shuffle);
            shuffleChip.classList.toggle("on", !!bgMusic.shuffle);
          }
        }

        function getScene() {
          return window.__slotGameScene || null;
        }

        function syncWallet() {
          var sc = getScene();
          var bal = sc ? sc.balance : 1000;
          var bet = sc ? sc.bet : 50;
          try {
            var raw = localStorage.getItem("wanjin_slot_save");
            if (raw && !sc) {
              var s = JSON.parse(raw);
              if (typeof s.balance === "number") bal = s.balance;
              if (typeof s.bet === "number") bet = s.bet;
            }
          } catch (e) {}
          if (balanceEl) balanceEl.textContent = "¥" + Number(bal).toFixed(0);
          if (betEl) betEl.textContent = "¥" + Number(bet).toFixed(0);
        }

        function setMsg(t) {
          if (msgEl) msgEl.textContent = t;
        }

        function drawSpectrum() {
          if (!spectrum || !phActive) return;
          var ctx = spectrum.getContext("2d");
          if (!ctx) return;
          var w = spectrum.width;
          var h = spectrum.height;
          var cx = w / 2;
          var cy = h / 2;
          ctx.clearRect(0, 0, w, h);

          bgMusic.sampleSpectrum();
          var bands = bgMusic.bands || [0, 0, 0, 0, 0];
          var playing = bgMusic.isPlaying();
          var colors = ["#c9a227", "#ff8c42", "#40e0ff", "#ff4da6", "#ffe566"];
          var barCount = 48;
          var inner = Math.min(w, h) * 0.36;
          var maxLen = Math.min(w, h) * 0.2;

          for (var b = 0; b < 5; b++) {
            var target = playing ? bands[b] : 0;
            specSmooth[b] = specSmooth[b] * 0.72 + target * 0.28;
          }

          for (var i = 0; i < barCount; i++) {
            var bi = i % 5;
            var level = specSmooth[bi];
            // 相邻条再插一点，弧面更顺
            var n1 = specSmooth[(bi + 1) % 5];
            var blend = level * 0.7 + n1 * 0.3;
            if (!playing) blend *= 0.15;
            blend = Math.max(0.05, Math.min(1, blend * 1.15));

            var ang = -Math.PI * 0.92 + (Math.PI * 1.45 * i) / (barCount - 1);
            var len = maxLen * blend;
            var x0 = cx + Math.cos(ang) * inner;
            var y0 = cy + Math.sin(ang) * inner;
            var x1 = cx + Math.cos(ang) * (inner + len);
            var y1 = cy + Math.sin(ang) * (inner + len);

            ctx.strokeStyle = colors[bi];
            ctx.globalAlpha = 0.25 + blend * 0.65;
            ctx.lineWidth = 2.5 + blend * 1.5;
            ctx.lineCap = "round";
            ctx.shadowColor = colors[bi];
            ctx.shadowBlur = 6 + blend * 10;
            ctx.beginPath();
            ctx.moveTo(x0, y0);
            ctx.lineTo(x1, y1);
            ctx.stroke();
          }
          ctx.shadowBlur = 0;
          ctx.globalAlpha = 1;
        }

        function tickVinyl() {
          if (!vinyl) return;
          var playing = bgMusic.isPlaying();
          var energy = bgMusic.energy || 0;
          // 目标角速度：基础转盘速 + 随能量微加速
          var targetVel = playing ? 0.55 + energy * 0.55 : 0;
          vinylVel += (targetVel - vinylVel) * (playing ? 0.045 : 0.08);
          if (Math.abs(vinylVel) < 0.002) vinylVel = 0;
          vinylAngle = (vinylAngle + vinylVel) % 360;
          vinyl.style.transform = "rotate(" + vinylAngle.toFixed(2) + "deg)";
        }

        function loop() {
          if (!phActive) return;
          tickVinyl();
          drawSpectrum();
          syncPlayUi();
          raf = requestAnimationFrame(loop);
        }

        function startPh() {
          phActive = true;
          updateClock();
          syncWallet();
          syncPlayUi();
          if (raf) cancelAnimationFrame(raf);
          raf = requestAnimationFrame(loop);
        }

        function stopPh() {
          phActive = false;
          if (raf) cancelAnimationFrame(raf);
          raf = 0;
        }

        playBtn.addEventListener("click", function () {
          bgMusic.togglePlay();
          setTimeout(syncPlayUi, 80);
        });
        prevBtn.addEventListener("click", function () {
          bgMusic.skipPrev();
          bumpArmOnSeek();
        });
        function bumpArmOnSeek() {
          if (!arm) return;
          arm.classList.add("up");
          arm.classList.remove("down");
          lastPlaying = null;
          setTimeout(function () {
            syncPlayUi();
          }, 420);
        }
        nextBtn.addEventListener("click", function () {
          bgMusic.skipNext();
          bumpArmOnSeek();
        });
        orderChip.addEventListener("click", function () {
          bgMusic.setShuffle(false);
          syncPlayUi();
        });
        shuffleChip.addEventListener("click", function () {
          bgMusic.setShuffle(true);
          syncPlayUi();
        });

        // 迷你三格：与横屏共用余额存档；符号表与主游戏一致
        var MINI_SYMBOLS = [
          { label: "7️⃣", mult: 50 },
          { label: "🌸", mult: 20 },
          { label: "🌺", mult: 15 },
          { label: "🍇", mult: 10 },
          { label: "🍓", mult: 8 },
          { label: "🍒", mult: 6 },
          { label: "🍄", mult: 4 },
        ];

        function randSym() {
          return MINI_SYMBOLS[(Math.random() * MINI_SYMBOLS.length) | 0];
        }

        function setReel(el, sym) {
          if (!el) return;
          el.innerHTML = "<span>" + sym.label + "</span>";
        }

        spinBtn.addEventListener("click", function () {
          if (miniSpinning) return;
          var sc = getScene();
          var bet = sc ? sc.bet : 50;
          var bal = sc ? sc.balance : 1000;
          try {
            if (!sc) {
              var raw = localStorage.getItem("wanjin_slot_save");
              if (raw) {
                var s = JSON.parse(raw);
                if (typeof s.balance === "number") bal = s.balance;
                if (typeof s.bet === "number") bet = s.bet;
              }
            }
          } catch (e) {}
          if (bal < bet) {
            setMsg("—");
            return;
          }
          miniSpinning = true;
          spinBtn.disabled = true;
          bal -= bet;
          if (sc) {
            sc.balance = bal;
            if (sc.updateDisplay) sc.updateDisplay();
            else if (sc.saveGameState) sc.saveGameState();
          } else {
            try {
              var payload = JSON.stringify({
                balance: bal,
                bet: bet,
                jackpotValue: 25800,
              });
              localStorage.setItem("wanjin_slot_save", payload);
            } catch (e) {}
          }
          syncWallet();
          setMsg("");

          var ticks = 0;
          var timer = setInterval(function () {
            setReel(reelEls[0], randSym());
            setReel(reelEls[1], randSym());
            setReel(reelEls[2], randSym());
            ticks++;
            if (ticks > 12) {
              clearInterval(timer);
              var a = randSym();
              var b = randSym();
              var c = randSym();
              setReel(reelEls[0], a);
              setReel(reelEls[1], b);
              setReel(reelEls[2], c);
              var win = 0;
              if (a.label === b.label && b.label === c.label) {
                win = bet * a.mult;
                setMsg(a.label + a.label + a.label + " +" + win);
              } else if (
                a.label === b.label ||
                a.label === c.label ||
                b.label === c.label
              ) {
                win = bet * 2;
                setMsg("一对 +" + win);
              } else {
                setMsg("");
              }
              if (win > 0) {
                bal += win;
                if (sc) {
                  sc.balance = bal;
                  sc.lastWin = win;
                  if (sc.updateDisplay) sc.updateDisplay();
                  else if (sc.saveGameState) sc.saveGameState();
                } else {
                  try {
                    localStorage.setItem(
                      "wanjin_slot_save",
                      JSON.stringify({
                        balance: bal,
                        bet: bet,
                        jackpotValue: 25800,
                      }),
                    );
                  } catch (e) {}
                }
              }
              syncWallet();
              miniSpinning = false;
              spinBtn.disabled = false;
            }
          }, 70);
        });

        setInterval(updateClock, 1000);
        updateClock();
        syncWallet();
        syncPlayUi();

        window.__phonograph = {
          start: startPh,
          stop: stopPh,
          sync: function () {
            syncWallet();
            syncPlayUi();
          },
        };
      })();

      // 横竖屏切换：竖屏留声机 / 横屏老虎机
      (function setupOrientationTransition() {
        var tip = document.getElementById("rotate-tip");
        var game = document.getElementById("game");
        if (!tip || !game) return;

        var lastPortrait = null;

        function apply(portrait, animate) {
          if (portrait === lastPortrait) return;
          lastPortrait = portrait;

          if (portrait) {
            game.classList.add("dimmed");
            if (animate && window.requestAnimationFrame) {
              requestAnimationFrame(function () {
                tip.classList.add("show");
              });
            } else {
              tip.classList.add("show");
            }
            if (window.__phonograph) window.__phonograph.start();
          } else {
            tip.classList.remove("show");
            if (window.__phonograph) window.__phonograph.stop();
            if (animate) {
              setTimeout(function () {
                game.classList.remove("dimmed");
              }, 420);
            } else {
              game.classList.remove("dimmed");
            }
            if (window.__phonograph) window.__phonograph.sync();
          }
        }

        function isPortrait() {
          try {
            if (window.matchMedia) {
              return window.matchMedia("(orientation: portrait)").matches;
            }
          } catch (e) {}
          return window.innerHeight > window.innerWidth;
        }

        function check(animate) {
          apply(isPortrait(), animate);
        }

        check(false);

        var onChange = function () {
          check(true);
        };
        window.addEventListener("orientationchange", onChange);
        window.addEventListener("resize", onChange);

        try {
          if (window.matchMedia) {
            var mql = window.matchMedia("(orientation: portrait)");
            if (mql.addEventListener) {
              mql.addEventListener("change", onChange);
            } else if (mql.addListener) {
              mql.addListener(onChange);
            }
          }
        } catch (e) {}
      })();
    </script>
  </body>
